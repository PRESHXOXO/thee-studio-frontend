name: Temporary Owner Entitlement Surface Trace

on:
  push:
    branches: [ops/cast-upload-debug-20260908]
    paths: [.github/workflows/cast-upload-live-diagnostic.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: production
    env:
      CUTOVER_OWNER_EMAIL: ${{ secrets.CUTOVER_OWNER_EMAIL }}
      CUTOVER_OWNER_PASSWORD: ${{ secrets.CUTOVER_OWNER_PASSWORD }}

    steps:
      - name: Inspect owner entitlement resources read-only
        shell: bash
        run: |
          set -euo pipefail
          node -e "const fs=require('fs');const email=String(process.env.CUTOVER_OWNER_EMAIL||'').normalize('NFKC').replace(/[\\u200B-\\u200D\\u2060\\uFEFF]/g,'').trim().toLowerCase();const password=process.env.CUTOVER_OWNER_PASSWORD||'';if(!email||!password)process.exit(2);fs.writeFileSync('/tmp/login.json',JSON.stringify({email,password}),{mode:0o600});"
          trap 'rm -f /tmp/login.json /tmp/jar /tmp/body /tmp/uid' EXIT
          base='https://studio.myvitaworld.online/api'
          ua='Mozilla/5.0 Chrome/152.0.0.0 Safari/537.36'

          code=$(curl -sS --compressed -A "$ua" -c /tmp/jar -b /tmp/jar -H 'Content-Type: application/json' -X POST --data-binary @/tmp/login.json -o /tmp/body -w '%{http_code}' "$base/auth/login")
          echo "LOGIN_HTTP=$code"
          test "$code" = 200

          curl -sS --compressed -A "$ua" -c /tmp/jar -b /tmp/jar "$base/auth/me" -o /tmp/body
          node <<'NODE'
          const fs=require('fs');const x=JSON.parse(fs.readFileSync('/tmp/body','utf8'));const u=x.user||x;if(!u?.id)process.exit(3);fs.writeFileSync('/tmp/uid',String(u.id));const m=u.appMetadata||u.app_metadata||{};console.log('AUTH_ME_KEYS='+Object.keys(u).filter(k=>!['id','email'].includes(k)).sort().join(','));console.log('APP_METADATA_KEYS='+Object.keys(m).sort().join(','));console.log('ROLE='+String(m.role||u.role||'none'));console.log('ACCOUNT_TYPE='+String(m.accountType||m.account_type||u.accountType||u.account_type||'none'));
          NODE
          uid=$(cat /tmp/uid)

          for table in account_entitlements user_usage_monthly subscriptions profiles users; do
            for suffix in '' "?user_id=$uid"; do
              code=$(curl -sS --compressed -A "$ua" -c /tmp/jar -b /tmp/jar -o /tmp/body -w '%{http_code}' "$base/compat/$table$suffix" || true)
              TABLE="$table" SUFFIX="$suffix" STATUS="$code" node <<'NODE'
          const fs=require('fs');let x=null;try{x=JSON.parse(fs.readFileSync('/tmp/body','utf8'))}catch{}
          console.log(`RESOURCE=${process.env.TABLE}${process.env.SUFFIX?'?user_id=self':''} HTTP=${process.env.STATUS}`);
          if(!x||typeof x!=='object') process.exit(0);
          const rows=Array.isArray(x)?x:(Array.isArray(x.rows)?x.rows:(Array.isArray(x.items)?x.items:[]));
          console.log('TOP_KEYS='+Object.keys(x).sort().join(','));
          console.log('ROW_COUNT='+rows.length);
          if(rows.length){
            const r=rows[0]||{};
            console.log('ROW_KEYS='+Object.keys(r).sort().join(','));
            const allowed=['billing_exempt','credit_deduction_enabled','account_type','role','included_credits','used_credits','period_start','status','plan_key','active','internal_only','all_features','admin_access_enabled','usage_tracking_enabled','enforcement_enabled'];
            const safe={}; for(const k of allowed) if(r[k]!==undefined) safe[k]=r[k];
            console.log('ROW_SAFE='+JSON.stringify(safe));
          } else if(x.error||x.message) console.log('ERROR='+String(x.error||x.message).slice(0,300));
          NODE
            done
          done
