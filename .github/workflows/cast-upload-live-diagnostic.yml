name: Temporary Credit Regression Diagnostic

on:
  push:
    branches: [ops/cast-upload-debug-20260908]
    paths: [.github/workflows/cast-upload-live-diagnostic.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CPANEL_SSH_HOST: ${{ secrets.CPANEL_SSH_HOST }}
      CPANEL_SSH_PORT: ${{ secrets.CPANEL_SSH_PORT }}
      CPANEL_SSH_USER: ${{ secrets.CPANEL_SSH_USER }}

    steps:
      - name: Configure scoped SSH
        env:
          KEY: ${{ secrets.CPANEL_SSH_PRIVATE_KEY }}
          HOSTS: ${{ secrets.CPANEL_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/thee_operator
          printf '%s\n' "$HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/thee_operator ~/.ssh/known_hosts

      - name: Inspect readable source snapshots read-only
        shell: bash
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -i ~/.ssh/thee_operator -p "$CPANEL_SSH_PORT" "$CPANEL_SSH_USER@$CPANEL_SSH_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          echo "=== THEE FUNCTIONS TREE ==="
          find "$HOME/thee-functions-20260827" -maxdepth 3 -type f -printf '%P\n' 2>/dev/null | sort | head -n 160 || true
          echo "=== RUNTIME HEALTH TREE ==="
          find "$HOME/thee-runtime-health" -maxdepth 3 -type f -printf '%P\n' 2>/dev/null | sort | head -n 120 || true
          echo "=== PRODUCTION ZIP MATCHES ==="
          z="$HOME/.trash/thee-studio-production-fca172b-cpanel.zip"
          if test -r "$z"; then
            unzip -l "$z" 2>/dev/null | grep -E 'src/(generation|server|worker|worker-main)\.js|package\.json|migration|entitlement|billing' | head -n 200 || true
          else
            echo "NO_READABLE_PRODUCTION_ZIP"
          fi
          echo "=== DEPLOY BACKUP NAMES ==="
          find "$HOME/deploy-backups" -maxdepth 2 -type f -printf '%P\n' 2>/dev/null | sort | tail -n 100 || true
          REMOTE
