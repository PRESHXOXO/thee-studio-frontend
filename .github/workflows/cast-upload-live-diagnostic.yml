name: Temporary Cast Upload Live Diagnostic

on:
  push:
    branches:
      - ops/cast-upload-debug-20260908
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CPANEL_SSH_HOST: ${{ secrets.CPANEL_SSH_HOST }}
      CPANEL_SSH_PORT: ${{ secrets.CPANEL_SSH_PORT }}
      CPANEL_SSH_USER: ${{ secrets.CPANEL_SSH_USER }}
      CPANEL_DEPLOY_PATH: ${{ secrets.CPANEL_DEPLOY_PATH }}

    steps:
      - name: Configure scoped SSH
        env:
          CPANEL_SSH_PRIVATE_KEY: ${{ secrets.CPANEL_SSH_PRIVATE_KEY }}
          CPANEL_SSH_KNOWN_HOSTS: ${{ secrets.CPANEL_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$CPANEL_SSH_PRIVATE_KEY" > ~/.ssh/thee_operator
          printf '%s\n' "$CPANEL_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/thee_operator ~/.ssh/known_hosts

      - name: Inspect live reference mapping and preview code read-only
        shell: bash
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o ConnectTimeout=10 \
            -i ~/.ssh/thee_operator -p "$CPANEL_SSH_PORT" \
            "$CPANEL_SSH_USER@$CPANEL_SSH_HOST" \
            "WEB='$CPANEL_DEPLOY_PATH' bash -s" <<'REMOTE' | tee cast-mapper-trace.txt
          set -euo pipefail
          asset_rel=$(grep -oE 'assets/index-[^" ]+\.js' "$WEB/index.html" | head -1)
          asset="$WEB/$asset_rel"
          echo "ACTIVE_ASSET=$asset_rel"
          test -r "$asset"
          python3 - "$asset" <<'PY'
          import sys
          path=sys.argv[1]
          text=open(path,'r',encoding='utf-8',errors='ignore').read()
          keys=[
            'function Ll',
            'Ll=',
            'listReferenceAssets',
            'uploadReferenceAsset',
            'reference_type',
            'signed_url',
            'public_url',
            'preview_url',
            'identityReferences.images',
            'Uploading headshot',
            'Headshot',
            'primaryReference'
          ]
          seen=[]
          for key in keys:
              start=0
              found=0
              while True:
                  pos=text.find(key,start)
                  if pos<0 or found>=4:
                      break
                  found+=1
                  lo=max(0,pos-900); hi=min(len(text),pos+1900)
                  sig=(lo,hi)
                  if sig not in seen:
                      seen.append(sig)
                      print(f'\n--- KEY {key!r} @ {pos} ---')
                      print(text[lo:hi].replace('\n',' '))
                  start=pos+len(key)
          PY
          REMOTE

      - name: Upload mapper trace
        uses: actions/upload-artifact@v4
        with:
          name: cast-mapper-trace
          path: cast-mapper-trace.txt
          if-no-files-found: error
          retention-days: 1
