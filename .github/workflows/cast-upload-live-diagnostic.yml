name: Temporary Managed Runtime Helper Contract Trace

on:
  push:
    branches: [ops/cast-upload-debug-20260908]
    paths: [.github/workflows/cast-upload-live-diagnostic.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CPANEL_SSH_HOST: ${{ secrets.CPANEL_SSH_HOST }}
      CPANEL_SSH_PORT: ${{ secrets.CPANEL_SSH_PORT }}
      CPANEL_SSH_USER: ${{ secrets.CPANEL_SSH_USER }}
    steps:
      - name: Configure scoped SSH
        env:
          KEY: ${{ secrets.CPANEL_SSH_PRIVATE_KEY }}
          HOSTS: ${{ secrets.CPANEL_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/thee_operator
          printf '%s\n' "$HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/thee_operator ~/.ssh/known_hosts
      - name: Inspect managed runtime helper contracts read-only
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -i ~/.ssh/thee_operator -p "$CPANEL_SSH_PORT" "$CPANEL_SSH_USER@$CPANEL_SSH_HOST" 'python3 -' > helper-contracts.txt <<'PY'
          import os,re,glob
          home=os.path.expanduser('~')
          names=['pull-managed-runtime.py','configure-runtime.sh','monitor-runtime.sh','backup.sh','thee-studio-backup.cron','thee-studio-runtime-monitor.cron','app-migrations.log']
          secret=re.compile(r'(password|passwd|token|secret|private[_-]?key|api[_-]?key|authorization|cookie)',re.I)
          urlcred=re.compile(r'([a-z]+://[^:/\s]+:)[^@\s]+(@)',re.I)
          for name in names:
              p=os.path.join(home,name)
              print('\n=== FILE',name,'EXISTS='+str(os.path.isfile(p)),'===')
              if not os.path.isfile(p): continue
              try:
                  lines=open(p,encoding='utf-8',errors='replace').read().splitlines()
              except Exception as e:
                  print('READ_ERROR',type(e).__name__); continue
              for line in lines[-800:]:
                  if secret.search(line):
                      # retain command/variable names but redact RHS and obvious credential-bearing text
                      line=re.sub(r'([A-Za-z_][A-Za-z0-9_]*(?:PASSWORD|PASSWD|TOKEN|SECRET|PRIVATE_KEY|API_KEY)[A-Za-z0-9_]*\s*[=:]\s*).*',r'\1[REDACTED]',line,flags=re.I)
                      if secret.search(line) and ('=' not in line and ':' not in line):
                          line='[REDACTED SECRET-BEARING LINE]'
                  line=urlcred.sub(r'\1[REDACTED]\2',line)
                  print(line[:2000])
          print('\n=== THEE FUNCTIONS TREE ===')
          root=os.path.join(home,'thee-functions-20260827')
          if os.path.isdir(root):
              for p in sorted(glob.glob(root+'/**',recursive=True))[:1000]:
                  if os.path.isfile(p): print(os.path.relpath(p,home))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: helper-contracts
          path: helper-contracts.txt
          retention-days: 1
