name: Temporary Cast Upload Live Diagnostic

on:
  push:
    branches:
      - ops/cast-upload-debug-20260908
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CPANEL_SSH_HOST: ${{ secrets.CPANEL_SSH_HOST }}
      CPANEL_SSH_PORT: ${{ secrets.CPANEL_SSH_PORT }}
      CPANEL_SSH_USER: ${{ secrets.CPANEL_SSH_USER }}

    steps:
      - name: Configure scoped SSH
        env:
          CPANEL_SSH_PRIVATE_KEY: ${{ secrets.CPANEL_SSH_PRIVATE_KEY }}
          CPANEL_SSH_KNOWN_HOSTS: ${{ secrets.CPANEL_SSH_KNOWN_HOSTS }}
        run: |
          set -eu
          test -n "$CPANEL_SSH_HOST"
          test -n "$CPANEL_SSH_PORT"
          test -n "$CPANEL_SSH_USER"
          test -n "$CPANEL_SSH_PRIVATE_KEY"
          test -n "$CPANEL_SSH_KNOWN_HOSTS"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$CPANEL_SSH_PRIVATE_KEY" > ~/.ssh/thee_operator
          printf '%s\n' "$CPANEL_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/thee_operator ~/.ssh/known_hosts

      - name: Copy exact deployed frontend bundle read-only
        shell: bash
        run: |
          set -euo pipefail
          WEB=/home/brandingbybella/public_html/studio
          SSH=(ssh -o BatchMode=yes -o ConnectTimeout=10 -i ~/.ssh/thee_operator -p "$CPANEL_SSH_PORT")
          SCP=(scp -q -o BatchMode=yes -o ConnectTimeout=10 -i ~/.ssh/thee_operator -P "$CPANEL_SSH_PORT")
          target="$CPANEL_SSH_USER@$CPANEL_SSH_HOST"
          asset=$("${SSH[@]}" "$target" "grep -oE 'assets/[^\" ]+\\.js' '$WEB/index.html' | head -1")
          test -n "$asset"
          printf '%s\n' "$asset" > active-asset.txt
          "${SCP[@]}" "$target:$WEB/index.html" live-index.html
          "${SCP[@]}" "$target:$WEB/$asset" live-index.js

      - name: Inspect live Cast upload implementation read-only
        shell: bash
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o ConnectTimeout=10 \
            -i ~/.ssh/thee_operator -p "$CPANEL_SSH_PORT" \
            "$CPANEL_SSH_USER@$CPANEL_SSH_HOST" 'bash -s' <<'REMOTE' | tee cast-live-diagnostic.txt
          set -eu
          APP=/opt/thee-studio-app
          WEB=/home/brandingbybella/public_html/studio

          echo '=== identity / access ==='
          id
          printf 'app_readable=%s app_writable=%s web_readable=%s web_writable=%s\n' \
            "$(test -r "$APP/src" && echo yes || echo no)" \
            "$(test -w "$APP/src" && echo yes || echo no)" \
            "$(test -r "$WEB" && echo yes || echo no)" \
            "$(test -w "$WEB" && echo yes || echo no)"

          echo '=== deployed index asset refs ==='
          grep -oE 'assets/[^" ]+\.js' "$WEB/index.html" 2>/dev/null | head -20 || true

          echo '=== unauthenticated API shape ==='
          base=http://127.0.0.1:4310
          uuid=00000000-0000-4000-8000-000000000000
          for path in \
            "/api/creators/$uuid/references" \
            "/api/creators/$uuid/references/upload" \
            "/api/creators/$uuid/reference-assets" \
            "/api/creators/$uuid/assets" \
            "/api/creator-references" \
            "/api/reference-assets" \
            "/api/uploads"; do
            for method in GET POST DELETE; do
              tmp=$(mktemp)
              if [ "$method" = POST ]; then
                code=$(curl -sS --max-time 5 -X POST -H 'Content-Type: application/json' -d '{}' -o "$tmp" -w '%{http_code}' "$base$path" || true)
              else
                code=$(curl -sS --max-time 5 -X "$method" -o "$tmp" -w '%{http_code}' "$base$path" || true)
              fi
              body=$(head -c 400 "$tmp" | tr '\n' ' ')
              rm -f "$tmp"
              printf '%s %s -> %s | %s\n' "$method" "$path" "$code" "$body"
            done
          done
          REMOTE

      - name: Upload deployed bundle and diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: cast-live-bundle
          path: |
            active-asset.txt
            live-index.html
            live-index.js
            cast-live-diagnostic.txt
          if-no-files-found: error
          retention-days: 1
