name: Temporary Generation Validation Diagnostic

on:
  push:
    branches:
      - ops/cast-upload-debug-20260908
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CPANEL_SSH_HOST: ${{ secrets.CPANEL_SSH_HOST }}
      CPANEL_SSH_PORT: ${{ secrets.CPANEL_SSH_PORT }}
      CPANEL_SSH_USER: ${{ secrets.CPANEL_SSH_USER }}
      CPANEL_DEPLOY_PATH: ${{ secrets.CPANEL_DEPLOY_PATH }}

    steps:
      - name: Configure scoped SSH
        env:
          CPANEL_SSH_PRIVATE_KEY: ${{ secrets.CPANEL_SSH_PRIVATE_KEY }}
          CPANEL_SSH_KNOWN_HOSTS: ${{ secrets.CPANEL_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$CPANEL_SSH_PRIVATE_KEY" > ~/.ssh/thee_operator
          printf '%s\n' "$CPANEL_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/thee_operator ~/.ssh/known_hosts

      - name: Trace production validation source read-only
        shell: bash
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o ConnectTimeout=10 \
            -i ~/.ssh/thee_operator -p "$CPANEL_SSH_PORT" \
            "$CPANEL_SSH_USER@$CPANEL_SSH_HOST" \
            "WEB='$CPANEL_DEPLOY_PATH' bash -s" <<'REMOTE' | tee generation-validation-trace.txt
          set -euo pipefail
          asset_rel=$(grep -oE 'assets/index-[^" ]+\.js' "$WEB/index.html" | head -1)
          asset="$WEB/$asset_rel"
          echo "ACTIVE_ASSET=$asset_rel"
          echo "ACTIVE_SHA256=$(sha256sum "$asset" | awk '{print $1}')"
          python3 - "$asset" <<'PY'
          import sys
          text=open(sys.argv[1],'r',encoding='utf-8',errors='ignore').read()
          needles=['failedPrompt','creator are invalid','creator is invalid','invalid.','tsFastifySubmitDirectorSlot','/generation']
          for needle in needles:
              print(f'\n=== NEEDLE {needle!r} count={text.count(needle)} ===')
              start=0
              for idx in range(8):
                  pos=text.find(needle,start)
                  if pos<0: break
                  print(f'--- hit {idx+1} @ {pos} ---')
                  print(text[max(0,pos-1800):min(len(text),pos+4200)].replace('\n',' '))
                  start=pos+len(needle)
          PY
          echo '\n=== HOME LOG CANDIDATES ==='
          find "$HOME" -maxdepth 4 -type f \( -name '*.log' -o -name '*error*' -o -name '*access*' \) -mmin -180 2>/dev/null | head -80 || true
          REMOTE

      - name: Upload trace
        uses: actions/upload-artifact@v4
        with:
          name: generation-validation-trace
          path: generation-validation-trace.txt
          if-no-files-found: error
          retention-days: 1
