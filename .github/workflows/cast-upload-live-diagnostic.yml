name: Temporary Cast Upload Live Diagnostic

on:
  push:
    branches:
      - ops/cast-upload-debug-20260908
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CPANEL_SSH_HOST: ${{ secrets.CPANEL_SSH_HOST }}
      CPANEL_SSH_PORT: ${{ secrets.CPANEL_SSH_PORT }}
      CPANEL_SSH_USER: ${{ secrets.CPANEL_SSH_USER }}
      CPANEL_DEPLOY_PATH: ${{ secrets.CPANEL_DEPLOY_PATH }}

    steps:
      - name: Configure scoped SSH
        env:
          CPANEL_SSH_PRIVATE_KEY: ${{ secrets.CPANEL_SSH_PRIVATE_KEY }}
          CPANEL_SSH_KNOWN_HOSTS: ${{ secrets.CPANEL_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$CPANEL_SSH_PRIVATE_KEY" > ~/.ssh/thee_operator
          printf '%s\n' "$CPANEL_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/thee_operator ~/.ssh/known_hosts

      - name: Trace full-body upload and live handler read-only
        shell: bash
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o ConnectTimeout=10 \
            -i ~/.ssh/thee_operator -p "$CPANEL_SSH_PORT" \
            "$CPANEL_SSH_USER@$CPANEL_SSH_HOST" \
            "WEB='$CPANEL_DEPLOY_PATH' bash -s" <<'REMOTE' | tee cast-fullbody-trace.txt
          set -euo pipefail
          asset_rel=$(grep -oE 'assets/index-[^" ]+\.js' "$WEB/index.html" | head -1)
          asset="$WEB/$asset_rel"
          echo "ACTIVE_ASSET=$asset_rel"

          echo '=== LIVE FULL-BODY UI/HANDLER CONTEXT ==='
          python3 - "$asset" <<'PY'
          import sys
          text=open(sys.argv[1],'r',encoding='utf-8',errors='ignore').read()
          keys=['Upload Full-Body Reference','full_body', 'Qe=async', 'onUploadFullBody', 'Full body reference']
          for key in keys:
              start=0
              count=0
              while True:
                  pos=text.find(key,start)
                  if pos<0 or count>=6:
                      break
                  count+=1
                  print(f'\n--- {key!r} #{count} @ {pos} ---')
                  print(text[max(0,pos-1800):min(len(text),pos+3800)].replace('\n',' '))
                  start=pos+len(key)
          PY

          echo '=== RECENT FULL-BODY / CREATOR REFERENCE REQUESTS ==='
          for log in "$HOME"/access-logs/*studio.myvitaworld.online* "$HOME"/logs/studio.myvitaworld.online*; do
            [ -e "$log" ] || continue
            [ -r "$log" ] || continue
            case "$log" in
              *.gz) zgrep -E '/api/(assets/upload|creators/.*/references|assets/download/creator-references)' "$log" 2>/dev/null | tail -120 || true ;;
              *) grep -E '/api/(assets/upload|creators/.*/references|assets/download/creator-references)' "$log" 2>/dev/null | tail -120 || true ;;
            esac
          done
          REMOTE

      - name: Upload trace
        uses: actions/upload-artifact@v4
        with:
          name: cast-fullbody-trace
          path: cast-fullbody-trace.txt
          if-no-files-found: error
          retention-days: 1
