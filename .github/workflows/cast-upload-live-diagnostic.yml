name: Temporary Credit Regression Diagnostic

on:
  push:
    branches: [ops/cast-upload-debug-20260908]
    paths: [.github/workflows/cast-upload-live-diagnostic.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CPANEL_SSH_HOST: ${{ secrets.CPANEL_SSH_HOST }}
      CPANEL_SSH_PORT: ${{ secrets.CPANEL_SSH_PORT }}
      CPANEL_SSH_USER: ${{ secrets.CPANEL_SSH_USER }}
      CPANEL_DEPLOY_PATH: ${{ secrets.CPANEL_DEPLOY_PATH }}

    steps:
      - name: Configure scoped SSH
        env:
          KEY: ${{ secrets.CPANEL_SSH_PRIVATE_KEY }}
          HOSTS: ${{ secrets.CPANEL_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/thee_operator
          printf '%s\n' "$HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/thee_operator ~/.ssh/known_hosts

      - name: Trace production credit failure read-only
        shell: bash
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -i ~/.ssh/thee_operator -p "$CPANEL_SSH_PORT" "$CPANEL_SSH_USER@$CPANEL_SSH_HOST" \
            "WEB='$CPANEL_DEPLOY_PATH' bash -s" <<'REMOTE'
          set -euo pipefail
          asset=$(python3 - "$WEB/index.html" <<'PY'
          import re,sys
          s=open(sys.argv[1],encoding='utf-8').read(); m=re.search(r'src="/([^"]+\.js)"',s); print(m.group(1) if m else '')
          PY
          )
          echo "ACTIVE_ASSET=$asset"
          node --check "$WEB/$asset"
          echo "=== FRONTEND GENERATION CALL SITE ==="
          node - "$WEB/$asset" <<'NODE'
          const fs=require('fs'); const s=fs.readFileSync(process.argv[2],'utf8');
          const terms=['/generation','Insufficient generation credits','reserveLocalCredits','billing_exempt','account_entitlements'];
          for(const term of terms){
            let from=0, hit=0;
            while(true){const i=s.indexOf(term,from); if(i<0) break; hit++; console.log(`\n=== ${term} HIT ${hit} @ ${i} ===`); console.log(s.slice(Math.max(0,i-1800),Math.min(s.length,i+3600))); from=i+term.length; if(hit>=8) break;}
            console.log(`COUNT ${term} ${hit}`);
          }
          NODE
          echo "=== RECENT GENERATION TRAFFIC 19:18-19:24 ET ==="
          for f in "$HOME"/access-logs/*studio* "$HOME"/access-logs/*ssl* "$HOME"/logs/*studio*; do
            test -f "$f" || continue
            case "$f" in
              *.gz) zgrep -E '08/Sep/2026:19:(18|19|20|21|22|23|24).*"(GET|POST|PATCH|PUT) /(assets/index-DhbQbUSO-rosterfix2-20260908.js|studio/|api/(auth/(session|login|csrf)|generation|generation/[^ ]+|creators|library))' "$f" 2>/dev/null | tail -n 220 || true ;;
              *) grep -E '08/Sep/2026:19:(18|19|20|21|22|23|24).*"(GET|POST|PATCH|PUT) /(assets/index-DhbQbUSO-rosterfix2-20260908.js|studio/|api/(auth/(session|login|csrf)|generation|generation/[^ ]+|creators|library))' "$f" 2>/dev/null | tail -n 220 || true ;;
            esac
          done
          echo "=== SEARCH USER-READABLE LOGS FOR CREDIT ERRORS ==="
          for d in "$HOME/logs" "$HOME"; do
            test -d "$d" || continue
            grep -RniE --exclude='*.gz' --exclude='*.js' --exclude='*.map' 'insufficient generation credits|billing_exempt|generation credits|credit' "$d" 2>/dev/null | tail -n 120 || true
          done
          REMOTE
