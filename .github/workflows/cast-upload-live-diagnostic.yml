name: Temporary Owner Credit Source Recovery

on:
  push:
    branches: [ops/cast-upload-debug-20260908]
    paths: [.github/workflows/cast-upload-live-diagnostic.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CPANEL_SSH_HOST: ${{ secrets.CPANEL_SSH_HOST }}
      CPANEL_SSH_PORT: ${{ secrets.CPANEL_SSH_PORT }}
      CPANEL_SSH_USER: ${{ secrets.CPANEL_SSH_USER }}
    steps:
      - name: Configure scoped SSH
        env:
          KEY: ${{ secrets.CPANEL_SSH_PRIVATE_KEY }}
          HOSTS: ${{ secrets.CPANEL_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/thee_operator
          printf '%s\n' "$HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/thee_operator ~/.ssh/known_hosts
      - name: Copy selected function sources read-only
        run: |
          set -euo pipefail
          mkdir -p recovered/_shared recovered/thee-bootstrap-owner recovered/thee-admin-access recovered/thee-access recovered/crisp-generate-stills
          ssh -o BatchMode=yes -i ~/.ssh/thee_operator -p "$CPANEL_SSH_PORT" "$CPANEL_SSH_USER@$CPANEL_SSH_HOST" 'cat "$HOME/thee-functions-20260827/_shared/cast_credits.ts"' > recovered/_shared/cast_credits.ts
          ssh -o BatchMode=yes -i ~/.ssh/thee_operator -p "$CPANEL_SSH_PORT" "$CPANEL_SSH_USER@$CPANEL_SSH_HOST" 'cat "$HOME/thee-functions-20260827/thee-bootstrap-owner/index.ts"' > recovered/thee-bootstrap-owner/index.ts
          ssh -o BatchMode=yes -i ~/.ssh/thee_operator -p "$CPANEL_SSH_PORT" "$CPANEL_SSH_USER@$CPANEL_SSH_HOST" 'cat "$HOME/thee-functions-20260827/thee-admin-access/index.ts"' > recovered/thee-admin-access/index.ts
          ssh -o BatchMode=yes -i ~/.ssh/thee_operator -p "$CPANEL_SSH_PORT" "$CPANEL_SSH_USER@$CPANEL_SSH_HOST" 'cat "$HOME/thee-functions-20260827/thee-access/index.ts"' > recovered/thee-access/index.ts
          ssh -o BatchMode=yes -i ~/.ssh/thee_operator -p "$CPANEL_SSH_PORT" "$CPANEL_SSH_USER@$CPANEL_SSH_HOST" 'cat "$HOME/thee-functions-20260827/crisp-generate-stills/index.ts"' > recovered/crisp-generate-stills/index.ts
          grep -RniE 'Insufficient generation credits|billing_exempt|credit_deduction_enabled|bootstrap_internal_owner|user_usage_monthly|included_credits|used_credits' recovered > recovered/matches.txt || true
      - uses: actions/upload-artifact@v4
        with:
          name: owner-credit-sources
          path: recovered
          retention-days: 1
