name: Temporary Credit RPC Contract Recovery

on:
  push:
    branches: [ops/cast-upload-debug-20260908]
    paths: [.github/workflows/cast-upload-live-diagnostic.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CPANEL_SSH_HOST: ${{ secrets.CPANEL_SSH_HOST }}
      CPANEL_SSH_PORT: ${{ secrets.CPANEL_SSH_PORT }}
      CPANEL_SSH_USER: ${{ secrets.CPANEL_SSH_USER }}
    steps:
      - name: Configure scoped SSH
        env:
          KEY: ${{ secrets.CPANEL_SSH_PRIVATE_KEY }}
          HOSTS: ${{ secrets.CPANEL_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/thee_operator
          printf '%s\n' "$HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/thee_operator ~/.ssh/known_hosts
      - name: Recover provider and matching migration sources read-only
        run: |
          set -euo pipefail
          mkdir -p recovered/_shared recovered/matches
          ssh -o BatchMode=yes -i ~/.ssh/thee_operator -p "$CPANEL_SSH_PORT" "$CPANEL_SSH_USER@$CPANEL_SSH_HOST" 'cat "$HOME/thee-functions-20260827/_shared/provider.ts"' > recovered/_shared/provider.ts
          ssh -o BatchMode=yes -i ~/.ssh/thee_operator -p "$CPANEL_SSH_PORT" "$CPANEL_SSH_USER@$CPANEL_SSH_HOST" 'python3 -' > recovered/match-paths.txt <<'PY'
          import os
          home=os.path.expanduser('~')
          needles=('bootstrap_internal_owner','reserve_generation_credits','manage_account_access','account_entitlements','credit_deduction_enabled')
          skip={'node_modules','.git','.cache'}
          found=[]
          for root,dirs,files in os.walk(home):
              dirs[:]=[d for d in dirs if d not in skip]
              for name in files:
                  p=os.path.join(root,name)
                  try:
                      if os.path.getsize(p)>3_000_000: continue
                      with open(p,'r',encoding='utf-8',errors='ignore') as f: text=f.read()
                  except Exception: continue
                  hits=[n for n in needles if n in text]
                  if hits:
                      print(os.path.relpath(p,home)+' | '+','.join(hits))
          PY
          while IFS='|' read -r rel hits; do
            rel="${rel% }"; [ -n "$rel" ] || continue
            case "$rel" in
              *thee-functions-20260827/_shared/provider.ts) continue ;;
            esac
            safe=$(printf '%s' "$rel" | tr '/ ' '__')
            ssh -o BatchMode=yes -i ~/.ssh/thee_operator -p "$CPANEL_SSH_PORT" "$CPANEL_SSH_USER@$CPANEL_SSH_HOST" "cat \"\$HOME/$rel\"" > "recovered/matches/$safe" 2>/dev/null || true
          done < recovered/match-paths.txt
          grep -n -C 12 -E 'reserveCredits|reserve_generation_credits|productAccess|requireProductAccess|billing_exempt|credit_deduction_enabled|account_access|account_entitlements' recovered/_shared/provider.ts > recovered/provider-credit-excerpts.txt || true
      - uses: actions/upload-artifact@v4
        with:
          name: credit-rpc-contracts
          path: recovered
          retention-days: 1
