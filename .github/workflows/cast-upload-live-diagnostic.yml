name: Temporary Fastify Public Metadata Check

on:
  push:
    branches: [ops/cast-upload-debug-20260908]
    paths: [.github/workflows/cast-upload-live-diagnostic.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check published API metadata read-only
        shell: bash
        run: |
          set -euo pipefail
          base='https://studio.myvitaworld.online'
          ua='Mozilla/5.0 Chrome/152.0.0.0 Safari/537.36'
          : > api-metadata.txt
          for p in /api/openapi.json /api/swagger.json /api/documentation/json /api/docs/json /api/docs /api/routes /api/health /api/status /openapi.json /swagger.json /docs/json; do
            tmp=$(mktemp)
            code=$(curl -sS --compressed -A "$ua" -o "$tmp" -w '%{http_code}' "$base$p" || true)
            bytes=$(wc -c <"$tmp" | tr -d ' ')
            printf 'GET %s HTTP=%s BYTES=%s\n' "$p" "$code" "$bytes" >> api-metadata.txt
            if [ "$code" = 200 ] && [ "$bytes" -gt 0 ] && [ "$bytes" -lt 200000 ]; then
              P="$p" node - "$tmp" >> api-metadata.txt <<'NODE'
          const fs=require('fs');const s=fs.readFileSync(process.argv[2],'utf8');
          let x=null;try{x=JSON.parse(s)}catch{}
          if(x&&typeof x==='object'){
            if(x.paths&&typeof x.paths==='object') console.log('PATHS='+Object.keys(x.paths).slice(0,400).join(','));
            else console.log('JSON_KEYS='+Object.keys(x).slice(0,100).join(','));
          } else console.log('BODY_PREFIX='+s.replace(/\s+/g,' ').slice(0,300));
          NODE
            fi
            rm -f "$tmp"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: api-metadata
          path: api-metadata.txt
          retention-days: 1
