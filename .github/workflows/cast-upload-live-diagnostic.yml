name: Temporary Studio Maintenance Hook Discovery

on:
  push:
    branches:
      - ops/cast-upload-debug-20260908
    paths:
      - .github/workflows/cast-upload-live-diagnostic.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CPANEL_SSH_HOST: ${{ secrets.CPANEL_SSH_HOST }}
      CPANEL_SSH_PORT: ${{ secrets.CPANEL_SSH_PORT }}
      CPANEL_SSH_USER: ${{ secrets.CPANEL_SSH_USER }}
    steps:
      - name: Configure scoped SSH
        env:
          KEY: ${{ secrets.CPANEL_SSH_PRIVATE_KEY }}
          HOSTS: ${{ secrets.CPANEL_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$KEY" > "$HOME/.ssh/thee_operator"
          printf '%s\n' "$HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/thee_operator" "$HOME/.ssh/known_hosts"
      - name: Inspect maintenance hooks
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -i "$HOME/.ssh/thee_operator" -p "$CPANEL_SSH_PORT" "$CPANEL_SSH_USER@$CPANEL_SSH_HOST" 'bash -s' <<'REMOTE'
          set +e
          echo '=== USER CRONTAB ==='
          crontab -l 2>/dev/null | grep -Ei 'thee|studio|deploy|migrat|runtime|backup' || true
          echo '=== SYSTEM CRON ==='
          grep -RniE 'thee|studio|deploy|migrat|runtime|backup' /etc/crontab /etc/cron.d 2>/dev/null | head -100 || true
          echo '=== SYSTEMD ==='
          find /etc/systemd/system /usr/lib/systemd/system -maxdepth 2 -type f -iname '*thee*' -o -iname '*studio*' 2>/dev/null | head -100 || true
          echo '=== PRIVILEGED HELPERS ==='
          find /usr/local/bin /usr/local/sbin /opt -maxdepth 5 -type f \( -iname '*thee*' -o -iname '*studio*' -o -iname '*migrat*' -o -iname '*deploy*' \) -printf '%p %m %u:%g\n' 2>/dev/null | head -200 || true
          echo '=== HOME HELPER PERMS ==='
          for p in "$HOME"/pull-managed-runtime.py "$HOME"/configure-runtime.sh "$HOME"/monitor-runtime.sh "$HOME"/backup.sh; do
            test -e "$p" && stat -c '%n %a %U:%G' "$p"
          done
          REMOTE
