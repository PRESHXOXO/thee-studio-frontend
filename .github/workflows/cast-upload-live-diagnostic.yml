name: Temporary Fastify Source Copy Probe

on:
  push:
    branches:
      - ops/cast-upload-debug-20260908
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CPANEL_SSH_HOST: ${{ secrets.CPANEL_SSH_HOST }}
      CPANEL_SSH_PORT: ${{ secrets.CPANEL_SSH_PORT }}
      CPANEL_SSH_USER: ${{ secrets.CPANEL_SSH_USER }}

    steps:
      - name: Configure scoped SSH
        env:
          KEY: ${{ secrets.CPANEL_SSH_PRIVATE_KEY }}
          HOSTS: ${{ secrets.CPANEL_SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/thee_operator
          printf '%s\n' "$HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/thee_operator ~/.ssh/known_hosts

      - name: Locate readable generation source/test copies without mutation
        run: |
          ssh -o BatchMode=yes -i ~/.ssh/thee_operator -p "$CPANEL_SSH_PORT" "$CPANEL_SSH_USER@$CPANEL_SSH_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          echo '=== CANDIDATE FILES UNDER OPERATOR HOME ==='
          find "$HOME" -type f \( \
            -name 'generation.js' -o \
            -name 'owner-credit.test.js' -o \
            -name '*generation*.test.js' -o \
            -name '*generation*.spec.js' -o \
            -name '*smoke*.json' -o \
            -name '*smoke*.js' -o \
            -name '*smoke*.sh' \
          \) -readable -print 2>/dev/null | head -250

          echo '=== MATCHING SOURCE TEXT UNDER SMALL READABLE FILES ==='
          find "$HOME" -type f -readable -size -2M \( -name '*.js' -o -name '*.mjs' -o -name '*.cjs' -o -name '*.json' -o -name '*.txt' -o -name '*.sh' \) -print0 2>/dev/null | \
            xargs -0 grep -IlE 'registerGenerationRoutes|Prompt and creator are invalid|billing_exempt|owner-credit|stillGenerationId' 2>/dev/null | head -120 || true
          REMOTE
