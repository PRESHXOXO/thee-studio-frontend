name: Temporary Fastify Journal Trace

on:
  push:
    branches: [ops/cast-upload-debug-20260908]
    paths: [.github/workflows/cast-upload-live-diagnostic.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CPANEL_SSH_HOST: ${{ secrets.CPANEL_SSH_HOST }}
      CPANEL_SSH_PORT: ${{ secrets.CPANEL_SSH_PORT }}
      CPANEL_SSH_USER: ${{ secrets.CPANEL_SSH_USER }}
    steps:
      - name: Configure scoped SSH
        env:
          KEY: ${{ secrets.CPANEL_SSH_PRIVATE_KEY }}
          HOSTS: ${{ secrets.CPANEL_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/thee_operator
          printf '%s\n' "$HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/thee_operator ~/.ssh/known_hosts
      - name: Inspect service journal read-only
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -i ~/.ssh/thee_operator -p "$CPANEL_SSH_PORT" "$CPANEL_SSH_USER@$CPANEL_SSH_HOST" 'bash -s' > fastify-journal.txt <<'REMOTE'
          set -u
          journalctl -u thee-studio-api.service --since '2026-09-08 00:00:00' --no-pager 2>/dev/null | grep -Ei 'route|credit|entitl|billing|owner|internal|402|generation|migrat|bootstrap|listen|server' | tail -400 || true
          echo '=== PROCESS ==='
          pid=$(systemctl show thee-studio-api.service -p MainPID --value 2>/dev/null || true)
          echo "PID_PRESENT=$([ -n "$pid" ] && [ "$pid" != 0 ] && echo yes || echo no)"
          if [ -n "$pid" ] && [ "$pid" != 0 ]; then
            echo "ENV_READABLE=$([ -r /proc/$pid/environ ] && echo yes || echo no)"
          fi
          REMOTE
      - uses: actions/upload-artifact@v4
        with:
          name: fastify-journal
          path: fastify-journal.txt
          retention-days: 1
