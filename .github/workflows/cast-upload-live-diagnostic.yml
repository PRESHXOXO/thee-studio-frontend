name: Temporary Fastify Cutover Trace

on:
  push:
    branches: [ops/cast-upload-debug-20260908]
    paths: [.github/workflows/cast-upload-live-diagnostic.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CPANEL_SSH_HOST: ${{ secrets.CPANEL_SSH_HOST }}
      CPANEL_SSH_PORT: ${{ secrets.CPANEL_SSH_PORT }}
      CPANEL_SSH_USER: ${{ secrets.CPANEL_SSH_USER }}

    steps:
      - name: Configure scoped SSH
        env:
          KEY: ${{ secrets.CPANEL_SSH_PRIVATE_KEY }}
          HOSTS: ${{ secrets.CPANEL_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/thee_operator
          printf '%s\n' "$HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/thee_operator ~/.ssh/known_hosts

      - name: Capture cutover helper structure
        shell: bash
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o ConnectTimeout=10 -i ~/.ssh/thee_operator -p "$CPANEL_SSH_PORT" "$CPANEL_SSH_USER@$CPANEL_SSH_HOST" 'bash -s' > fastify-cutover-trace.txt <<'REMOTE'
          set -u
          for f in "$HOME/pull-managed-runtime.py" "$HOME/configure-runtime.sh"; do
            echo "===== $f ====="
            if [ -r "$f" ]; then
              grep -nE 'def |function|runtime|migrat|deploy|source|target|download|request|urllib|curl|rsync|cp |install|systemctl|/opt/|thee-studio|18000|database|mariadb|mysql' "$f" 2>/dev/null | head -300 || true
            else
              echo NOT_READABLE
            fi
          done
          echo '===== MIGRATION LOG EVENTS ====='
          if [ -r "$HOME/app-migrations.log" ]; then
            grep -Ei 'thee-studio|fastify|migrat|deploy|runtime|owner|entitlement|access|credit|mariadb|mysql|/opt/' "$HOME/app-migrations.log" 2>/dev/null | tail -300 || true
          else
            echo NO_READABLE_LOG
          fi
          echo '===== RELEVANT PATHS ====='
          find "$HOME" -maxdepth 5 -type f 2>/dev/null | grep -Ei 'migrat|runtime|fastify|thee-studio|deploy' | head -400 || true
          REMOTE

      - name: Upload trace
        uses: actions/upload-artifact@v4
        with:
          name: fastify-cutover-trace
          path: fastify-cutover-trace.txt
          if-no-files-found: error
          retention-days: 1
