name: Temporary Director Fastify Handoff Trace

on:
  push:
    branches:
      - ops/cast-upload-debug-20260908
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CPANEL_SSH_HOST: ${{ secrets.CPANEL_SSH_HOST }}
      CPANEL_SSH_PORT: ${{ secrets.CPANEL_SSH_PORT }}
      CPANEL_SSH_USER: ${{ secrets.CPANEL_SSH_USER }}
      CPANEL_DEPLOY_PATH: ${{ secrets.CPANEL_DEPLOY_PATH }}
      ASSET: assets/index-DhbQbUSO-genfix3-20260908.js

    steps:
      - name: Configure scoped SSH
        env:
          KEY: ${{ secrets.CPANEL_SSH_PRIVATE_KEY }}
          HOSTS: ${{ secrets.CPANEL_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/thee_operator
          printf '%s\n' "$HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/thee_operator ~/.ssh/known_hosts

      - name: Inspect every Fastify batch callsite read-only
        run: |
          ssh -o BatchMode=yes -i ~/.ssh/thee_operator -p "$CPANEL_SSH_PORT" "$CPANEL_SSH_USER@$CPANEL_SSH_HOST" \
            "WEB='$CPANEL_DEPLOY_PATH' ASSET='$ASSET' bash -s" <<'REMOTE'
          set -euo pipefail
          python3 - "$WEB/$ASSET" <<'PY'
          import sys
          text=open(sys.argv[1],encoding='utf-8',errors='ignore').read()
          needles=['tsFastifyCreateDirectorBatch(', 'positivePrompt:', 'characterGenerate']
          for needle in needles:
              print(f'=== {needle} count={text.count(needle)} ===')
              start=0
              for i in range(20):
                  pos=text.find(needle,start)
                  if pos<0: break
                  print(f'--- HIT {i+1} @ {pos} ---')
                  print(text[max(0,pos-2200):min(len(text),pos+5200)])
                  print('\n')
                  start=pos+len(needle)
          PY
          REMOTE
