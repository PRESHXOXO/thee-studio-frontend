name: Temporary Replacement Backend Source Snapshot

on:
  push:
    branches: [ops/cast-upload-debug-20260908]
    paths: [.github/workflows/cast-upload-live-diagnostic.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CPANEL_SSH_HOST: ${{ secrets.CPANEL_SSH_HOST }}
      CPANEL_SSH_PORT: ${{ secrets.CPANEL_SSH_PORT }}
      CPANEL_SSH_USER: ${{ secrets.CPANEL_SSH_USER }}

    steps:
      - name: Configure scoped SSH
        env:
          CPANEL_SSH_PRIVATE_KEY: ${{ secrets.CPANEL_SSH_PRIVATE_KEY }}
          CPANEL_SSH_KNOWN_HOSTS: ${{ secrets.CPANEL_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$CPANEL_SSH_PRIVATE_KEY" > ~/.ssh/thee_operator
          printf '%s\n' "$CPANEL_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/thee_operator ~/.ssh/known_hosts

      - name: Capture sanitized read-only source snapshot
        shell: bash
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o ConnectTimeout=10 -i ~/.ssh/thee_operator -p "$CPANEL_SSH_PORT" \
            "$CPANEL_SSH_USER@$CPANEL_SSH_HOST" 'bash -s' > replacement-backend-snapshot.txt <<'REMOTE'
          set -u
          echo "USER=$(id -un)"
          echo "UID=$(id -u)"
          echo "GROUPS=$(id -Gn)"
          for p in /opt/thee-studio-app /opt/thee-studio-app/src /opt/thee-studio-app/package.json; do
            if [ -e "$p" ]; then
              r=no; x=no; w=no
              [ -r "$p" ] && r=yes
              [ -x "$p" ] && x=yes
              [ -w "$p" ] && w=yes
              printf 'PATH=%s EXISTS=yes READ=%s EXEC=%s WRITE=%s\n' "$p" "$r" "$x" "$w"
              stat -c 'STAT=%A %U:%G %n' "$p" 2>/dev/null || true
            else
              printf 'PATH=%s EXISTS=no\n' "$p"
            fi
          done

          if cd /opt/thee-studio-app 2>/dev/null; then
            echo 'APP_CD=yes'
            if [ -r package.json ]; then
              node -e "const p=require('./package.json'); console.log('PACKAGE_NAME='+(p.name||'')); console.log('PACKAGE_VERSION='+(p.version||'')); console.log('PACKAGE_TYPE='+(p.type||'')); console.log('PACKAGE_START='+(p.scripts&&p.scripts.start||''));" 2>/dev/null || true
            fi
            if [ -d .git ]; then
              echo 'GIT_REPO=yes'
              printf 'GIT_BRANCH='; git branch --show-current 2>/dev/null || true
              printf 'GIT_HEAD='; git rev-parse HEAD 2>/dev/null || true
              origin=$(git remote get-url origin 2>/dev/null || true)
              origin=$(printf '%s' "$origin" | sed -E 's#(https?://)[^/@]+@#\1***@#')
              echo "GIT_ORIGIN=$origin"
              git status --short --branch 2>/dev/null | sed 's/^/GIT_STATUS=/' || true
            else
              echo 'GIT_REPO=no'
            fi
            echo 'SRC_FILES_BEGIN'
            find src -maxdepth 2 -type f -printf '%p\n' 2>/dev/null | sort | head -200
            echo 'SRC_FILES_END'
          else
            echo 'APP_CD=no'
          fi
          REMOTE

      - name: Upload sanitized snapshot
        uses: actions/upload-artifact@v4
        with:
          name: replacement-backend-snapshot
          path: replacement-backend-snapshot.txt
          if-no-files-found: error
          retention-days: 1
