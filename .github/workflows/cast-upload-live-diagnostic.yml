name: Temporary Cast Upload Live Diagnostic

on:
  push:
    branches:
      - ops/cast-upload-debug-20260908
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CPANEL_SSH_HOST: ${{ secrets.CPANEL_SSH_HOST }}
      CPANEL_SSH_PORT: ${{ secrets.CPANEL_SSH_PORT }}
      CPANEL_SSH_USER: ${{ secrets.CPANEL_SSH_USER }}
      CPANEL_DEPLOY_PATH: ${{ secrets.CPANEL_DEPLOY_PATH }}

    steps:
      - name: Configure scoped SSH
        env:
          CPANEL_SSH_PRIVATE_KEY: ${{ secrets.CPANEL_SSH_PRIVATE_KEY }}
          CPANEL_SSH_KNOWN_HOSTS: ${{ secrets.CPANEL_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$CPANEL_SSH_PRIVATE_KEY" > ~/.ssh/thee_operator
          printf '%s\n' "$CPANEL_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/thee_operator ~/.ssh/known_hosts

      - name: Trace creator-reference requests in current SSL logs
        shell: bash
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o ConnectTimeout=10 \
            -i ~/.ssh/thee_operator -p "$CPANEL_SSH_PORT" \
            "$CPANEL_SSH_USER@$CPANEL_SSH_HOST" \
            "WEB='$CPANEL_DEPLOY_PATH' bash -s" <<'REMOTE' | tee cast-preview-request-trace.txt
          set -euo pipefail
          asset_rel=$(grep -oE 'assets/index-[^" ]+\.js' "$WEB/index.html" | head -1)
          echo "ACTIVE_ASSET=$asset_rel"
          echo '=== access-logs entry ==='
          ls -ld "$HOME/access-logs" 2>/dev/null || true
          if [ -d "$HOME/access-logs" ]; then
            ls -la "$HOME/access-logs" 2>/dev/null | head -40 || true
          fi
          echo '=== matching private preview requests ==='
          found=0
          for log in "$HOME"/logs/studio.myvitaworld.online-ssl_log-Sep-2026* "$HOME"/access-logs/*studio.myvitaworld.online*; do
            [ -e "$log" ] || continue
            [ -r "$log" ] || continue
            case "$log" in
              *.gz) matches=$(zgrep -F '/api/assets/download/creator-references/' "$log" 2>/dev/null | tail -80 || true) ;;
              *) matches=$(grep -F '/api/assets/download/creator-references/' "$log" 2>/dev/null | tail -80 || true) ;;
            esac
            if [ -n "$matches" ]; then
              found=1
              echo "--- $log ---"
              printf '%s\n' "$matches"
            fi
          done
          if [ "$found" = 0 ]; then
            echo 'NO_MATCHING_PRIVATE_PREVIEW_REQUESTS'
            echo '=== recent API-ish requests for creator references ==='
            for log in "$HOME"/logs/studio.myvitaworld.online-ssl_log-Sep-2026* "$HOME"/access-logs/*studio.myvitaworld.online*; do
              [ -e "$log" ] || continue
              [ -r "$log" ] || continue
              case "$log" in
                *.gz) zgrep -E '/api/(creators/.*/references|assets/download|assets/upload)' "$log" 2>/dev/null | tail -100 || true ;;
                *) grep -E '/api/(creators/.*/references|assets/download|assets/upload)' "$log" 2>/dev/null | tail -100 || true ;;
              esac
            done
          fi
          REMOTE

      - name: Upload trace
        uses: actions/upload-artifact@v4
        with:
          name: cast-preview-request-trace
          path: cast-preview-request-trace.txt
          if-no-files-found: error
          retention-days: 1
