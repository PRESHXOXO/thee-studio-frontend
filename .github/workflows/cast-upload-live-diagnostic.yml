name: Temporary Cast Upload Live Diagnostic

on:
  push:
    branches:
      - ops/cast-upload-debug-20260908
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CPANEL_SSH_HOST: ${{ secrets.CPANEL_SSH_HOST }}
      CPANEL_SSH_PORT: ${{ secrets.CPANEL_SSH_PORT }}
      CPANEL_SSH_USER: ${{ secrets.CPANEL_SSH_USER }}

    steps:
      - name: Configure scoped SSH
        env:
          CPANEL_SSH_PRIVATE_KEY: ${{ secrets.CPANEL_SSH_PRIVATE_KEY }}
          CPANEL_SSH_KNOWN_HOSTS: ${{ secrets.CPANEL_SSH_KNOWN_HOSTS }}
        run: |
          set -eu
          install -d -m 700 ~/.ssh
          printf '%s\n' "$CPANEL_SSH_PRIVATE_KEY" > ~/.ssh/thee_operator
          printf '%s\n' "$CPANEL_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/thee_operator ~/.ssh/known_hosts

      - name: Probe live Cast API routes read-only
        shell: bash
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o ConnectTimeout=10 \
            -i ~/.ssh/thee_operator -p "$CPANEL_SSH_PORT" \
            "$CPANEL_SSH_USER@$CPANEL_SSH_HOST" 'bash -s' <<'REMOTE' | tee cast-route-diagnostic.txt
          set -eu
          base=http://127.0.0.1:4310
          uuid=00000000-0000-4000-8000-000000000000
          check() {
            method="$1"; url="$2"; content_type="${3:-}"
            tmp=$(mktemp)
            args=""
            if [ -n "$content_type" ]; then args="-H Content-Type:$content_type"; fi
            if [ "$method" = POST ]; then
              code=$(curl -sS --max-time 5 -X POST ${args:+$args} -d '{}' -o "$tmp" -w '%{http_code}' "$base$url" || true)
            else
              code=$(curl -sS --max-time 5 -X "$method" -o "$tmp" -w '%{http_code}' "$base$url" || true)
            fi
            body=$(head -c 400 "$tmp" | tr '\n' ' ')
            rm -f "$tmp"
            printf '%s %s -> %s | %s\n' "$method" "$url" "$code" "$body"
          }
          check GET "/api/creators/$uuid/references"
          check POST "/api/assets/upload?bucket=creator-references&creatorId=$uuid&referenceType=headshot" "application/json"
          check DELETE "/api/references/$uuid"
          REMOTE

      - name: Upload route diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: cast-route-diagnostic
          path: cast-route-diagnostic.txt
          if-no-files-found: error
          retention-days: 1
