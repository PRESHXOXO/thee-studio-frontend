name: Temporary Cast Upload Live Diagnostic

on:
  push:
    branches:
      - ops/cast-upload-debug-20260908
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CPANEL_SSH_HOST: ${{ secrets.CPANEL_SSH_HOST }}
      CPANEL_SSH_PORT: ${{ secrets.CPANEL_SSH_PORT }}
      CPANEL_SSH_USER: ${{ secrets.CPANEL_SSH_USER }}

    steps:
      - name: Configure scoped SSH
        env:
          CPANEL_SSH_PRIVATE_KEY: ${{ secrets.CPANEL_SSH_PRIVATE_KEY }}
          CPANEL_SSH_KNOWN_HOSTS: ${{ secrets.CPANEL_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$CPANEL_SSH_PRIVATE_KEY" > ~/.ssh/thee_operator
          printf '%s\n' "$CPANEL_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/thee_operator ~/.ssh/known_hosts

      - name: Trace the user's Step 2 request sequence read-only
        shell: bash
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o ConnectTimeout=10 \
            -i ~/.ssh/thee_operator -p "$CPANEL_SSH_PORT" \
            "$CPANEL_SSH_USER@$CPANEL_SSH_HOST" 'bash -s' <<'REMOTE' | tee cast-step2-trace.txt
          set -eu
          LOG="$HOME/access-logs/studio.myvitaworld.online-ssl_log"
          test -r "$LOG"
          echo '=== 16:34-16:37 Studio API traffic ==='
          grep -a '08/Sep/2026:16:3[4-7]:' "$LOG" | grep -E ' /api/|/studio/images' | tail -160 || true
          echo '=== current creator request chain ==='
          grep -a 'fc86ee91-267f-4f9e-9d09-9903ab1ee309' "$LOG" | tail -120 || true
          echo '=== creator routes around the three headshot uploads ==='
          grep -aE '08/Sep/2026:16:35:|08/Sep/2026:16:36:' "$LOG" | grep -E '/api/creators/|/api/assets/upload|/api/auth/csrf' | tail -160 || true
          REMOTE

      - name: Upload trace artifact
        uses: actions/upload-artifact@v4
        with:
          name: cast-step2-trace
          path: cast-step2-trace.txt
          if-no-files-found: error
          retention-days: 1
