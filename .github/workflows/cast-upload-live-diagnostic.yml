name: Temporary Fastify Migration and Runtime Helper Trace

on:
  push:
    branches: [ops/cast-upload-debug-20260908]
    paths: [.github/workflows/cast-upload-live-diagnostic.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CPANEL_SSH_HOST: ${{ secrets.CPANEL_SSH_HOST }}
      CPANEL_SSH_PORT: ${{ secrets.CPANEL_SSH_PORT }}
      CPANEL_SSH_USER: ${{ secrets.CPANEL_SSH_USER }}

    steps:
      - name: Configure scoped SSH
        env:
          CPANEL_SSH_PRIVATE_KEY: ${{ secrets.CPANEL_SSH_PRIVATE_KEY }}
          CPANEL_SSH_KNOWN_HOSTS: ${{ secrets.CPANEL_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$CPANEL_SSH_PRIVATE_KEY" > ~/.ssh/thee_operator
          printf '%s\n' "$CPANEL_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/thee_operator ~/.ssh/known_hosts

      - name: Capture sanitized migration and helper trace
        shell: bash
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o ConnectTimeout=10 -i ~/.ssh/thee_operator -p "$CPANEL_SSH_PORT" \
            "$CPANEL_SSH_USER@$CPANEL_SSH_HOST" 'bash -s' > fastify-migration-runtime-trace.txt <<'REMOTE'
          set -u

          scrub() {
            sed -E \
              -e 's/([A-Za-z0-9_]*(PASSWORD|PASS|TOKEN|SECRET|API_KEY|PRIVATE_KEY|ACCESS_KEY|AUTH)[A-Za-z0-9_]*[=:][[:space:]]*)[^[:space:]]+/\1[REDACTED]/Ig' \
              -e 's#(mysql://|mariadb://|postgres(ql)?://)[^[:space:]]+#\1[REDACTED]#Ig' \
              -e 's#https://[^/@[:space:]]+:[^/@[:space:]]+@#https://[REDACTED]@#g';
          }

          echo 'APP_MIGRATIONS_BEGIN'
          if [ -r "$HOME/app-migrations.log" ]; then
            stat -c 'APP_MIGRATIONS_STAT=%A %U:%G %s %y %n' "$HOME/app-migrations.log" 2>/dev/null || true
            tail -n 500 "$HOME/app-migrations.log" | scrub
          else
            echo 'NO_READABLE_APP_MIGRATIONS_LOG'
          fi
          echo 'APP_MIGRATIONS_END'

          echo 'HELPERS_BEGIN'
          for p in "$HOME/pull-managed-runtime.py" "$HOME/configure-runtime.sh" "$HOME/monitor-runtime.sh" "$HOME/backup.sh" "$HOME/thee-studio-backup.cron" "$HOME/thee-studio-runtime-monitor.cron"; do
            echo "FILE=$p"
            if [ -r "$p" ]; then
              stat -c 'STAT=%A %U:%G %s %y %n' "$p" 2>/dev/null || true
              grep -nEi 'thee-studio|/opt/|runtime|deploy|migrat|systemctl|service|sudo|install|copy|cp[[:space:]]|rsync|subprocess|os\.system|mysql|mariadb|psql|node|npm|git|curl|tar|zip|backup|restore|source|target|request|url|endpoint|function|def[[:space:]]|class[[:space:]]' "$p" 2>/dev/null \
                | scrub | sed -n '1,400p' || true
            else
              echo 'NOT_READABLE'
            fi
          done
          echo 'HELPERS_END'

          echo 'MANAGED_FUNCTION_TREE_BEGIN'
          find "$HOME/thee-functions-20260827" -maxdepth 4 -type f -printf '%s %y %p\n' 2>/dev/null | sort | head -400
          echo 'MANAGED_FUNCTION_TREE_END'

          echo 'HOME_DEPLOY_FILES_BEGIN'
          find "$HOME" -maxdepth 3 -type f \
            \( -iname '*studio*' -o -iname '*runtime*' -o -iname '*migrat*' -o -iname '*deploy*' -o -iname '*fastify*' \) \
            -printf '%s %y %p\n' 2>/dev/null | sort | head -500
          echo 'HOME_DEPLOY_FILES_END'
          REMOTE

      - name: Upload sanitized trace
        uses: actions/upload-artifact@v4
        with:
          name: fastify-migration-runtime-trace
          path: fastify-migration-runtime-trace.txt
          if-no-files-found: error
          retention-days: 1
