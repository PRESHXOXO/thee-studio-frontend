name: Temporary Credit Regression Diagnostic

on:
  push:
    branches: [ops/cast-upload-debug-20260908]
    paths: [.github/workflows/cast-upload-live-diagnostic.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CPANEL_SSH_HOST: ${{ secrets.CPANEL_SSH_HOST }}
      CPANEL_SSH_PORT: ${{ secrets.CPANEL_SSH_PORT }}
      CPANEL_SSH_USER: ${{ secrets.CPANEL_SSH_USER }}

    steps:
      - name: Configure scoped SSH
        env:
          KEY: ${{ secrets.CPANEL_SSH_PRIVATE_KEY }}
          HOSTS: ${{ secrets.CPANEL_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/thee_operator
          printf '%s\n' "$HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/thee_operator ~/.ssh/known_hosts

      - name: Find readable git working copies read-only
        shell: bash
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -i ~/.ssh/thee_operator -p "$CPANEL_SSH_PORT" "$CPANEL_SSH_USER@$CPANEL_SSH_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          echo "=== GIT WORKTREES ==="
          find "$HOME" -maxdepth 7 -type d -name .git -print 2>/dev/null | while read -r g; do
            w=${g%/.git}
            echo "WORKTREE=$w"
            git -C "$w" branch --show-current 2>/dev/null | sed 's/^/BRANCH=/' || true
            git -C "$w" rev-parse --short HEAD 2>/dev/null | sed 's/^/HEAD=/' || true
            git -C "$w" remote -v 2>/dev/null | sed -E 's#(https?://)[^/@]+@#\1[REDACTED]@#g' | head -n 4 || true
            for p in src/generation.js src/server.js src/worker-main.js package.json; do
              if test -r "$w/$p"; then echo "HAS $p"; fi
            done
          done
          REMOTE
