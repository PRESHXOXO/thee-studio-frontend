name: Temporary Replacement Backend Recovery Surface Snapshot

on:
  push:
    branches: [ops/cast-upload-debug-20260908]
    paths: [.github/workflows/cast-upload-live-diagnostic.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CPANEL_SSH_HOST: ${{ secrets.CPANEL_SSH_HOST }}
      CPANEL_SSH_PORT: ${{ secrets.CPANEL_SSH_PORT }}
      CPANEL_SSH_USER: ${{ secrets.CPANEL_SSH_USER }}

    steps:
      - name: Configure scoped SSH
        env:
          CPANEL_SSH_PRIVATE_KEY: ${{ secrets.CPANEL_SSH_PRIVATE_KEY }}
          CPANEL_SSH_KNOWN_HOSTS: ${{ secrets.CPANEL_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$CPANEL_SSH_PRIVATE_KEY" > ~/.ssh/thee_operator
          printf '%s\n' "$CPANEL_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/thee_operator ~/.ssh/known_hosts

      - name: Capture sanitized read-only recovery surface
        shell: bash
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o ConnectTimeout=10 -i ~/.ssh/thee_operator -p "$CPANEL_SSH_PORT" \
            "$CPANEL_SSH_USER@$CPANEL_SSH_HOST" 'bash -s' > replacement-backend-recovery-surface.txt <<'REMOTE'
          set -u
          echo "USER=$(id -un)"
          echo "UID=$(id -u)"
          echo "GROUPS=$(id -Gn)"
          echo "HOME=$HOME"

          echo 'SUDO_BEGIN'
          sudo -n -l 2>&1 | sed -E 's#(PASSWD|password|token|secret|key)[^,; ]*#REDACTED#Ig' | head -120 || true
          echo 'SUDO_END'

          echo 'SERVICE_BEGIN'
          systemctl show thee-studio-api.service -p FragmentPath -p User -p Group -p WorkingDirectory -p ExecStart -p ActiveState -p SubState 2>&1 | head -80 || true
          echo 'SERVICE_END'

          echo 'OPT_PATH_BEGIN'
          namei -l /opt/thee-studio-app 2>&1 | head -80 || true
          getfacl -p /opt/thee-studio-app 2>&1 | head -80 || true
          echo 'OPT_PATH_END'

          echo 'HOME_CANDIDATES_BEGIN'
          find "$HOME" -maxdepth 7 -type f \
            \( -name package.json -o -name generation.js -o -name worker.js -o -name worker-main.js -o -iname '*fastify*' -o -iname '*studio*deploy*' -o -iname '*deploy*studio*' -o -iname '*thee*studio*' \) \
            -print 2>/dev/null | sort | head -300
          echo 'HOME_CANDIDATES_END'

          echo 'HOME_DIRS_BEGIN'
          find "$HOME" -maxdepth 5 -type d \( -iname '*thee*studio*' -o -iname '*fastify*' -o -iname '*backend*' \) -print 2>/dev/null | sort | head -200
          echo 'HOME_DIRS_END'

          echo 'BIN_CANDIDATES_BEGIN'
          for d in "$HOME/bin" /usr/local/bin /usr/bin; do
            [ -d "$d" ] || continue
            find "$d" -maxdepth 1 -type f \( -iname '*studio*' -o -iname '*deploy*' -o -iname '*fastify*' \) -printf '%p\n' 2>/dev/null | sort | head -100
          done
          echo 'BIN_CANDIDATES_END'

          echo 'SSH_ALIASES_BEGIN'
          if [ -r "$HOME/.ssh/config" ]; then
            awk '/^[[:space:]]*Host[[:space:]]+/ {print $0} /^[[:space:]]*User[[:space:]]+/ {print $0} /^[[:space:]]*Port[[:space:]]+/ {print $0}' "$HOME/.ssh/config" | head -100
          else
            echo 'NO_READABLE_SSH_CONFIG'
          fi
          echo 'SSH_ALIASES_END'
          REMOTE

      - name: Upload sanitized snapshot
        uses: actions/upload-artifact@v4
        with:
          name: replacement-backend-recovery-surface
          path: replacement-backend-recovery-surface.txt
          if-no-files-found: error
          retention-days: 1
