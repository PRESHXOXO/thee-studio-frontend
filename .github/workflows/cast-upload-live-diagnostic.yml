name: Temporary Fastify Migration Handoff Recovery

on:
  push:
    branches: [ops/cast-upload-debug-20260908]
    paths: [.github/workflows/cast-upload-live-diagnostic.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CPANEL_SSH_HOST: ${{ secrets.CPANEL_SSH_HOST }}
      CPANEL_SSH_PORT: ${{ secrets.CPANEL_SSH_PORT }}
      CPANEL_SSH_USER: ${{ secrets.CPANEL_SSH_USER }}
    steps:
      - name: Configure scoped SSH
        env:
          KEY: ${{ secrets.CPANEL_SSH_PRIVATE_KEY }}
          HOSTS: ${{ secrets.CPANEL_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/thee_operator
          printf '%s\n' "$HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/thee_operator ~/.ssh/known_hosts
      - name: Recover sanitized migration and deployment handoff metadata
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p recovered
          ssh -o BatchMode=yes -i ~/.ssh/thee_operator -p "$CPANEL_SSH_PORT" "$CPANEL_SSH_USER@$CPANEL_SSH_HOST" 'python3 -' > recovered/migration-handoff.txt <<'PY'
          import os,re
          home=os.path.expanduser('~')
          paths=[os.path.join(home,'app-migrations.log')]
          safe=re.compile(r'(thee-studio|fastify|mariadb|mysql|systemctl|service|server\.js|worker-main|/opt/|deploy|migrat|node|npm|git|rsync|scp|cp |mv |install|chown|chmod|sudo|cron)',re.I)
          redact=re.compile(r'(?i)(password|passwd|token|secret|api[_-]?key|private[_-]?key|credential|authorization)(\s*[=:]\s*|\s+)[^\s,;]+')
          urlcred=re.compile(r'([a-z]+://)[^\s/@:]+:[^\s/@]+@',re.I)
          def clean(line):
              line=redact.sub(lambda m:m.group(1)+m.group(2)+'[REDACTED]',line)
              line=urlcred.sub(r'\1[REDACTED]@',line)
              line=re.sub(r'(?i)(DB_PASSWORD|DATABASE_URL|MYSQL_PWD|MARIADB_PASSWORD)=\S+',r'\1=[REDACTED]',line)
              return line
          for p in paths:
              print('===',os.path.basename(p),'===')
              if not os.path.isfile(p): print('MISSING'); continue
              with open(p,errors='ignore') as f:
                  for i,line in enumerate(f,1):
                      if safe.search(line): print(f'{i}: '+clean(line.rstrip())[:2000])
          print('=== HOME EXECUTABLE/HELPER NAMES ===')
          for root,dirs,files in os.walk(home):
              rel=os.path.relpath(root,home)
              if rel.count(os.sep)>4:
                  dirs[:] = []
                  continue
              dirs[:]=[d for d in dirs if d not in {'.git','node_modules','.cache','.npm'}]
              for name in files:
                  p=os.path.join(root,name)
                  if re.search(r'(fastify|maria|mysql|studio|deploy|migrat|bootstrap|owner|entitl|credit)',name,re.I):
                      try: st=os.stat(p)
                      except OSError: continue
                      print(f'FILE {os.path.relpath(p,home)} mode={st.st_mode & 0o777:o} bytes={st.st_size}')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: fastify-migration-handoff
          path: recovered
          retention-days: 1
