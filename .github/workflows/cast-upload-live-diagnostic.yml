name: Temporary Creator Route Probe

on:
  push:
    branches:
      - ops/cast-upload-debug-20260908
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CPANEL_SSH_HOST: ${{ secrets.CPANEL_SSH_HOST }}
      CPANEL_SSH_PORT: ${{ secrets.CPANEL_SSH_PORT }}
      CPANEL_SSH_USER: ${{ secrets.CPANEL_SSH_USER }}

    steps:
      - name: Configure scoped SSH
        env:
          KEY: ${{ secrets.CPANEL_SSH_PRIVATE_KEY }}
          HOSTS: ${{ secrets.CPANEL_SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/thee_operator
          printf '%s\n' "$HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/thee_operator ~/.ssh/known_hosts

      - name: Probe protected creator routes read-only
        run: |
          ssh -o BatchMode=yes -i ~/.ssh/thee_operator -p "$CPANEL_SSH_PORT" "$CPANEL_SSH_USER@$CPANEL_SSH_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          base='http://127.0.0.1:4310/api'
          for path in \
            '/compat/creators' \
            '/creators' \
            '/creator' \
            '/cast' \
            '/cast/creators' \
            '/studio/creators' \
            '/production/creators' \
            '/compat/cast' \
            '/compat/studio-creators'
          do
            code=$(curl -sS -o /tmp/route-body -w '%{http_code}' "$base$path" || true)
            body=$(head -c 220 /tmp/route-body 2>/dev/null | tr '\n' ' ' || true)
            printf '%-28s status=%s body=%s\n' "$path" "$code" "$body"
          done
          REMOTE
