name: Temporary Fastify Schema Probe

on:
  push:
    branches:
      - ops/cast-upload-debug-20260908
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CPANEL_SSH_HOST: ${{ secrets.CPANEL_SSH_HOST }}
      CPANEL_SSH_PORT: ${{ secrets.CPANEL_SSH_PORT }}
      CPANEL_SSH_USER: ${{ secrets.CPANEL_SSH_USER }}

    steps:
      - name: Configure scoped SSH
        env:
          KEY: ${{ secrets.CPANEL_SSH_PRIVATE_KEY }}
          HOSTS: ${{ secrets.CPANEL_SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/thee_operator
          printf '%s\n' "$HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/thee_operator ~/.ssh/known_hosts

      - name: Probe OpenAPI and route schema endpoints read-only
        run: |
          ssh -o BatchMode=yes -i ~/.ssh/thee_operator -p "$CPANEL_SSH_PORT" "$CPANEL_SSH_USER@$CPANEL_SSH_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          base='http://127.0.0.1:4310'
          for path in \
            '/documentation/json' \
            '/documentation/yaml' \
            '/docs/json' \
            '/docs/openapi.json' \
            '/openapi.json' \
            '/swagger.json' \
            '/api/documentation/json' \
            '/api/docs/json' \
            '/api/openapi.json' \
            '/api/swagger.json'; do
            tmp=$(mktemp)
            code=$(curl -sS -o "$tmp" -w '%{http_code}' "$base$path" || true)
            ctype=$(file -b --mime-type "$tmp" 2>/dev/null || true)
            printf '%-32s status=%s bytes=%s type=%s\n' "$path" "$code" "$(wc -c < "$tmp" | tr -d ' ')" "$ctype"
            if [ "$code" = 200 ]; then
              python3 - "$tmp" <<'PY'
          import sys,json
          p=sys.argv[1]
          raw=open(p,'r',encoding='utf-8',errors='ignore').read()
          try:
              doc=json.loads(raw)
          except Exception:
              print(raw[:1500]); raise SystemExit
          paths=doc.get('paths',{}) if isinstance(doc,dict) else {}
          for key,val in paths.items():
              if 'generation' in key.lower():
                  print('SCHEMA_PATH',key)
                  print(json.dumps(val,indent=2)[:12000])
          PY
            fi
            rm -f "$tmp"
          done
          REMOTE
