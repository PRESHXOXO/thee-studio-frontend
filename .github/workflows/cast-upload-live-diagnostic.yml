name: Temporary Generation Request Trace

on:
  push:
    branches:
      - ops/cast-upload-debug-20260908
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CPANEL_SSH_HOST: ${{ secrets.CPANEL_SSH_HOST }}
      CPANEL_SSH_PORT: ${{ secrets.CPANEL_SSH_PORT }}
      CPANEL_SSH_USER: ${{ secrets.CPANEL_SSH_USER }}

    steps:
      - name: Configure scoped SSH
        env:
          KEY: ${{ secrets.CPANEL_SSH_PRIVATE_KEY }}
          HOSTS: ${{ secrets.CPANEL_SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/thee_operator
          printf '%s\n' "$HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/thee_operator ~/.ssh/known_hosts

      - name: Trace recent generation traffic and readable logs
        shell: bash
        run: |
          ssh -o BatchMode=yes -i ~/.ssh/thee_operator -p "$CPANEL_SSH_PORT" "$CPANEL_SSH_USER@$CPANEL_SSH_HOST" 'bash -s' <<'REMOTE'
          set -u
          echo '=== RECENT ACCESS LOG GENERATION REQUESTS ==='
          for f in \
            "$HOME/access-logs/studio.myvitaworld.online" \
            "$HOME/access-logs/studio.myvitaworld.online-ssl_log" \
            "$HOME/logs/studio.myvitaworld.online" \
            "$HOME/logs/studio.myvitaworld.online-ssl_log"; do
            test -r "$f" || continue
            echo "--- $f ---"
            grep -E '(/api/generation|/api/creators)' "$f" | tail -80 || true
          done

          echo '=== COMPRESSED ACCESS LOG GENERATION REQUESTS ==='
          find "$HOME" -maxdepth 4 -type f \( -name '*studio*gz' -o -name '*ssl*gz' -o -name '*access*gz' \) -print 2>/dev/null | tail -30 | while read -r f; do
            hits=$(zgrep -E '(/api/generation|/api/creators)' "$f" 2>/dev/null | tail -40 || true)
            if [ -n "$hits" ]; then
              echo "--- $f ---"
              printf '%s\n' "$hits"
            fi
          done

          echo '=== READABLE APP/ERROR LOG HITS ==='
          find "$HOME" -maxdepth 5 -type f \( -iname '*.log' -o -iname '*error*' -o -iname '*.out' \) -size -25M -print 2>/dev/null | while read -r f; do
            test -r "$f" || continue
            hits=$(grep -Ei 'failedPrompt|prompt and creator|generation.*invalid|creator.*invalid|generation_failed' "$f" 2>/dev/null | tail -30 || true)
            if [ -n "$hits" ]; then
              echo "--- $f ---"
              printf '%s\n' "$hits"
            fi
          done
          REMOTE
