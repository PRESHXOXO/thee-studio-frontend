name: Temporary Fastify Cutover Trace

on:
  push:
    branches: [ops/cast-upload-debug-20260908]
    paths: [.github/workflows/cast-upload-live-diagnostic.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CPANEL_SSH_HOST: ${{ secrets.CPANEL_SSH_HOST }}
      CPANEL_SSH_PORT: ${{ secrets.CPANEL_SSH_PORT }}
      CPANEL_SSH_USER: ${{ secrets.CPANEL_SSH_USER }}

    steps:
      - name: Configure scoped SSH
        env:
          KEY: ${{ secrets.CPANEL_SSH_PRIVATE_KEY }}
          HOSTS: ${{ secrets.CPANEL_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/thee_operator
          printf '%s\n' "$HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/thee_operator ~/.ssh/known_hosts

      - name: Capture sanitized cutover helpers
        shell: bash
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o ConnectTimeout=10 -i ~/.ssh/thee_operator -p "$CPANEL_SSH_PORT" "$CPANEL_SSH_USER@$CPANEL_SSH_HOST" 'python3 -' > fastify-cutover-trace.txt <<'PY'
          import os,re
          files=[
            os.path.expanduser('~/pull-managed-runtime.py'),
            os.path.expanduser('~/configure-runtime.sh'),
            os.path.expanduser('~/app-migrations.log'),
          ]
          def scrub(s):
              s=re.sub(r'(?i)(password|passwd|token|secret|api[_-]?key|private[_-]?key)(\s*[=:]\s*)[^\s\"\']+', r'\1\2[REDACTED]', s)
              s=re.sub(r'(?i)(mysql|mariadb|postgres(?:ql)?):\/\/[^\s\"\']+', r'\1://[REDACTED]', s)
              s=re.sub(r'Bearer\s+[A-Za-z0-9._-]{12,}', 'Bearer [REDACTED]', s)
              return s
          for p in files:
              print('===== FILE: %s =====' % p)
              try:
                  with open(p,errors='replace') as fh:
                      data=fh.read()
                  print(scrub(data[-30000:] if p.endswith('.log') else data))
              except Exception as e:
                  print('NOT_READABLE', type(e).__name__)
          print('===== RELEVANT HOME PATHS =====')
          home=os.path.expanduser('~')
          for root,dirs,names in os.walk(home):
              depth=root[len(home):].count(os.sep)
              if depth>5:
                  dirs[:]=[]; continue
              for n in names:
                  low=n.lower()
                  if any(k in low for k in ['migrat','runtime','fastify','studio','deploy']) and not low.endswith(('.log','.map')):
                      print(os.path.join(root,n))
          PY

      - name: Upload trace
        uses: actions/upload-artifact@v4
        with:
          name: fastify-cutover-trace
          path: fastify-cutover-trace.txt
          if-no-files-found: error
          retention-days: 1
