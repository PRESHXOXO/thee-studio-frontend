name: Temporary Genfix2 Verification

on:
  push:
    branches:
      - ops/cast-upload-debug-20260908
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CPANEL_SSH_HOST: ${{ secrets.CPANEL_SSH_HOST }}
      CPANEL_SSH_PORT: ${{ secrets.CPANEL_SSH_PORT }}
      CPANEL_SSH_USER: ${{ secrets.CPANEL_SSH_USER }}
      CPANEL_DEPLOY_PATH: ${{ secrets.CPANEL_DEPLOY_PATH }}
      ASSET: assets/index-DhbQbUSO-genfix2-20260908.js

    steps:
      - name: Configure scoped SSH
        env:
          KEY: ${{ secrets.CPANEL_SSH_PRIVATE_KEY }}
          HOSTS: ${{ secrets.CPANEL_SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/thee_operator
          printf '%s\n' "$HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/thee_operator ~/.ssh/known_hosts

      - name: Verify disk bundle read-only
        run: |
          ssh -o BatchMode=yes -i ~/.ssh/thee_operator -p "$CPANEL_SSH_PORT" "$CPANEL_SSH_USER@$CPANEL_SSH_HOST" \
            "WEB='$CPANEL_DEPLOY_PATH' ASSET='$ASSET' bash -s" <<'REMOTE'
          set -euo pipefail
          test -s "$WEB/$ASSET"
          grep -Fq "src=\"/$ASSET\"" "$WEB/index.html"
          node --check "$WEB/$ASSET"
          grep -Fq 'tsFastifyResolveCreatorId' "$WEB/$ASSET"
          grep -Fq '"/compat/creators"' "$WEB/$ASSET"
          echo "DISK_OK sha256=$(sha256sum "$WEB/$ASSET" | awk '{print $1}')"
          REMOTE

      - name: Verify public HTTPS as browser
        run: |
          set -euo pipefail
          ua='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/152 Safari/537.36'
          curl -fsS -A "$ua" --resolve "studio.myvitaworld.online:443:$CPANEL_SSH_HOST" -o /tmp/index.html https://studio.myvitaworld.online/
          grep -Fq "src=\"/$ASSET\"" /tmp/index.html
          curl -fsS -A "$ua" --resolve "studio.myvitaworld.online:443:$CPANEL_SSH_HOST" -o /tmp/genfix2.js "https://studio.myvitaworld.online/$ASSET"
          node --check /tmp/genfix2.js
          grep -Fq 'tsFastifyResolveCreatorId' /tmp/genfix2.js
          grep -Fq '"/compat/creators"' /tmp/genfix2.js
          echo "PUBLIC_OK sha256=$(sha256sum /tmp/genfix2.js | awk '{print $1}')"
