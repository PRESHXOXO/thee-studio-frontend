name: Temporary Singular Generation Caller Trace

on:
  push:
    branches: [ops/cast-upload-debug-20260908]
    paths: [.github/workflows/cast-upload-live-diagnostic.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CPANEL_SSH_HOST: ${{ secrets.CPANEL_SSH_HOST }}
      CPANEL_SSH_PORT: ${{ secrets.CPANEL_SSH_PORT }}
      CPANEL_SSH_USER: ${{ secrets.CPANEL_SSH_USER }}
      CPANEL_DEPLOY_PATH: ${{ secrets.CPANEL_DEPLOY_PATH }}

    steps:
      - name: Configure scoped SSH
        env:
          KEY: ${{ secrets.CPANEL_SSH_PRIVATE_KEY }}
          HOSTS: ${{ secrets.CPANEL_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/thee_operator
          printf '%s\n' "$HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/thee_operator ~/.ssh/known_hosts

      - name: Trace generation route callsites read-only
        shell: bash
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -i ~/.ssh/thee_operator -p "$CPANEL_SSH_PORT" "$CPANEL_SSH_USER@$CPANEL_SSH_HOST" \
            "WEB='$CPANEL_DEPLOY_PATH' bash -s" <<'REMOTE'
          set -euo pipefail
          asset=$(python3 - "$WEB/index.html" <<'PY'
          import re,sys
          s=open(sys.argv[1],encoding='utf-8').read(); m=re.search(r'src="/([^"]+\.js)"',s); print(m.group(1) if m else '')
          PY
          )
          test -n "$asset"
          echo "ACTIVE_ASSET=$asset"
          echo "ACTIVE_SHA256=$(sha256sum "$WEB/$asset" | awk '{print $1}')"
          node --check "$WEB/$asset"
          node - "$WEB/$asset" <<'NODE'
          const fs=require('fs');
          const s=fs.readFileSync(process.argv[2],'utf8');
          const needles=['/generation','/generations','Generation credit limit reached.','reserveLocalCredits'];
          for(const needle of needles){
            let from=0,hit=0;
            while(true){
              const p=s.indexOf(needle,from); if(p<0) break;
              hit++;
              console.log(`\n=== ${needle} HIT ${hit} POS ${p} ===`);
              console.log(s.slice(Math.max(0,p-1600),Math.min(s.length,p+2600)));
              from=p+needle.length;
              if(hit>=12) break;
            }
            console.log(`COUNT ${needle} ${hit}`);
          }
          NODE
          REMOTE
