name: Temporary Credit Regression Diagnostic

on:
  push:
    branches: [ops/cast-upload-debug-20260908]
    paths: [.github/workflows/cast-upload-live-diagnostic.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CPANEL_SSH_HOST: ${{ secrets.CPANEL_SSH_HOST }}
      CPANEL_SSH_PORT: ${{ secrets.CPANEL_SSH_PORT }}
      CPANEL_SSH_USER: ${{ secrets.CPANEL_SSH_USER }}
      CPANEL_DEPLOY_PATH: ${{ secrets.CPANEL_DEPLOY_PATH }}

    steps:
      - name: Configure scoped SSH
        env:
          KEY: ${{ secrets.CPANEL_SSH_PRIVATE_KEY }}
          HOSTS: ${{ secrets.CPANEL_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/thee_operator
          printf '%s\n' "$HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/thee_operator ~/.ssh/known_hosts

      - name: Compact credit trace read-only
        shell: bash
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -i ~/.ssh/thee_operator -p "$CPANEL_SSH_PORT" "$CPANEL_SSH_USER@$CPANEL_SSH_HOST" \
            "WEB='$CPANEL_DEPLOY_PATH' bash -s" <<'REMOTE'
          set -euo pipefail
          asset=$(python3 - "$WEB/index.html" <<'PY'
          import re,sys
          s=open(sys.argv[1],encoding='utf-8').read(); m=re.search(r'src="/([^"]+\.js)"',s); print(m.group(1) if m else '')
          PY
          )
          echo "ACTIVE_ASSET=$asset"
          node --check "$WEB/$asset"
          node - "$WEB/$asset" <<'NODE'
          const fs=require('fs'); const s=fs.readFileSync(process.argv[2],'utf8');
          for (const term of ['Insufficient generation credits','reserveLocalCredits','billing_exempt','account_entitlements']) {
            let count=0, pos=0; while((pos=s.indexOf(term,pos))>=0){count++;pos+=term.length}
            console.log(`${term.replace(/[^A-Za-z0-9]+/g,'_').toUpperCase()}_COUNT=${count}`)
          }
          NODE
          tmp=$(mktemp)
          for f in "$HOME"/access-logs/*studio* "$HOME"/access-logs/*ssl* "$HOME"/logs/*studio*; do
            test -f "$f" || continue
            case "$f" in
              *.gz) zgrep -E '08/Sep/2026:19:(1[8-9]|2[0-9]|3[0-9]).*"(GET|POST|PATCH|PUT) /api/(generation|generation/[^ ]+|jobs|jobs/[^ ]+|auth/session)' "$f" 2>/dev/null >> "$tmp" || true ;;
              *) grep -E '08/Sep/2026:19:(1[8-9]|2[0-9]|3[0-9]).*"(GET|POST|PATCH|PUT) /api/(generation|generation/[^ ]+|jobs|jobs/[^ ]+|auth/session)' "$f" 2>/dev/null >> "$tmp" || true ;;
            esac
          done
          echo "=== GENERATION/JOBS TRAFFIC ==="
          sort -u "$tmp" | tail -n 80
          echo "=== STATUS SUMMARY ==="
          python3 - "$tmp" <<'PY'
          import re,sys,collections
          c=collections.Counter()
          for line in open(sys.argv[1],errors='ignore'):
              m=re.search(r'"(GET|POST|PATCH|PUT) (/api/(?:generation|jobs)[^ ]*) HTTP/[^\"]+" (\d{3})',line)
              if m:c[(m.group(1),m.group(2),m.group(3))]+=1
          for k,v in sorted(c.items()): print('STATUS',*k,'COUNT',v)
          PY
          echo "=== CREDIT ERROR LOG LINES ==="
          found=0
          for d in "$HOME/logs" "$HOME"; do
            test -d "$d" || continue
            hits=$(grep -RniE --exclude='*.gz' --exclude='*.js' --exclude='*.map' --exclude='*.yml' 'insufficient generation credits' "$d" 2>/dev/null | tail -n 20 || true)
            if test -n "$hits"; then printf '%s\n' "$hits"; found=1; fi
          done
          echo "CREDIT_ERROR_LOG_FOUND=$found"
          rm -f "$tmp"
          REMOTE
