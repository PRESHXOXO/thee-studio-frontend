name: Temporary Fastify Archive Recovery

on:
  push:
    branches: [ops/cast-upload-debug-20260908]
    paths: [.github/workflows/cast-upload-live-diagnostic.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CPANEL_SSH_HOST: ${{ secrets.CPANEL_SSH_HOST }}
      CPANEL_SSH_PORT: ${{ secrets.CPANEL_SSH_PORT }}
      CPANEL_SSH_USER: ${{ secrets.CPANEL_SSH_USER }}
    steps:
      - name: Configure scoped SSH
        env:
          KEY: ${{ secrets.CPANEL_SSH_PRIVATE_KEY }}
          HOSTS: ${{ secrets.CPANEL_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/thee_operator
          printf '%s\n' "$HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/thee_operator ~/.ssh/known_hosts
      - name: Inspect archived production source
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -i ~/.ssh/thee_operator -p "$CPANEL_SSH_PORT" "$CPANEL_SSH_USER@$CPANEL_SSH_HOST" 'bash -s' > archive-recovery.txt <<'REMOTE'
          set -u
          z="$HOME/.trash/thee-studio-production-fca172b-cpanel.zip"
          echo '=== MATCHING ARCHIVE PATHS ==='
          if [ ! -r "$z" ]; then echo ARCHIVE_NOT_READABLE; exit 0; fi
          unzip -Z1 "$z" 2>/dev/null | grep -Ei '(^|/)(src/.*\.(js|ts)|server\.js|generation\.js|auth.*\.(js|ts)|schema.*\.(sql|js|ts)|migrations?/|package\.json)$' | head -500 || true
          echo '=== CREDIT/AUTH FILE CANDIDATES ==='
          unzip -Z1 "$z" 2>/dev/null | grep -Ei '(generation|credit|entitle|access|auth|user|schema|migrat|server)' | head -500 || true
          REMOTE
      - uses: actions/upload-artifact@v4
        with:
          name: archive-recovery
          path: archive-recovery.txt
          retention-days: 1
