name: Temporary Replacement Backend Source Access Diagnostic

on:
  push:
    branches: [ops/cast-upload-debug-20260908]
    paths: [.github/workflows/cast-upload-live-diagnostic.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CPANEL_SSH_HOST: ${{ secrets.CPANEL_SSH_HOST }}
      CPANEL_SSH_PORT: ${{ secrets.CPANEL_SSH_PORT }}
      CPANEL_SSH_USER: ${{ secrets.CPANEL_SSH_USER }}

    steps:
      - name: Configure scoped SSH
        env:
          CPANEL_SSH_PRIVATE_KEY: ${{ secrets.CPANEL_SSH_PRIVATE_KEY }}
          CPANEL_SSH_KNOWN_HOSTS: ${{ secrets.CPANEL_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$CPANEL_SSH_PRIVATE_KEY" > ~/.ssh/thee_operator
          printf '%s\n' "$CPANEL_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/thee_operator ~/.ssh/known_hosts

      - name: Inspect scoped source access without mutation
        shell: bash
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o ConnectTimeout=10 -i ~/.ssh/thee_operator -p "$CPANEL_SSH_PORT" \
            "$CPANEL_SSH_USER@$CPANEL_SSH_HOST" 'bash -s' <<'REMOTE'
          set -u
          echo "USER=$(id -un)"
          echo "UID=$(id -u)"
          echo "GROUPS=$(id -Gn)"
          for p in /opt/thee-studio-app /opt/thee-studio-app/src /opt/thee-studio-app/src/generation.js /opt/thee-studio-app/src/worker.js /opt/thee-studio-app/src/worker-main.js /opt/thee-studio-app/package.json; do
            if [ -e "$p" ]; then
              r=no; x=no; w=no
              [ -r "$p" ] && r=yes
              [ -x "$p" ] && x=yes
              [ -w "$p" ] && w=yes
              printf 'PATH=%s EXISTS=yes READ=%s EXEC=%s WRITE=%s\n' "$p" "$r" "$x" "$w"
            else
              printf 'PATH=%s EXISTS=no\n' "$p"
            fi
          done
          echo 'HOME_CANDIDATES_BEGIN'
          find "$HOME" -maxdepth 5 -type f \( -name generation.js -o -name worker.js -o -name worker-main.js -o -name package.json \) -print 2>/dev/null | head -200
          echo 'HOME_CANDIDATES_END'
          echo 'OPT_STAT_BEGIN'
          stat -c '%A %U:%G %n' /opt/thee-studio-app /opt/thee-studio-app/src 2>&1 || true
          echo 'OPT_STAT_END'
          REMOTE
