name: Temporary Fastify Cutover Control Trace

on:
  push:
    branches: [ops/cast-upload-debug-20260908]
    paths: [.github/workflows/cast-upload-live-diagnostic.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CPANEL_SSH_HOST: ${{ secrets.CPANEL_SSH_HOST }}
      CPANEL_SSH_PORT: ${{ secrets.CPANEL_SSH_PORT }}
      CPANEL_SSH_USER: ${{ secrets.CPANEL_SSH_USER }}
    steps:
      - name: Configure scoped SSH
        env:
          KEY: ${{ secrets.CPANEL_SSH_PRIVATE_KEY }}
          HOSTS: ${{ secrets.CPANEL_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/thee_operator
          printf '%s\n' "$HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/thee_operator ~/.ssh/known_hosts
      - name: Capture control path without secret values
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -i ~/.ssh/thee_operator -p "$CPANEL_SSH_PORT" "$CPANEL_SSH_USER@$CPANEL_SSH_HOST" 'bash -s' > cutover-control.txt <<'REMOTE'
          set -u
          echo '=== pull-managed-runtime.py ==='
          sed -n '1,180p' "$HOME/pull-managed-runtime.py" 2>/dev/null | sed -E 's/(TOKEN|SECRET|PASSWORD|PASS|KEY)[A-Za-z0-9_]*[[:space:]]*=[[:space:]]*.*/\1=[REDACTED]/Ig' || true
          echo '=== crons ==='
          for f in "$HOME/thee-studio-backup.cron" "$HOME/thee-studio-runtime-monitor.cron"; do
            echo "--- $f ---"; sed -n '1,160p' "$f" 2>/dev/null || true
          done
          echo '=== shell startup references ==='
          grep -nEi 'migration|runtime|thee-studio|export|token|stack' "$HOME/.bashrc" "$HOME/.bash_profile" "$HOME/.profile" 2>/dev/null | sed -E 's/([A-Z][A-Z0-9_]*(TOKEN|SECRET|PASSWORD|PASS|KEY)[A-Z0-9_]*=).*/\1[REDACTED]/Ig' || true
          echo '=== cron table filtered ==='
          crontab -l 2>/dev/null | grep -Ei 'thee|studio|migration|runtime|backup' | sed -E 's/([A-Z][A-Z0-9_]*(TOKEN|SECRET|PASSWORD|PASS|KEY)[A-Z0-9_]*=)[^ ]+/\1[REDACTED]/Ig' || true
          REMOTE
      - uses: actions/upload-artifact@v4
        with:
          name: cutover-control
          path: cutover-control.txt
          retention-days: 1
