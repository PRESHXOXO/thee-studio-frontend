name: Temporary Live Admin Surface Trace

on:
  push:
    branches: [ops/cast-upload-debug-20260908]
    paths: [.github/workflows/cast-upload-live-diagnostic.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Trace admin and entitlement routes from live bundle
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const origin='https://studio.myvitaworld.online';
          const ua={'user-agent':'Mozilla/5.0 Chrome/152.0.0.0 Safari/537.36'};
          const html=await (await fetch(origin+'/',{headers:ua})).text();
          const scripts=[...html.matchAll(/<script[^>]+src=["']([^"']+)["']/gi)].map(m=>new URL(m[1],origin).href);
          console.log('SCRIPT_COUNT='+scripts.length);
          const clean=s=>String(s||'').replace(/\s+/g,' ').replace(/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}/g,'[EMAIL]');
          for(const url of scripts){
            const r=await fetch(url,{headers:ua}); if(!r.ok) continue;
            const text=await r.text();
            console.log('BUNDLE='+url.split('/').pop());
            const literals=new Set();
            for(const m of text.matchAll(/(["'`])([^"'`]{2,160})\1/g)){
              const v=m[2];
              if(v.startsWith('/') && /(admin|access|entitl|billing|credit|usage|user|role|account|plan|subscription)/i.test(v)) literals.add(v);
            }
            console.log('ROUTE_LITERALS='+[...literals].sort().join(','));
            for(const term of ['admin','billing_exempt','credit_deduction_enabled','account_type','internal','thee-access','support_readonly','acknowledge_alert','user_profitability','plan_profitability','entitlement','role']){
              let idx=text.indexOf(term), n=0;
              while(idx>=0&&n<8){
                console.log(`CTX_${term.replace(/[^a-z0-9]+/gi,'_')}_${n}=`+clean(text.slice(Math.max(0,idx-1200),Math.min(text.length,idx+2200))));
                idx=text.indexOf(term,idx+term.length);n++;
              }
              console.log(`COUNT_${term.replace(/[^a-z0-9]+/gi,'_')}=${n}`);
            }
          }
          NODE
