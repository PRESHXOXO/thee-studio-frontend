name: Temporary Owner Smoke Contract Diagnostic

on:
  push:
    branches:
      - ops/cast-upload-debug-20260908
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CPANEL_SSH_HOST: ${{ secrets.CPANEL_SSH_HOST }}
      CPANEL_SSH_PORT: ${{ secrets.CPANEL_SSH_PORT }}
      CPANEL_SSH_USER: ${{ secrets.CPANEL_SSH_USER }}

    steps:
      - name: Configure scoped SSH
        env:
          CPANEL_SSH_PRIVATE_KEY: ${{ secrets.CPANEL_SSH_PRIVATE_KEY }}
          CPANEL_SSH_KNOWN_HOSTS: ${{ secrets.CPANEL_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$CPANEL_SSH_PRIVATE_KEY" > ~/.ssh/thee_operator
          printf '%s\n' "$CPANEL_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/thee_operator ~/.ssh/known_hosts

      - name: Inspect prior successful owner smoke evidence read-only
        shell: bash
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o ConnectTimeout=10 \
            -i ~/.ssh/thee_operator -p "$CPANEL_SSH_PORT" \
            "$CPANEL_SSH_USER@$CPANEL_SSH_HOST" \
            "bash -s" <<'REMOTE' | tee owner-smoke-contract.txt
          set -u
          root=/tmp/thee-owner-credit-fix
          echo "USER=$(id)"
          echo "=== SMOKE DIRECTORY ==="
          ls -la "$root" 2>&1 || true
          echo "=== READABLE FILES ==="
          find "$root" -maxdepth 2 -type f -printf '%M %u %g %s %p\n' 2>/dev/null || true
          echo "=== RELEVANT CONTENT ==="
          for f in "$root"/*; do
            test -f "$f" || continue
            test -r "$f" || { echo "UNREADABLE $f"; continue; }
            case "$(basename "$f")" in
              *.json|*.txt|*.log|*.sh|*.js|*.mjs|*.cjs)
                echo "--- FILE $f ---"
                python3 - "$f" <<'PY'
          import sys,re
          p=sys.argv[1]
          text=open(p,'r',encoding='utf-8',errors='ignore').read()
          # Redact likely credentials/secrets while retaining request-shape evidence.
          text=re.sub(r'(?i)(password|authorization|cookie|csrf|token|secret)(["\'\s:=]+)([^,\n}\"]+|"[^"]*")', r'\1\2<REDACTED>', text)
          needles=['/api/generation','generation','prompt','creator','creatorId','creator_id','providerRunId','stillGenerationId','projectId','shotId','idempotency']
          if any(n in text for n in needles):
              print(text[:40000])
          PY
                ;;
            esac
          done
          REMOTE

      - name: Upload trace
        uses: actions/upload-artifact@v4
        with:
          name: owner-smoke-contract
          path: owner-smoke-contract.txt
          if-no-files-found: error
          retention-days: 1
