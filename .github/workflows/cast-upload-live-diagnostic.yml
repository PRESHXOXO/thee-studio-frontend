name: Temporary Credit Regression Diagnostic

on:
  push:
    branches: [ops/cast-upload-debug-20260908]
    paths: [.github/workflows/cast-upload-live-diagnostic.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CPANEL_SSH_HOST: ${{ secrets.CPANEL_SSH_HOST }}
      CPANEL_SSH_PORT: ${{ secrets.CPANEL_SSH_PORT }}
      CPANEL_SSH_USER: ${{ secrets.CPANEL_SSH_USER }}

    steps:
      - name: Configure scoped SSH
        env:
          KEY: ${{ secrets.CPANEL_SSH_PRIVATE_KEY }}
          HOSTS: ${{ secrets.CPANEL_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/thee_operator
          printf '%s\n' "$HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/thee_operator ~/.ssh/known_hosts

      - name: Inspect scoped app repair surfaces read-only
        shell: bash
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -i ~/.ssh/thee_operator -p "$CPANEL_SSH_PORT" "$CPANEL_SSH_USER@$CPANEL_SSH_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          echo "=== ID/GROUPS ==="
          id
          echo "=== DATABASE CLIENTS ==="
          command -v mysql || true
          command -v mariadb || true
          mysql --version 2>/dev/null || true
          mariadb --version 2>/dev/null || true
          echo "=== HOME DB CONFIG PRESENCE ==="
          for p in "$HOME/.my.cnf" "$HOME/.mylogin.cnf"; do
            if test -e "$p"; then ls -l "$p"; else echo "ABSENT $p"; fi
          done
          echo "=== READABLE REPAIR/MIGRATION CANDIDATES ==="
          find "$HOME" -maxdepth 6 -type f \( -iname '*migrat*' -o -iname '*maria*' -o -iname '*mysql*' -o -iname '*entitle*' -o -iname '*billing*' -o -iname '*thee*studio*' \) -print 2>/dev/null | head -n 120
          echo "=== EXECUTABLE CANDIDATES ==="
          for d in "$HOME/bin" /usr/local/bin /usr/bin; do
            test -d "$d" || continue
            find "$d" -maxdepth 1 -type f \( -iname '*migrat*' -o -iname '*thee*' \) -perm -u+x -print 2>/dev/null | head -n 80
          done
          echo "=== APP PROCESS VISIBILITY ==="
          ps -eo user,pid,comm,args 2>/dev/null | grep -E 'thee-studio|node|fastify' | grep -v grep | head -n 40 || true
          REMOTE
