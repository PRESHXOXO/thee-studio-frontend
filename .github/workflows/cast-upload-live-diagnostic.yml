name: Temporary Generation Validation Journal Trace

on:
  push:
    branches:
      - ops/cast-upload-debug-20260908
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CPANEL_SSH_HOST: ${{ secrets.CPANEL_SSH_HOST }}
      CPANEL_SSH_PORT: ${{ secrets.CPANEL_SSH_PORT }}
      CPANEL_SSH_USER: ${{ secrets.CPANEL_SSH_USER }}

    steps:
      - name: Configure scoped SSH
        env:
          KEY: ${{ secrets.CPANEL_SSH_PRIVATE_KEY }}
          HOSTS: ${{ secrets.CPANEL_SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/thee_operator
          printf '%s\n' "$HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/thee_operator ~/.ssh/known_hosts

      - name: Read sanitized API journal around generation validation
        run: |
          ssh -o BatchMode=yes -i ~/.ssh/thee_operator -p "$CPANEL_SSH_PORT" "$CPANEL_SSH_USER@$CPANEL_SSH_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          sanitize() {
            sed -E \
              -e 's/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}/[EMAIL]/g' \
              -e 's/[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}/[UUID]/g' \
              -e 's/("?(authorization|cookie|token|secret|password)"?[=: ]+)[^, }]+/\1[REDACTED]/Ig' \
              -e 's/("prompt"[[:space:]]*:[[:space:]]*")[^"]*(")/\1[REDACTED]\2/Ig'
          }

          echo '=== SERVICE METADATA ==='
          systemctl show thee-studio-api.service -p User -p Group -p WorkingDirectory -p ExecStart --no-pager 2>&1 | sanitize || true

          echo '=== API JOURNAL RECENT GENERATION ==='
          journalctl -u thee-studio-api.service --since '2026-09-08 17:30:00' --no-pager -o cat 2>&1 | \
            grep -Ei 'generation|creator|prompt|invalid|400|request|validation|schema|error' | tail -n 500 | sanitize || true

          echo '=== WORKER JOURNAL RECENT GENERATION ==='
          journalctl -u thee-studio-worker.service --since '2026-09-08 17:30:00' --no-pager -o cat 2>&1 | \
            grep -Ei 'generation|creator|prompt|invalid|400|request|validation|schema|error' | tail -n 300 | sanitize || true
          REMOTE
