name: Temporary Fastify Install Path Trace

on:
  push:
    branches: [ops/cast-upload-debug-20260908]
    paths: [.github/workflows/cast-upload-live-diagnostic.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CPANEL_SSH_HOST: ${{ secrets.CPANEL_SSH_HOST }}
      CPANEL_SSH_PORT: ${{ secrets.CPANEL_SSH_PORT }}
      CPANEL_SSH_USER: ${{ secrets.CPANEL_SSH_USER }}
    steps:
      - name: Configure scoped SSH
        env:
          KEY: ${{ secrets.CPANEL_SSH_PRIVATE_KEY }}
          HOSTS: ${{ secrets.CPANEL_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/thee_operator
          printf '%s\n' "$HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/thee_operator ~/.ssh/known_hosts
      - name: Trace original install and helper commands read-only
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -i ~/.ssh/thee_operator -p "$CPANEL_SSH_PORT" "$CPANEL_SSH_USER@$CPANEL_SSH_HOST" 'bash -s' > install-path.txt <<'REMOTE'
          set -u
          echo '=== HISTORY HINTS ==='
          for f in "$HOME/.bash_history" "$HOME/.zsh_history"; do
            [ -r "$f" ] || continue
            grep -Ei 'thee-studio|fastify|mariadb|mysql|systemctl|/opt/thee|migration|bootstrap|runtime' "$f" 2>/dev/null | sed -E 's/([A-Z][A-Z0-9_]*(PASSWORD|PASS|TOKEN|SECRET|KEY)[A-Z0-9_]*=)[^ ]+/\1[REDACTED]/Ig' | tail -300 || true
          done
          echo '=== SYSTEM HELPERS ==='
          find /usr/local/bin /usr/local/sbin /usr/bin /usr/sbin -maxdepth 1 -type f 2>/dev/null | grep -Ei 'thee|studio|migrat|runtime|deploy' | sort | head -200 || true
          echo '=== USER EXECUTABLES ==='
          find "$HOME" -maxdepth 4 -type f -perm -u+x 2>/dev/null | grep -Ei 'thee|studio|migrat|runtime|deploy|backup' | sort | head -250 || true
          echo '=== ROOT-MANAGED PUBLIC METADATA ==='
          for p in /opt/thee-studio-migration /opt/thee-studio-app /etc/thee-studio; do
            namei -l "$p" 2>/dev/null || true
          done
          REMOTE
      - uses: actions/upload-artifact@v4
        with:
          name: install-path
          path: install-path.txt
          retention-days: 1
