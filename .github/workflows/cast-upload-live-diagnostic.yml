name: Temporary Scoped Database Credential Discovery

on:
  push:
    branches: [ops/cast-upload-debug-20260908]
    paths: [.github/workflows/cast-upload-live-diagnostic.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: production
    env:
      CPANEL_SSH_HOST: ${{ secrets.CPANEL_SSH_HOST }}
      CPANEL_SSH_PORT: ${{ secrets.CPANEL_SSH_PORT }}
      CPANEL_SSH_USER: ${{ secrets.CPANEL_SSH_USER }}

    steps:
      - name: Configure scoped SSH
        env:
          KEY: ${{ secrets.CPANEL_SSH_PRIVATE_KEY }}
          HOSTS: ${{ secrets.CPANEL_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/thee_operator
          printf '%s\n' "$HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/thee_operator ~/.ssh/known_hosts

      - name: Discover existing app-owned DB credential path without printing secrets
        shell: bash
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -i ~/.ssh/thee_operator -p "$CPANEL_SSH_PORT" "$CPANEL_SSH_USER@$CPANEL_SSH_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          echo 'MYSQL_CLIENT_CONFIGS'
          for f in "$HOME/.my.cnf" "$HOME/.mylogin.cnf" "$HOME/.config/my.cnf"; do
            if [ -e "$f" ]; then
              stat -c 'CONFIG=%n mode=%a owner=%U group=%G readable=yes' "$f" 2>/dev/null || true
            fi
          done

          echo 'DEFAULT_CLIENT_AUTH'
          if mariadb --batch --skip-column-names -e 'SELECT DATABASE(),CURRENT_USER()' >/tmp/db-default.$$ 2>/dev/null; then
            echo 'DEFAULT_AUTH=success'
            awk -F'\t' '{print "DATABASE=" ($1=="NULL"?"none":"selected"); print "PRINCIPAL_PRESENT=" ($2!="")}' /tmp/db-default.$$
          else
            echo 'DEFAULT_AUTH=denied'
          fi
          rm -f /tmp/db-default.$$

          echo 'READABLE_CONFIG_MATCHES'
          find "$HOME" -maxdepth 7 -type f -readable \
            \( -name '.env' -o -name '.env.*' -o -name '*.env' -o -name '*.cnf' -o -name 'config.js' -o -name 'config.json' -o -name 'database.js' -o -name 'database.json' \) \
            -size -2M -print0 2>/dev/null | while IFS= read -r -d '' f; do
              if grep -Eq 'thee_studio_prod|THEE_STUDIO_DB|DATABASE_URL|DB_HOST|DB_NAME|DB_USER|DB_PASSWORD' "$f" 2>/dev/null; then
                keys=$(grep -Eo '(^|[^A-Za-z0-9_])(THEE_STUDIO_DB_[A-Z_]+|DATABASE_URL|DB_(HOST|PORT|NAME|USER|PASSWORD))' "$f" 2>/dev/null | sed -E 's/^[^A-Za-z_]*//' | sort -u | paste -sd, -)
                stat -c 'MATCH=%n mode=%a owner=%U group=%G' "$f" 2>/dev/null || true
                echo "KEY_NAMES=${keys:-none}"
              fi
            done | head -120

          echo 'DATABASE_NAME_MATCH_PATHS'
          grep -RIl --exclude='*.log' --exclude='*.js.map' --exclude-dir=node_modules --exclude-dir=.git 'thee_studio_prod' "$HOME" 2>/dev/null | head -100 | while read -r f; do
            stat -c 'DBNAME_MATCH=%n mode=%a owner=%U group=%G' "$f" 2>/dev/null || true
          done
          REMOTE
