name: Temporary Live Credit Message Trace

on:
  push:
    branches: [ops/cast-upload-debug-20260908]
    paths: [.github/workflows/cast-upload-live-diagnostic.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CPANEL_SSH_HOST: ${{ secrets.CPANEL_SSH_HOST }}
      NEW_ASSET: assets/index-DhbQbUSO-genfix4-20260908.js
    steps:
      - name: Trace live credit and quota messages in public bundle
        shell: bash
        run: |
          set -euo pipefail
          ua='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/152 Safari/537.36'
          curl -fsS -A "$ua" --resolve "studio.myvitaworld.online:443:$CPANEL_SSH_HOST" -o /tmp/live.js "https://studio.myvitaworld.online/$NEW_ASSET"
          node --check /tmp/live.js
          node <<'NODE'
          const fs=require('fs');
          const s=fs.readFileSync('/tmp/live.js','utf8');
          const terms=['Insufficient generation credits','generation credits','Insufficient','insufficient_quota','credit_balance_exhausted','project_spend_limit_exceeded','organization_spend_limit_exceeded','402','credits'];
          for(const term of terms){
            let from=0,count=0;
            while(true){
              const i=s.indexOf(term,from); if(i<0) break;
              count++;
              const a=Math.max(0,i-500), b=Math.min(s.length,i+term.length+700);
              console.log(`\n=== TERM ${JSON.stringify(term)} HIT ${count} @ ${i} ===`);
              console.log(s.slice(a,b));
              from=i+term.length;
              if(count>=12){console.log('...hit output capped...');break;}
            }
            console.log(`TERM_COUNT ${JSON.stringify(term)} ${count}`);
          }
          NODE
