name: Temporary Credit Regression Diagnostic

on:
  push:
    branches: [ops/cast-upload-debug-20260908]
    paths: [.github/workflows/cast-upload-live-diagnostic.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CPANEL_SSH_HOST: ${{ secrets.CPANEL_SSH_HOST }}
      CPANEL_SSH_PORT: ${{ secrets.CPANEL_SSH_PORT }}
      CPANEL_SSH_USER: ${{ secrets.CPANEL_SSH_USER }}
      CPANEL_DEPLOY_PATH: ${{ secrets.CPANEL_DEPLOY_PATH }}

    steps:
      - name: Configure scoped SSH
        env:
          KEY: ${{ secrets.CPANEL_SSH_PRIVATE_KEY }}
          HOSTS: ${{ secrets.CPANEL_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/thee_operator
          printf '%s\n' "$HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/thee_operator ~/.ssh/known_hosts

      - name: Inspect live admin and entitlement API call sites read-only
        shell: bash
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -i ~/.ssh/thee_operator -p "$CPANEL_SSH_PORT" "$CPANEL_SSH_USER@$CPANEL_SSH_HOST" \
            "WEB='$CPANEL_DEPLOY_PATH' bash -s" <<'REMOTE'
          set -euo pipefail
          asset=$(python3 - "$WEB/index.html" <<'PY'
          import re,sys
          s=open(sys.argv[1],encoding='utf-8').read(); m=re.search(r'src="/([^"]+\.js)"',s); print(m.group(1) if m else '')
          PY
          )
          echo "ACTIVE_ASSET=$asset"
          node - "$WEB/$asset" <<'NODE'
          const fs=require('fs'); const s=fs.readFileSync(process.argv[2],'utf8');
          const terms=['billing_exempt','credit_deduction_enabled','admin_access_enabled','/admin','/access','entitlement','credits'];
          for(const term of terms){
            let from=0,hit=0;
            while(true){const p=s.indexOf(term,from);if(p<0)break;hit++;console.log(`=== ${term} ${hit} ===`);console.log(s.slice(Math.max(0,p-1200),Math.min(s.length,p+2200)));from=p+term.length;if(hit>=8)break;}
            console.log(`COUNT ${term} ${hit}`)
          }
          const re=/["'`]((?:\/api\/|\/compat\/)[A-Za-z0-9_?=&.\-\/${}:]+)["'`]/g;
          const set=new Set(); let m; while((m=re.exec(s))) set.add(m[1]);
          console.log('=== UNIQUE API LITERALS ==='); for(const x of [...set].sort()) if(/admin|access|credit|entitl|usage|billing/i.test(x)) console.log(x);
          NODE
          REMOTE
