name: Temporary Replacement Backend Backup Inventory

on:
  push:
    branches: [ops/cast-upload-debug-20260908]
    paths: [.github/workflows/cast-upload-live-diagnostic.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CPANEL_SSH_HOST: ${{ secrets.CPANEL_SSH_HOST }}
      CPANEL_SSH_PORT: ${{ secrets.CPANEL_SSH_PORT }}
      CPANEL_SSH_USER: ${{ secrets.CPANEL_SSH_USER }}

    steps:
      - name: Configure scoped SSH
        env:
          CPANEL_SSH_PRIVATE_KEY: ${{ secrets.CPANEL_SSH_PRIVATE_KEY }}
          CPANEL_SSH_KNOWN_HOSTS: ${{ secrets.CPANEL_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$CPANEL_SSH_PRIVATE_KEY" > ~/.ssh/thee_operator
          printf '%s\n' "$CPANEL_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/thee_operator ~/.ssh/known_hosts

      - name: Inventory accessible Studio recovery copies
        shell: bash
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o ConnectTimeout=10 -i ~/.ssh/thee_operator -p "$CPANEL_SSH_PORT" \
            "$CPANEL_SSH_USER@$CPANEL_SSH_HOST" 'bash -s' > replacement-backend-backup-inventory.txt <<'REMOTE'
          set -u
          backup="$HOME/deploy-backups/studio/cast-fastify-auth-hydration-20260908T231908Z"
          trashzip="$HOME/.trash/thee-studio-production-fca172b-cpanel.zip"

          echo 'BACKUP_META_BEGIN'
          if [ -d "$backup" ]; then
            stat -c 'BACKUP_STAT=%A %U:%G %s %y %n' "$backup" 2>/dev/null || true
            echo "BACKUP_READ=$([ -r "$backup" ] && echo yes || echo no)"
            echo "BACKUP_EXEC=$([ -x "$backup" ] && echo yes || echo no)"
            echo "BACKUP_WRITE=$([ -w "$backup" ] && echo yes || echo no)"
          else
            echo 'BACKUP_MISSING=yes'
          fi
          echo 'BACKUP_META_END'

          echo 'BACKUP_TREE_BEGIN'
          find "$backup" -maxdepth 4 -printf '%y %s %p\n' 2>/dev/null | sort | head -500
          echo 'BACKUP_TREE_END'

          echo 'ZIP_META_BEGIN'
          if [ -f "$trashzip" ]; then
            stat -c 'ZIP_STAT=%A %U:%G %s %y %n' "$trashzip" 2>/dev/null || true
            echo "ZIP_READ=$([ -r "$trashzip" ] && echo yes || echo no)"
          else
            echo 'ZIP_MISSING=yes'
          fi
          echo 'ZIP_META_END'

          echo 'ZIP_LIST_BEGIN'
          if [ -r "$trashzip" ]; then
            unzip -l "$trashzip" 2>/dev/null | head -400 || true
          fi
          echo 'ZIP_LIST_END'
          REMOTE

      - name: Upload sanitized inventory
        uses: actions/upload-artifact@v4
        with:
          name: replacement-backend-backup-inventory
          path: replacement-backend-backup-inventory.txt
          if-no-files-found: error
          retention-days: 1
