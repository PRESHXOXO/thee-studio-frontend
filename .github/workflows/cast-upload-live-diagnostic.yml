name: Temporary Cast Upload Live Diagnostic

on:
  push:
    branches:
      - ops/cast-upload-debug-20260908
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CPANEL_SSH_HOST: ${{ secrets.CPANEL_SSH_HOST }}
      CPANEL_SSH_PORT: ${{ secrets.CPANEL_SSH_PORT }}
      CPANEL_SSH_USER: ${{ secrets.CPANEL_SSH_USER }}
      CPANEL_DEPLOY_PATH: ${{ secrets.CPANEL_DEPLOY_PATH }}

    steps:
      - name: Configure scoped SSH
        env:
          CPANEL_SSH_PRIVATE_KEY: ${{ secrets.CPANEL_SSH_PRIVATE_KEY }}
          CPANEL_SSH_KNOWN_HOSTS: ${{ secrets.CPANEL_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$CPANEL_SSH_PRIVATE_KEY" > ~/.ssh/thee_operator
          printf '%s\n' "$CPANEL_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/thee_operator ~/.ssh/known_hosts

      - name: Trace recent creator-reference preview requests read-only
        shell: bash
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o ConnectTimeout=10 \
            -i ~/.ssh/thee_operator -p "$CPANEL_SSH_PORT" \
            "$CPANEL_SSH_USER@$CPANEL_SSH_HOST" \
            "WEB='$CPANEL_DEPLOY_PATH' bash -s" <<'REMOTE' | tee cast-preview-request-trace.txt
          set -euo pipefail
          echo "HOME=$HOME"
          asset_rel=$(grep -oE 'assets/index-[^" ]+\.js' "$WEB/index.html" | head -1)
          echo "ACTIVE_ASSET=$asset_rel"
          echo '=== candidate readable web logs ==='
          find "$HOME" -maxdepth 4 \( -type f -o -type l \) \
            \( -iname '*access*log*' -o -iname '*error*log*' -o -path '*/logs/*' \) \
            -print 2>/dev/null | head -80
          echo '=== recent private creator-reference requests ==='
          found=0
          while IFS= read -r log; do
            [ -r "$log" ] || continue
            matches=$(grep -F '/api/assets/download/creator-references/' "$log" 2>/dev/null | tail -40 || true)
            if [ -n "$matches" ]; then
              found=1
              echo "--- $log ---"
              printf '%s\n' "$matches"
            fi
          done < <(find "$HOME" -maxdepth 4 \( -type f -o -type l \) \
            \( -iname '*access*log*' -o -iname '*error*log*' -o -path '*/logs/*' \) -print 2>/dev/null)
          if [ "$found" = 0 ]; then
            echo 'NO_MATCHING_REQUESTS_IN_READABLE_USER_LOGS'
          fi
          REMOTE

      - name: Upload trace
        uses: actions/upload-artifact@v4
        with:
          name: cast-preview-request-trace
          path: cast-preview-request-trace.txt
          if-no-files-found: error
          retention-days: 1
