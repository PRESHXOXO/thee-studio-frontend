name: Temporary Fastify Generation Contract Diagnostic

on:
  push:
    branches:
      - ops/cast-upload-debug-20260908
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CPANEL_SSH_HOST: ${{ secrets.CPANEL_SSH_HOST }}
      CPANEL_SSH_PORT: ${{ secrets.CPANEL_SSH_PORT }}
      CPANEL_SSH_USER: ${{ secrets.CPANEL_SSH_USER }}
      CPANEL_DEPLOY_PATH: ${{ secrets.CPANEL_DEPLOY_PATH }}

    steps:
      - name: Configure scoped SSH
        env:
          CPANEL_SSH_PRIVATE_KEY: ${{ secrets.CPANEL_SSH_PRIVATE_KEY }}
          CPANEL_SSH_KNOWN_HOSTS: ${{ secrets.CPANEL_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$CPANEL_SSH_PRIVATE_KEY" > ~/.ssh/thee_operator
          printf '%s\n' "$CPANEL_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/thee_operator ~/.ssh/known_hosts

      - name: Inspect generation response normalization read-only
        shell: bash
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o ConnectTimeout=10 \
            -i ~/.ssh/thee_operator -p "$CPANEL_SSH_PORT" \
            "$CPANEL_SSH_USER@$CPANEL_SSH_HOST" \
            "WEB='$CPANEL_DEPLOY_PATH' bash -s" <<'REMOTE' | tee fastify-generation-contract.txt
          set -euo pipefail
          asset_rel=$(grep -oE 'assets/index-[^" ]+\.js' "$WEB/index.html" | head -1)
          asset="$WEB/$asset_rel"
          echo "ACTIVE_ASSET=$asset_rel"
          echo "ACTIVE_SHA256=$(sha256sum "$asset" | awk '{print $1}')"
          python3 - "$asset" <<'PY'
          import sys
          text=open(sys.argv[1],'r',encoding='utf-8',errors='ignore').read()
          keys=[
            'function qr(', 'qr=function', 'const qr=',
            'function Yj(', 'Yj=',
            'function yL(', 'yL=',
            'hL("/generation"', 'hL(`/generation/${',
            '"/generation/"', '/generation/${',
            'job_id===', 'generation.state', 'parentBatchId',
            'retry-slot', '/retry', '/refund',
            'pipeline/stills', 'pipeline/runs'
          ]
          for key in keys:
              start=0; shown=0
              while True:
                  pos=text.find(key,start)
                  if pos<0 or shown>=14: break
                  shown+=1
                  print(f'\n--- {key!r} #{shown} @ {pos} ---')
                  print(text[max(0,pos-3500):min(len(text),pos+8000)].replace('\n',' '))
                  start=pos+len(key)
          PY

          echo '=== GENERATION ROUTE METHOD SHAPE (UNAUTHENTICATED; NO WRITES) ==='
          base=http://127.0.0.1:4310
          for spec in \
            'GET /api/generation/test-job' \
            'POST /api/generation/test-job/retry' \
            'POST /api/generation/test-job/cancel' \
            'GET /api/jobs/test-job' \
            'POST /api/jobs/test-job/retry'; do
            method=${spec%% *}; path=${spec#* }
            tmp=$(mktemp)
            if [ "$method" = POST ]; then
              code=$(curl -sS --max-time 5 -X POST -H 'Content-Type: application/json' -d '{}' -o "$tmp" -w '%{http_code}' "$base$path" || true)
            else
              code=$(curl -sS --max-time 5 -X GET -o "$tmp" -w '%{http_code}' "$base$path" || true)
            fi
            printf '%s %s -> %s | %s\n' "$method" "$path" "$code" "$(head -c 250 "$tmp" | tr '\n' ' ')"
            rm -f "$tmp"
          done
          REMOTE

      - name: Upload trace
        uses: actions/upload-artifact@v4
        with:
          name: fastify-generation-contract
          path: fastify-generation-contract.txt
          if-no-files-found: error
          retention-days: 1
