name: Temporary Generation Contract Diagnostic

on:
  push:
    branches:
      - ops/cast-upload-debug-20260908
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CPANEL_SSH_HOST: ${{ secrets.CPANEL_SSH_HOST }}
      CPANEL_SSH_PORT: ${{ secrets.CPANEL_SSH_PORT }}
      CPANEL_SSH_USER: ${{ secrets.CPANEL_SSH_USER }}

    steps:
      - name: Configure scoped SSH
        env:
          CPANEL_SSH_PRIVATE_KEY: ${{ secrets.CPANEL_SSH_PRIVATE_KEY }}
          CPANEL_SSH_KNOWN_HOSTS: ${{ secrets.CPANEL_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$CPANEL_SSH_PRIVATE_KEY" > ~/.ssh/thee_operator
          printf '%s\n' "$CPANEL_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/thee_operator ~/.ssh/known_hosts

      - name: Inspect live generation route without privilege escalation
        shell: bash
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o ConnectTimeout=10 \
            -i ~/.ssh/thee_operator -p "$CPANEL_SSH_PORT" \
            "$CPANEL_SSH_USER@$CPANEL_SSH_HOST" \
            "bash -s" <<'REMOTE' | tee generation-contract-trace.txt
          set -u
          echo "USER=$(id)"
          echo "=== PATH ACCESS ==="
          namei -l /opt/thee-studio-app/src/generation.js 2>&1 || true
          echo "=== FILE READABILITY ==="
          if test -r /opt/thee-studio-app/src/generation.js; then
            echo GENERATION_JS_READABLE=yes
            python3 - <<'PY'
          from pathlib import Path
          p=Path('/opt/thee-studio-app/src/generation.js')
          text=p.read_text(encoding='utf-8',errors='ignore')
          needles=['failedPrompt','creator','creatorId','app.post','/api/generation','Insufficient generation credits','request.body']
          for needle in needles:
              print(f'\n=== {needle!r} count={text.count(needle)} ===')
              start=0
              for i in range(12):
                  pos=text.find(needle,start)
                  if pos<0: break
                  print(f'--- hit {i+1} @ {pos} ---')
                  print(text[max(0,pos-1800):min(len(text),pos+5000)])
                  start=pos+len(needle)
          PY
          else
            echo GENERATION_JS_READABLE=no
            ls -ld /opt /opt/thee-studio-app /opt/thee-studio-app/src 2>&1 || true
          fi
          REMOTE

      - name: Upload trace
        uses: actions/upload-artifact@v4
        with:
          name: generation-contract-trace
          path: generation-contract-trace.txt
          if-no-files-found: error
          retention-days: 1
