name: Temporary Service Management Surface Check

on:
  push:
    branches: [ops/cast-upload-debug-20260908]
    paths: [.github/workflows/cast-upload-live-diagnostic.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CPANEL_SSH_HOST: ${{ secrets.CPANEL_SSH_HOST }}
      CPANEL_SSH_PORT: ${{ secrets.CPANEL_SSH_PORT }}
      CPANEL_SSH_USER: ${{ secrets.CPANEL_SSH_USER }}
    steps:
      - name: Configure scoped SSH
        env:
          KEY: ${{ secrets.CPANEL_SSH_PRIVATE_KEY }}
          HOSTS: ${{ secrets.CPANEL_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/thee_operator
          printf '%s\n' "$HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/thee_operator ~/.ssh/known_hosts
      - name: Inspect sudo and service wiring read-only
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -i ~/.ssh/thee_operator -p "$CPANEL_SSH_PORT" "$CPANEL_SSH_USER@$CPANEL_SSH_HOST" 'bash -s' > service-management.txt <<'REMOTE'
          set +e
          echo '=== SUDO NONINTERACTIVE POLICY ==='
          sudo -n -l 2>&1 | sed -E 's/(password|passwd|token|secret|key)[^ ,;)]*/\1=[REDACTED]/Ig'
          echo '=== SERVICE SAFE PROPERTIES ==='
          systemctl show thee-studio-api.service -p User -p Group -p ExecStart -p ExecStartPre -p ExecStartPost -p ExecReload -p EnvironmentFiles -p FragmentPath -p DropInPaths -p ReadWritePaths -p RuntimeDirectory -p StateDirectory -p CacheDirectory -p LogsDirectory --no-pager 2>/dev/null
          echo '=== UNIT FILE NONSECRET DIRECTIVES ==='
          systemctl cat thee-studio-api.service 2>/dev/null | grep -Ev '^[[:space:]]*Environment=' | sed -E 's#(EnvironmentFile=).*#\1[REDACTED-PATH]#'
          echo '=== STUDIO COMMAND NAMES ==='
          for d in /usr/local/bin /usr/local/sbin /usr/bin /usr/sbin; do
            [ -d "$d" ] || continue
            find "$d" -maxdepth 1 -type f -o -type l 2>/dev/null | grep -Ei '/(thee|studio|deploy|migrat|app)' | sed -n '1,150p'
          done
          echo '=== SERVICE USER SWITCH TEST ==='
          if sudo -n -u thee-studio true >/dev/null 2>&1; then echo SERVICE_USER_SWITCH_ALLOWED; else echo SERVICE_USER_SWITCH_DENIED; fi
          REMOTE
      - uses: actions/upload-artifact@v4
        with:
          name: service-management
          path: service-management.txt
          retention-days: 1
