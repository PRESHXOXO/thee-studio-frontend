name: Temporary Credit Regression Diagnostic

on:
  push:
    branches: [ops/cast-upload-debug-20260908]
    paths: [.github/workflows/cast-upload-live-diagnostic.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CPANEL_SSH_HOST: ${{ secrets.CPANEL_SSH_HOST }}
      CPANEL_SSH_PORT: ${{ secrets.CPANEL_SSH_PORT }}
      CPANEL_SSH_USER: ${{ secrets.CPANEL_SSH_USER }}

    steps:
      - name: Configure scoped SSH
        env:
          KEY: ${{ secrets.CPANEL_SSH_PRIVATE_KEY }}
          HOSTS: ${{ secrets.CPANEL_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/thee_operator
          printf '%s\n' "$HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/thee_operator ~/.ssh/known_hosts

      - name: Inspect readable generation source read-only
        shell: bash
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -i ~/.ssh/thee_operator -p "$CPANEL_SSH_PORT" "$CPANEL_SSH_USER@$CPANEL_SSH_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          echo "USER=$(id -un)"
          for p in /opt/thee-studio-app/src/generation.js /opt/thee-studio-app/src/worker.js /opt/thee-studio-app/src/worker-main.js /opt/thee-studio-app/tests/owner-credit.test.js; do
            if test -r "$p"; then
              echo "READABLE $p"
              if [[ "$p" == */generation.js ]]; then
                echo "=== GENERATION CREDIT EXCERPTS ==="
                grep -nE -C 8 'billing_exempt|Insufficient generation credits|account_entitlements|owner|admin|credit' "$p" | head -n 220 || true
              fi
            else
              echo "NOT_READABLE $p"
            fi
          done
          echo "=== PATH PERMISSIONS ==="
          namei -l /opt/thee-studio-app/src/generation.js 2>/dev/null || true
          echo "=== HOME CANDIDATES ==="
          find "$HOME" -maxdepth 5 -type f \( -name generation.js -o -name owner-credit.test.js \) -print 2>/dev/null | head -n 40
          REMOTE
