name: Temporary Credit Regression Diagnostic

on:
  push:
    branches: [ops/cast-upload-debug-20260908]
    paths: [.github/workflows/cast-upload-live-diagnostic.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CPANEL_SSH_HOST: ${{ secrets.CPANEL_SSH_HOST }}
      CPANEL_SSH_PORT: ${{ secrets.CPANEL_SSH_PORT }}
      CPANEL_SSH_USER: ${{ secrets.CPANEL_SSH_USER }}

    steps:
      - name: Configure scoped SSH
        env:
          KEY: ${{ secrets.CPANEL_SSH_PRIVATE_KEY }}
          HOSTS: ${{ secrets.CPANEL_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/thee_operator
          printf '%s\n' "$HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/thee_operator ~/.ssh/known_hosts

      - name: Probe narrow entitlement route candidates read-only
        shell: bash
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -i ~/.ssh/thee_operator -p "$CPANEL_SSH_PORT" "$CPANEL_SSH_USER@$CPANEL_SSH_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          base='https://studio.myvitaworld.online'
          paths=(
            /api/auth/session
            /api/access
            /api/entitlements
            /api/account/entitlements
            /api/account/access
            /api/usage
            /api/credits
            /api/admin
            /api/admin/users
            /api/admin/entitlements
            /api/admin/credits
            /compat/access
            /compat/entitlements
          )
          for p in "${paths[@]}"; do
            code=$(curl -sS -o /tmp/body.$$ -w '%{http_code}' -X GET "$base$p" || true)
            ct=$(curl -sSI -X GET "$base$p" 2>/dev/null | awk -F': ' 'tolower($1)=="content-type"{print $2}' | tr -d '\r' | tail -1)
            bytes=$(wc -c < /tmp/body.$$ 2>/dev/null || echo 0)
            printf 'GET %s -> %s bytes=%s ct=%s\n' "$p" "$code" "$bytes" "$ct"
          done
          rm -f /tmp/body.$$
          REMOTE
