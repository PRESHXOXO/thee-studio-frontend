name: Temporary API Adapter Recovery

on:
  push:
    branches: [ops/cast-upload-debug-20260908]
    paths: [.github/workflows/cast-upload-live-diagnostic.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CPANEL_SSH_HOST: ${{ secrets.CPANEL_SSH_HOST }}
      CPANEL_SSH_PORT: ${{ secrets.CPANEL_SSH_PORT }}
      CPANEL_SSH_USER: ${{ secrets.CPANEL_SSH_USER }}
      CPANEL_DEPLOY_PATH: ${{ secrets.CPANEL_DEPLOY_PATH }}
    steps:
      - name: Configure scoped SSH
        env:
          KEY: ${{ secrets.CPANEL_SSH_PRIVATE_KEY }}
          HOSTS: ${{ secrets.CPANEL_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/thee_operator
          printf '%s\n' "$HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/thee_operator ~/.ssh/known_hosts
      - name: Recover API table adapter from deployed bundle
        shell: bash
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -i ~/.ssh/thee_operator -p "$CPANEL_SSH_PORT" "$CPANEL_SSH_USER@$CPANEL_SSH_HOST" "WEB='$CPANEL_DEPLOY_PATH' node -" > api-adapter.txt <<'NODE'
          const fs=require('fs'),path=require('path');
          const html=fs.readFileSync(path.join(process.env.WEB,'index.html'),'utf8');
          const m=html.match(/src="\/([^\"]+\.js)"/); if(!m) process.exit(2);
          const p=path.join(process.env.WEB,m[1]); const s=fs.readFileSync(p,'utf8');
          const terms=['function ez(','const ez=','ez=r=>','=>ez(','/compat/','select(','upsert(','update(','insert(','delete()'];
          for(const term of terms){
            let i=s.indexOf(term); console.log('===== '+term+' @ '+i+' =====');
            if(i>=0) console.log(s.slice(Math.max(0,i-7000),Math.min(s.length,i+14000)));
          }
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: api-adapter
          path: api-adapter.txt
          retention-days: 1
