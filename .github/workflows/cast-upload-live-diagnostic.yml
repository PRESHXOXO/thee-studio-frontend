name: Temporary Owner Real Generation Smoke

on:
  push:
    branches: [ops/cast-upload-debug-20260908]
    paths: [.github/workflows/cast-upload-live-diagnostic.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    environment: production
    env:
      CUTOVER_OWNER_EMAIL: ${{ secrets.CUTOVER_OWNER_EMAIL }}
      CUTOVER_OWNER_PASSWORD: ${{ secrets.CUTOVER_OWNER_PASSWORD }}

    steps:
      - name: Submit one bounded owner generation and verify credit gate
        shell: bash
        run: |
          set -euo pipefail
          node -e "const fs=require('fs');const email=String(process.env.CUTOVER_OWNER_EMAIL||'').normalize('NFKC').replace(/[\\u200B-\\u200D\\u2060\\uFEFF]/g,'').trim().toLowerCase();const password=process.env.CUTOVER_OWNER_PASSWORD||'';if(!email||!password)process.exit(2);fs.writeFileSync('/tmp/login.json',JSON.stringify({email,password}),{mode:0o600});"
          trap 'rm -f /tmp/login.json /tmp/jar /tmp/body /tmp/request.json /tmp/creator /tmp/job' EXIT
          base='https://studio.myvitaworld.online/api'
          ua='Mozilla/5.0 Chrome/152.0.0.0 Safari/537.36'

          login=$(curl -sS --compressed -A "$ua" -c /tmp/jar -b /tmp/jar -H 'Content-Type: application/json' -X POST --data-binary @/tmp/login.json -o /dev/null -w '%{http_code}' "$base/auth/login")
          echo "OWNER_LOGIN=$login"
          test "$login" = 200

          curl -sS --compressed -A "$ua" -c /tmp/jar -b /tmp/jar "$base/creators" -o /tmp/body
          node <<'NODE'
          const fs=require('fs');const x=JSON.parse(fs.readFileSync('/tmp/body','utf8'));const a=x.creators||[];const c=a.find(v=>String(v.name||'').toLowerCase()==='cherry')||a[0];if(!c?.id)process.exit(3);fs.writeFileSync('/tmp/creator',String(c.id));console.log('CREATOR_SELECTED='+String(c.name||'unknown'));
          NODE

          curl -sS --compressed -A "$ua" -c /tmp/jar -b /tmp/jar "$base/auth/csrf" -o /tmp/body
          csrf=$(node -e "const fs=require('fs');const x=JSON.parse(fs.readFileSync('/tmp/body','utf8'));process.stdout.write(String(x.csrfToken||''));")
          test -n "$csrf"
          creator=$(cat /tmp/creator)
          CREATOR="$creator" node <<'NODE'
          const fs=require('fs');fs.writeFileSync('/tmp/request.json',JSON.stringify({prompt:'Production smoke test: one realistic neutral studio portrait, plain gray background, natural lighting, no text.',creatorId:process.env.CREATOR,idempotencyKey:`owner-real-smoke-${Date.now()}`}),{mode:0o600});
          NODE

          code=$(curl -sS --compressed -A "$ua" -c /tmp/jar -b /tmp/jar -H 'Content-Type: application/json' -H "x-csrf-token: $csrf" -X POST --data-binary @/tmp/request.json -o /tmp/body -w '%{http_code}' "$base/generation" || true)
          STATUS="$code" node <<'NODE'
          const fs=require('fs');let x={};try{x=JSON.parse(fs.readFileSync('/tmp/body','utf8'))}catch{};console.log('SUBMIT_HTTP='+process.env.STATUS);console.log('SUBMIT_ERROR='+(x.error||x.message||''));console.log('SUBMIT_KEYS='+Object.keys(x).sort().join(','));const id=x.job?.id||x.generation?.id||x.id;if(id)fs.writeFileSync('/tmp/job',String(id));
          NODE
          if [ "$code" = 402 ]; then
            echo 'OWNER_REAL_CREDIT_GATE=FAILED'
            exit 42
          fi
          test "$code" = 200 -o "$code" = 201 -o "$code" = 202
          test -s /tmp/job
          echo 'OWNER_REAL_CREDIT_GATE=PASSED'

          job=$(cat /tmp/job)
          for i in $(seq 1 30); do
            sleep 4
            code=$(curl -sS --compressed -A "$ua" -c /tmp/jar -b /tmp/jar -o /tmp/body -w '%{http_code}' "$base/generation/$job" || true)
            state=$(node -e "const fs=require('fs');let x={};try{x=JSON.parse(fs.readFileSync('/tmp/body','utf8'))}catch{};const g=x.generation||x;process.stdout.write(String(g.state||g.status||'unknown').toLowerCase());")
            echo "POLL_$i HTTP=$code STATE=$state"
            case "$state" in
              succeeded|completed|complete|failed|error|canceled|cancelled) break;;
            esac
          done
          node <<'NODE'
          const fs=require('fs');let x={};try{x=JSON.parse(fs.readFileSync('/tmp/body','utf8'))}catch{};const g=x.generation||x;console.log('FINAL_STATE='+String(g.state||g.status||'unknown'));console.log('FINAL_ERROR='+(g.last_error||g.error||g.failure_message||''));console.log('HAS_ASSET='+Boolean(g.asset||g.asset_id||g.storage_path||g.result_url||g.image_url));
          NODE
