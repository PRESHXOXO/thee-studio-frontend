name: Temporary Credit Regression Diagnostic

on:
  push:
    branches: [ops/cast-upload-debug-20260908]
    paths: [.github/workflows/cast-upload-live-diagnostic.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CPANEL_SSH_HOST: ${{ secrets.CPANEL_SSH_HOST }}
      CPANEL_SSH_PORT: ${{ secrets.CPANEL_SSH_PORT }}
      CPANEL_SSH_USER: ${{ secrets.CPANEL_SSH_USER }}

    steps:
      - name: Configure scoped SSH
        env:
          KEY: ${{ secrets.CPANEL_SSH_PRIVATE_KEY }}
          HOSTS: ${{ secrets.CPANEL_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/thee_operator
          printf '%s\n' "$HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/thee_operator ~/.ssh/known_hosts

      - name: Inspect migration log and cPanel DB inventory read-only
        shell: bash
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -i ~/.ssh/thee_operator -p "$CPANEL_SSH_PORT" "$CPANEL_SSH_USER@$CPANEL_SSH_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          echo "=== APP MIGRATIONS LOG (REDACTED) ==="
          if test -r "$HOME/app-migrations.log"; then
            tail -n 120 "$HOME/app-migrations.log" | sed -E 's#(password|passwd|secret|token|key)=([^ ]+)#\1=[REDACTED]#Ig'
          else
            echo "NO_READABLE_MIGRATION_LOG"
          fi
          echo "=== UAPI MYSQL DATABASES ==="
          if command -v uapi >/dev/null 2>&1; then
            uapi --output=json Mysql list_databases 2>/dev/null | python3 -c 'import json,sys; d=json.load(sys.stdin); rows=d.get("result",{}).get("data",[]) or []; print("DB",*[r.get("database") or r.get("name") for r in rows if isinstance(r,dict)],sep="\n")' || true
            echo "=== UAPI MYSQL USERS ==="
            uapi --output=json Mysql list_users 2>/dev/null | python3 -c 'import json,sys; d=json.load(sys.stdin); rows=d.get("result",{}).get("data",[]) or []; print("USER",*[r.get("user") or r.get("name") for r in rows if isinstance(r,dict)],sep="\n")' || true
          else
            echo "NO_UAPI"
          fi
          echo "=== HOME TOP LEVEL ==="
          find "$HOME" -maxdepth 1 -mindepth 1 -printf '%f %y %m\n' 2>/dev/null | sort | head -n 160
          REMOTE
