name: Temporary Studio Maintenance Hook Discovery

on:
  push:
    branches: [ops/cast-upload-debug-20260908]
    paths: [.github/workflows/cast-upload-live-diagnostic.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CPANEL_SSH_HOST: ${{ secrets.CPANEL_SSH_HOST }}
      CPANEL_SSH_PORT: ${{ secrets.CPANEL_SSH_PORT }}
      CPANEL_SSH_USER: ${{ secrets.CPANEL_SSH_USER }}
    steps:
      - name: Configure scoped SSH
        env:
          KEY: ${{ secrets.CPANEL_SSH_PRIVATE_KEY }}
          HOSTS: ${{ secrets.CPANEL_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/thee_operator
          printf '%s\n' "$HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/thee_operator ~/.ssh/known_hosts
      - name: Inspect Studio maintenance hooks read-only
        shell: bash
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -i ~/.ssh/thee_operator -p "$CPANEL_SSH_PORT" "$CPANEL_SSH_USER@$CPANEL_SSH_HOST" 'python3 -' <<'PY'
          import os,re,glob,subprocess
          home=os.path.expanduser('~')
          print('=== USER CRONTAB ===')
          try:
              p=subprocess.run(['crontab','-l'],capture_output=True,text=True,timeout=5)
              for line in p.stdout.splitlines():
                  if re.search(r'thee|studio|deploy|migrat|runtime|backup',line,re.I): print(line)
          except Exception as e: print('CRONTAB_ERROR',type(e).__name__)
          print('=== SYSTEM CRON REFERENCES ===')
          candidates=['/etc/crontab']+glob.glob('/etc/cron.d/*')
          for p in candidates:
              try:
                  if not os.path.isfile(p) or not os.access(p,os.R_OK): continue
                  for i,line in enumerate(open(p,errors='ignore'),1):
                      if re.search(r'thee|studio|deploy|migrat|runtime|backup',line,re.I): print(f'{p}:{i}:{line.rstrip()}')
              except Exception: pass
          print('=== SYSTEMD RELATED UNITS/TIMERS ===')
          for root in ['/etc/systemd/system','/usr/lib/systemd/system','/lib/systemd/system']:
              if not os.path.isdir(root): continue
              for p in glob.glob(root+'/*'):
                  if re.search(r'thee|studio',os.path.basename(p),re.I):
                      try:
                          st=os.stat(p); print(f'{p} mode={st.st_mode & 0o777:o} owner={st.st_uid} group={st.st_gid} writable={os.access(p,os.W_OK)}')
                      except OSError: pass
          print('=== HOME FILES REFERENCED BY ROOT/SYSTEM ===')
          refs=[]
          for p in candidates:
              try:
                  if not os.path.isfile(p) or not os.access(p,os.R_OK): continue
                  text=open(p,errors='ignore').read()
                  for m in re.finditer(re.escape(home)+r'/[^\s"\']+',text): refs.append(m.group(0).rstrip(';'))
              except Exception: pass
          for p in sorted(set(refs)):
              try:
                  st=os.stat(p); print(f'{p} mode={st.st_mode & 0o777:o} uid={st.st_uid} gid={st.st_gid} writable={os.access(p,os.W_OK)}')
              except OSError: print(p,'MISSING')
          print('=== PRIVILEGED HELPER CANDIDATES ===')
          for root in ['/usr/local/bin','/usr/local/sbin','/opt']:
              if not os.path.isdir(root): continue
              for dirpath,dirs,files in os.walk(root):
                  if dirpath.count(os.sep)-root.count(os.sep)>4:
                      dirs[:] = []; continue
                  for name in files:
                      if re.search(r'thee|studio|deploy|migrat|owner|entitl|credit',name,re.I):
                          p=os.path.join(dirpath,name)
                          try:
                              st=os.stat(p); print(f'{p} mode={st.st_mode & 0o777:o} uid={st.st_uid} gid={st.st_gid} readable={os.access(p,os.R_OK)} executable={os.access(p,os.X_OK)} writable={os.access(p,os.W_OK)}')
                          except OSError: pass
          PY
