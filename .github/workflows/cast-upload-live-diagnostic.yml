name: Temporary Owner Bootstrap Source Recovery

on:
  push:
    branches: [ops/cast-upload-debug-20260908]
    paths: [.github/workflows/cast-upload-live-diagnostic.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CPANEL_SSH_HOST: ${{ secrets.CPANEL_SSH_HOST }}
      CPANEL_SSH_PORT: ${{ secrets.CPANEL_SSH_PORT }}
      CPANEL_SSH_USER: ${{ secrets.CPANEL_SSH_USER }}

    steps:
      - name: Configure scoped SSH
        env:
          KEY: ${{ secrets.CPANEL_SSH_PRIVATE_KEY }}
          HOSTS: ${{ secrets.CPANEL_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/thee_operator
          printf '%s\n' "$HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/thee_operator ~/.ssh/known_hosts

      - name: Recover owner/bootstrap source and runtime surface
        shell: bash
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o ConnectTimeout=10 -i ~/.ssh/thee_operator -p "$CPANEL_SSH_PORT" "$CPANEL_SSH_USER@$CPANEL_SSH_HOST" 'bash -s' > owner-bootstrap-source.txt <<'REMOTE'
          set -u
          root="$HOME/thee-functions-20260827"
          for f in \
            "$root/thee-bootstrap-owner/index.ts" \
            "$root/thee-access/index.ts" \
            "$root/thee-admin-access/index.ts" \
            "$root/_shared/cast_credits.ts"; do
            echo "===== FILE: $f ====="
            if [ -r "$f" ]; then
              # Source files reference secret names but should never contain values. Redact obvious literal assignments defensively.
              sed -E \
                -e 's#(sk-[A-Za-z0-9_-]{16,})#[REDACTED_KEY]#g' \
                -e 's#(Bearer )[A-Za-z0-9._-]{20,}#\1[REDACTED]#g' \
                -e 's#(https?://)[^/@[:space:]"'"']+:[^/@[:space:]"'"']+@#\1[REDACTED]@#g' \
                "$f"
            else
              echo NOT_READABLE
            fi
          done

          echo '===== LOCAL RUNTIME SURFACE ====='
          for url in \
            http://127.0.0.1:18000/functions/v1/thee-runtime-health \
            http://127.0.0.1:18000/functions/v1/thee-access \
            http://127.0.0.1:18000/functions/v1/thee-bootstrap-owner; do
            code=$(curl -sS -o /tmp/body.$$ -w '%{http_code}' -X OPTIONS "$url" 2>/dev/null || true)
            echo "OPTIONS $(basename "$url") HTTP=$code"
            rm -f /tmp/body.$$
          done
          echo '===== DOCKER ACCESS ====='
          if docker ps --format '{{.Names}}' >/tmp/docker.$$ 2>/dev/null; then
            echo DOCKER_PS=allowed
            sed -n '1,80p' /tmp/docker.$$
          else
            echo DOCKER_PS=denied
          fi
          rm -f /tmp/docker.$$
          REMOTE

      - name: Upload recovered source
        uses: actions/upload-artifact@v4
        with:
          name: owner-bootstrap-source
          path: owner-bootstrap-source.txt
          if-no-files-found: error
          retention-days: 1
