name: Temporary Cherry Creator ID Contract Check

on:
  push:
    branches:
      - ops/cast-upload-debug-20260908
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CUTOVER_OWNER_EMAIL: ${{ secrets.CUTOVER_OWNER_EMAIL }}
      CUTOVER_OWNER_PASSWORD: ${{ secrets.CUTOVER_OWNER_PASSWORD }}

    steps:
      - name: Authenticate and classify Cherry creator id without generation
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const email=String(process.env.CUTOVER_OWNER_EMAIL||'').normalize('NFKC').replace(/[\u200B-\u200D\u2060\uFEFF]/g,'').trim().toLowerCase();
          const password=String(process.env.CUTOVER_OWNER_PASSWORD||'');
          if(!email||!password) process.exit(2);
          fs.writeFileSync('/tmp/login.json',JSON.stringify({email,password}),{mode:0o600});
          NODE
          trap 'rm -f /tmp/login.json /tmp/jar /tmp/csrf /tmp/creators.json /tmp/creator.json /tmp/cherry-id' EXIT
          ua='Mozilla/5.0 Chrome/152.0.0.0 Safari/537.36'
          base='https://studio.myvitaworld.online/api'

          code=$(curl -sS --compressed -A "$ua" -c /tmp/jar -b /tmp/jar -H 'Content-Type: application/json' -X POST --data-binary @/tmp/login.json -o /dev/null -w '%{http_code}' "$base/auth/login")
          echo "owner_login_status=$code"
          test "$code" = 200

          curl -sS --compressed -A "$ua" -c /tmp/jar -b /tmp/jar "$base/creators" -o /tmp/creators.json
          node - <<'NODE'
          const fs=require('fs');
          const p=JSON.parse(fs.readFileSync('/tmp/creators.json','utf8'));
          const rows=Array.isArray(p)?p:(p.creators||p.data||[]);
          const matches=rows.filter(x=>/cherry/i.test(String(x?.name||'')));
          console.log('cherry_match_count='+matches.length);
          for(const [i,c] of matches.entries()){
            const id=String(c?.id||'');
            const uuid=/^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i.test(id);
            const numeric=/^\d+$/.test(id);
            console.log(`cherry_${i+1}_name=${String(c?.name||'').replace(/[^A-Za-z0-9 ._'-]/g,'')}`);
            console.log(`cherry_${i+1}_id_length=${id.length}`);
            console.log(`cherry_${i+1}_id_is_uuid=${uuid}`);
            console.log(`cherry_${i+1}_id_is_numeric=${numeric}`);
            console.log(`cherry_${i+1}_keys=${Object.keys(c||{}).filter(k=>!['id','userId','user_id'].includes(k)).sort().join(',')}`);
          }
          if(matches.length===1) fs.writeFileSync('/tmp/cherry-id',String(matches[0].id),{mode:0o600});
          NODE

          test -s /tmp/cherry-id
          cherry_id=$(cat /tmp/cherry-id)
          code=$(curl -sS --compressed -A "$ua" -c /tmp/jar -b /tmp/jar -o /tmp/creator.json -w '%{http_code}' "$base/creators/$cherry_id")
          echo "cherry_get_status=$code"
          test "$code" = 200

          node - <<'NODE'
          const fs=require('fs');
          const p=JSON.parse(fs.readFileSync('/tmp/creator.json','utf8'));
          const c=p.creator||p.data?.creator||p.data||p;
          const id=String(c?.id||'');
          console.log('cherry_get_id_matches_list='+(id===fs.readFileSync('/tmp/cherry-id','utf8')));
          console.log('cherry_get_has_identity_hint='+Boolean(c?.identity||c?.metadata?.identity||c?.profile));
          console.log('cherry_get_keys='+Object.keys(c||{}).filter(k=>!['id','userId','user_id'].includes(k)).sort().join(','));
          NODE
