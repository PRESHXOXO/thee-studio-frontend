name: Temporary Scoped Backend Source Discovery

on:
  push:
    branches: [ops/cast-upload-debug-20260908]
    paths: [.github/workflows/cast-upload-live-diagnostic.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: production
    env:
      CPANEL_SSH_HOST: ${{ secrets.CPANEL_SSH_HOST }}
      CPANEL_SSH_PORT: ${{ secrets.CPANEL_SSH_PORT }}
      CPANEL_SSH_USER: ${{ secrets.CPANEL_SSH_USER }}

    steps:
      - name: Configure scoped SSH
        env:
          KEY: ${{ secrets.CPANEL_SSH_PRIVATE_KEY }}
          HOSTS: ${{ secrets.CPANEL_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/thee_operator
          printf '%s\n' "$HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/thee_operator ~/.ssh/known_hosts

      - name: Locate readable or writable application source without privilege escalation
        shell: bash
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -i ~/.ssh/thee_operator -p "$CPANEL_SSH_PORT" "$CPANEL_SSH_USER@$CPANEL_SSH_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          echo 'IDENTITY'
          id
          echo 'HOME='
          printf '%s\n' "$HOME"

          echo 'KNOWN_APP_PATHS'
          for p in \
            /opt/thee-studio-app \
            /opt/thee-studio-app/src \
            /var/lib/thee-studio \
            "$HOME/thee-studio-app" \
            "$HOME/thee-studio" \
            "$HOME/apps/thee-studio" \
            "$HOME/applications/thee-studio" \
            "$HOME/public_html/studio"; do
            if [ -e "$p" ]; then
              readable=no; writable=no; searchable=no
              [ -r "$p" ] && readable=yes
              [ -w "$p" ] && writable=yes
              [ -x "$p" ] && searchable=yes
              stat -c 'PATH=%n mode=%a owner=%U group=%G type=%F' "$p" 2>/dev/null || true
              echo "ACCESS path=$p read=$readable write=$writable exec=$searchable"
            fi
          done

          echo 'GENERATION_SOURCE_CANDIDATES'
          for root in "$HOME" /opt /var/lib/thee-studio /srv /var/www; do
            [ -d "$root" ] || continue
            find "$root" -maxdepth 7 -type f \( -name 'generation.js' -o -name 'worker.js' -o -name 'worker-main.js' -o -name 'server.js' -o -name 'app.js' \) -readable -printf '%p mode=%m owner=%u group=%g\n' 2>/dev/null | grep -Ei 'thee|studio|generation|worker' | head -200 || true
          done

          echo 'FASTIFY_PACKAGE_CANDIDATES'
          for root in "$HOME" /opt /var/lib/thee-studio /srv /var/www; do
            [ -d "$root" ] || continue
            find "$root" -maxdepth 6 -type f -name package.json -readable -print0 2>/dev/null | while IFS= read -r -d '' f; do
              if grep -q '"fastify"' "$f" 2>/dev/null; then
                stat -c 'FASTIFY_PACKAGE=%n mode=%a owner=%U group=%G' "$f" 2>/dev/null || true
              fi
            done | head -100 || true
          done

          echo 'DEPLOY_OPERATOR_CANDIDATES'
          for root in "$HOME" /usr/local/bin /usr/local/sbin /opt /var/lib/thee-studio; do
            [ -d "$root" ] || continue
            find "$root" -maxdepth 5 -type f -readable \( -iname '*deploy*' -o -iname '*release*' -o -iname '*operator*' -o -iname '*restart*' \) -printf '%p mode=%m owner=%u group=%g\n' 2>/dev/null | grep -Ei 'thee|studio' | head -150 || true
          done
          REMOTE
