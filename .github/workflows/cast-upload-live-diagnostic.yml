name: Temporary Owner Bootstrap Source Recovery

on:
  push:
    branches: [ops/cast-upload-debug-20260908]
    paths: [.github/workflows/cast-upload-live-diagnostic.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CPANEL_SSH_HOST: ${{ secrets.CPANEL_SSH_HOST }}
      CPANEL_SSH_PORT: ${{ secrets.CPANEL_SSH_PORT }}
      CPANEL_SSH_USER: ${{ secrets.CPANEL_SSH_USER }}

    steps:
      - name: Configure scoped SSH
        env:
          KEY: ${{ secrets.CPANEL_SSH_PRIVATE_KEY }}
          HOSTS: ${{ secrets.CPANEL_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/thee_operator
          printf '%s\n' "$HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/thee_operator ~/.ssh/known_hosts

      - name: Recover owner/bootstrap source and runtime surface
        shell: bash
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o ConnectTimeout=10 -i ~/.ssh/thee_operator -p "$CPANEL_SSH_PORT" "$CPANEL_SSH_USER@$CPANEL_SSH_HOST" 'python3 -' > owner-bootstrap-source.txt <<'PY'
          import os,re,subprocess,urllib.request
          root=os.path.expanduser('~/thee-functions-20260827')
          paths=[
            f'{root}/thee-bootstrap-owner/index.ts',
            f'{root}/thee-access/index.ts',
            f'{root}/thee-admin-access/index.ts',
            f'{root}/_shared/cast_credits.ts',
          ]
          def clean(s):
              s=re.sub(r'sk-[A-Za-z0-9_-]{16,}', '[REDACTED_KEY]', s)
              s=re.sub(r'Bearer [A-Za-z0-9._-]{20,}', 'Bearer [REDACTED]', s)
              s=re.sub(r'(https?://)[^/@\s"\']+:[^/@\s"\']+@', r'\1[REDACTED]@', s)
              return s
          for p in paths:
              print(f'===== FILE: {p} =====')
              try:
                  with open(p,errors='replace') as fh: print(clean(fh.read()))
              except Exception as e:
                  print('NOT_READABLE', type(e).__name__)
          print('===== LOCAL RUNTIME SURFACE =====')
          for name in ['thee-runtime-health','thee-access','thee-bootstrap-owner']:
              url=f'http://127.0.0.1:18000/functions/v1/{name}'
              try:
                  req=urllib.request.Request(url,method='OPTIONS')
                  with urllib.request.urlopen(req,timeout=4) as r: code=r.status
              except urllib.error.HTTPError as e: code=e.code
              except Exception: code='ERR'
              print(f'OPTIONS {name} HTTP={code}')
          print('===== DOCKER ACCESS =====')
          p=subprocess.run(['docker','ps','--format','{{.Names}}'],text=True,capture_output=True)
          print('DOCKER_PS='+('allowed' if p.returncode==0 else 'denied'))
          if p.returncode==0: print('\n'.join(p.stdout.splitlines()[:80]))
          PY

      - name: Upload recovered source
        uses: actions/upload-artifact@v4
        with:
          name: owner-bootstrap-source
          path: owner-bootstrap-source.txt
          if-no-files-found: error
          retention-days: 1

