name: Temporary Production Cast Preview Hotfix

on:
  push:
    branches:
      - ops/cast-upload-debug-20260908
    paths:
      - .github/workflows/cast-upload-production-hotfix.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hotfix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CPANEL_SSH_HOST: ${{ secrets.CPANEL_SSH_HOST }}
      CPANEL_SSH_PORT: ${{ secrets.CPANEL_SSH_PORT }}
      CPANEL_SSH_USER: ${{ secrets.CPANEL_SSH_USER }}
      CPANEL_DEPLOY_PATH: ${{ secrets.CPANEL_DEPLOY_PATH }}
      CPANEL_BACKUP_ROOT: ${{ secrets.CPANEL_BACKUP_ROOT }}
      EXPECTED_JS_SHA256: ec12361714834eb2416c43b7c7169247955ba966d5fa06a4149dbd347a873867
      CURRENT_ASSET: assets/index-DhbQbUSO-castfix2-20260908.js
      NEW_ASSET: assets/index-DhbQbUSO-castfix3-20260908.js

    steps:
      - name: Configure scoped SSH
        env:
          CPANEL_SSH_PRIVATE_KEY: ${{ secrets.CPANEL_SSH_PRIVATE_KEY }}
          CPANEL_SSH_KNOWN_HOSTS: ${{ secrets.CPANEL_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$CPANEL_SSH_HOST"
          test -n "$CPANEL_SSH_PORT"
          test -n "$CPANEL_SSH_USER"
          test -n "$CPANEL_DEPLOY_PATH"
          test -n "$CPANEL_BACKUP_ROOT"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$CPANEL_SSH_PRIVATE_KEY" > ~/.ssh/thee_operator
          printf '%s\n' "$CPANEL_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/thee_operator ~/.ssh/known_hosts

      - name: Apply guarded private-preview URL repair
        shell: bash
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o ConnectTimeout=10 \
            -i ~/.ssh/thee_operator -p "$CPANEL_SSH_PORT" \
            "$CPANEL_SSH_USER@$CPANEL_SSH_HOST" \
            "WEB='$CPANEL_DEPLOY_PATH' BACKUP_ROOT='$CPANEL_BACKUP_ROOT' EXPECTED_JS_SHA256='$EXPECTED_JS_SHA256' CURRENT_ASSET='$CURRENT_ASSET' NEW_ASSET='$NEW_ASSET' bash -s" <<'REMOTE'
          set -euo pipefail
          current="$WEB/$CURRENT_ASSET"
          new="$WEB/$NEW_ASSET"
          tmp_new="${new}.tmp.js"
          index="$WEB/index.html"

          test -r "$current" && test -w "$WEB/assets" && test -r "$index" && test -w "$index"
          actual_js=$(sha256sum "$current" | awk '{print $1}')
          test "$actual_js" = "$EXPECTED_JS_SHA256" || { echo "Refusing hotfix: active JS changed ($actual_js)"; exit 31; }

          current_ref="/$CURRENT_ASSET"
          new_ref="/$NEW_ASSET"
          count=$(python3 - "$index" "$current_ref" <<'PY'
          import sys
          text=open(sys.argv[1],encoding='utf-8').read()
          print(text.count(sys.argv[2]))
          PY
          )
          test "$count" = 1 || { echo "Refusing hotfix: expected one active bundle reference, found $count"; exit 32; }

          stamp=$(date -u +%Y%m%dT%H%M%SZ)
          backup="$BACKUP_ROOT/cast-preview-hotfix-$stamp"
          mkdir -p "$backup/assets"
          cp -p "$index" "$backup/index.html"
          cp -p "$current" "$backup/$CURRENT_ASSET"
          printf '%s  %s\n' "$actual_js" "$CURRENT_ASSET" > "$backup/SHA256SUMS"
          sha256sum "$index" >> "$backup/SHA256SUMS"

          rm -f "$tmp_new"
          cp "$current" "$tmp_new"
          python3 - "$tmp_new" <<'PY'
          import sys
          path=sys.argv[1]
          text=open(path,'r',encoding='utf-8').read()

          old='function Ll(t,r){return{id:t.id,label:r,referenceType:t.reference_type,storagePath:t.storage_path,originalFilename:t.original_filename,mimeType:t.mime_type,sizeBytes:t.size_bytes,width:t.width,height:t.height,url:t.signed_url,status:"approved"}}'
          new='function Ll(t,r){const n=t.signed_url||t.signedUrl||t.url||t.preview_url||t.previewUrl||t.download_url||t.downloadUrl||(t.storage_path?`/api/assets/download/creator-references/${String(t.storage_path).split("/").map(encodeURIComponent).join("/")}`:null);return{id:t.id,label:r,referenceType:t.reference_type||t.referenceType,storagePath:t.storage_path||t.storagePath,originalFilename:t.original_filename||t.originalFilename,mimeType:t.mime_type||t.mimeType,sizeBytes:t.size_bytes||t.sizeBytes,width:t.width,height:t.height,url:n,status:"approved"}}'
          if text.count(old) != 1:
              raise SystemExit(f'Expected one creator-reference mapper, found {text.count(old)}')
          text=text.replace(old,new,1)

          old_check='const dt=Ll(Oe,"Headshot"),N=Ar('
          new_check='const dt=Ll(Oe,"Headshot");if(!dt.url)throw new Error("Headshot saved, but its private preview URL is unavailable.");const N=Ar('
          if text.count(old_check) != 1:
              raise SystemExit(f'Expected one Step 2 mapped-headshot assignment, found {text.count(old_check)}')
          text=text.replace(old_check,new_check,1)

          open(path,'w',encoding='utf-8',newline='').write(text)
          PY

          node --check "$tmp_new"
          chmod 644 "$tmp_new"
          mv -f "$tmp_new" "$new"

          cp "$index" "$index.tmp"
          python3 - "$index.tmp" "$current_ref" "$new_ref" <<'PY'
          import sys
          path,old,new=sys.argv[1:]
          text=open(path,'r',encoding='utf-8').read()
          if text.count(old) != 1:
              raise SystemExit(f'Expected one current asset reference, found {text.count(old)}')
          text=text.replace(old,new,1)
          open(path,'w',encoding='utf-8',newline='').write(text)
          PY
          chmod 644 "$index.tmp"
          mv -f "$index.tmp" "$index"

          grep -Fq "$new_ref" "$index"
          grep -Fq '/api/assets/download/creator-references/' "$new"
          grep -Fq 'private preview URL is unavailable' "$new"
          if grep -Fq "$current_ref\"" "$index"; then
            echo 'Old Cast bundle is still active.' >&2
            exit 33
          fi

          printf 'backup=%s\nnew_asset=%s\nnew_sha256=%s\n' "$backup" "$NEW_ASSET" "$(sha256sum "$new" | awk '{print $1}')"
          REMOTE

      - name: Verify disk public HTTPS and preview route
        shell: bash
        run: |
          set -euo pipefail
          remote_info=$(ssh -o BatchMode=yes -o ConnectTimeout=10 \
            -i ~/.ssh/thee_operator -p "$CPANEL_SSH_PORT" \
            "$CPANEL_SSH_USER@$CPANEL_SSH_HOST" \
            "WEB='$CPANEL_DEPLOY_PATH' NEW_ASSET='$NEW_ASSET' bash -s" <<'REMOTE'
          set -euo pipefail
          asset="$WEB/$NEW_ASSET"
          index="$WEB/index.html"
          test -s "$asset" && test -s "$index"
          grep -Fq "src=\"/$NEW_ASSET\"" "$index"
          node --check "$asset"
          grep -Fq '/api/assets/download/creator-references/' "$asset"
          grep -Fq 'private preview URL is unavailable' "$asset"
          code=$(curl -sS -o /dev/null -w '%{http_code}' 'http://127.0.0.1:4310/api/assets/download/creator-references/test.png')
          test "$code" = 401
          printf '%s\n' "$(sha256sum "$asset" | awk '{print $1}')"
          REMOTE
          )
          expected_new_sha=$(printf '%s' "$remote_info" | tail -1)
          test -n "$expected_new_sha"

          curl --fail --silent --show-error --user-agent 'Mozilla/5.0' \
            --resolve "studio.myvitaworld.online:443:$CPANEL_SSH_HOST" \
            -o /tmp/thee-index.html \
            https://studio.myvitaworld.online/
          grep -Fq "src=\"/$NEW_ASSET\"" /tmp/thee-index.html

          curl --fail --silent --show-error --user-agent 'Mozilla/5.0' \
            --resolve "studio.myvitaworld.online:443:$CPANEL_SSH_HOST" \
            -o /tmp/thee-cast-preview-fix.js \
            "https://studio.myvitaworld.online/$NEW_ASSET"
          public_sha=$(sha256sum /tmp/thee-cast-preview-fix.js | awk '{print $1}')
          test "$public_sha" = "$expected_new_sha"
          node --check /tmp/thee-cast-preview-fix.js
          grep -Fq '/api/assets/download/creator-references/' /tmp/thee-cast-preview-fix.js
          echo "CAST_PREVIEW_HOTFIX_OK asset=$NEW_ASSET sha256=$public_sha"
