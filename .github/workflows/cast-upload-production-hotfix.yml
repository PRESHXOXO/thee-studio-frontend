name: Temporary Production Director Creator ID Repair

on:
  push:
    branches:
      - ops/cast-upload-debug-20260908
    paths:
      - .github/workflows/cast-upload-production-hotfix.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hotfix:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CPANEL_SSH_HOST: ${{ secrets.CPANEL_SSH_HOST }}
      CPANEL_SSH_PORT: ${{ secrets.CPANEL_SSH_PORT }}
      CPANEL_SSH_USER: ${{ secrets.CPANEL_SSH_USER }}
      CPANEL_DEPLOY_PATH: ${{ secrets.CPANEL_DEPLOY_PATH }}
      CPANEL_BACKUP_ROOT: ${{ secrets.CPANEL_BACKUP_ROOT }}
      EXPECTED_JS_SHA256: 2d58e5eedb6290989a750843891f189d262c19116505deed1c2ab7c4b8140bcb
      CURRENT_ASSET: assets/index-DhbQbUSO-genfix1-20260908.js
      NEW_ASSET: assets/index-DhbQbUSO-genfix2-20260908.js

    steps:
      - uses: actions/checkout@v4

      - name: Configure scoped SSH
        env:
          CPANEL_SSH_PRIVATE_KEY: ${{ secrets.CPANEL_SSH_PRIVATE_KEY }}
          CPANEL_SSH_KNOWN_HOSTS: ${{ secrets.CPANEL_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$CPANEL_SSH_PRIVATE_KEY" > ~/.ssh/thee_operator
          printf '%s\n' "$CPANEL_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/thee_operator ~/.ssh/known_hosts

      - name: Stage guarded patch helper
        run: |
          scp -q -o BatchMode=yes -i ~/.ssh/thee_operator -P "$CPANEL_SSH_PORT" \
            .ops/genfix2_creator_id_patch.py \
            "$CPANEL_SSH_USER@$CPANEL_SSH_HOST:.thee-genfix2-patch.py"

      - name: Apply guarded creator ID repair
        shell: bash
        run: |
          ssh -o BatchMode=yes -o ConnectTimeout=10 -i ~/.ssh/thee_operator -p "$CPANEL_SSH_PORT" \
            "$CPANEL_SSH_USER@$CPANEL_SSH_HOST" \
            "WEB='$CPANEL_DEPLOY_PATH' BACKUP_ROOT='$CPANEL_BACKUP_ROOT' EXPECTED_JS_SHA256='$EXPECTED_JS_SHA256' CURRENT_ASSET='$CURRENT_ASSET' NEW_ASSET='$NEW_ASSET' bash -s" <<'REMOTE'
          set -euo pipefail
          current="$WEB/$CURRENT_ASSET"
          new="$WEB/$NEW_ASSET"
          index="$WEB/index.html"
          tmp="${new}.tmp.js"
          patch="$HOME/.thee-genfix2-patch.py"

          test -r "$current" && test -r "$patch" && test -w "$WEB/assets" && test -w "$index"
          actual=$(sha256sum "$current" | awk '{print $1}')
          test "$actual" = "$EXPECTED_JS_SHA256" || { echo "Refusing hotfix: active JS changed ($actual)"; exit 31; }
          test "$(grep -oF "/$CURRENT_ASSET" "$index" | wc -l)" = 1 || { echo "Refusing hotfix: active asset reference changed"; exit 32; }

          stamp=$(date -u +%Y%m%dT%H%M%SZ)
          backup="$BACKUP_ROOT/director-creator-id-repair-$stamp"
          mkdir -p "$backup/assets"
          cp -p "$index" "$backup/index.html"
          cp -p "$current" "$backup/$CURRENT_ASSET"
          printf '%s  %s\n' "$actual" "$CURRENT_ASSET" > "$backup/SHA256SUMS"

          cp "$current" "$tmp"
          python3 "$patch" "$tmp"
          node --check "$tmp"
          grep -Fq 'tsFastifyResolveCreatorId' "$tmp"
          grep -Fq '"/compat/creators"' "$tmp"
          chmod 644 "$tmp"
          mv -f "$tmp" "$new"

          python3 - "$index" "/$CURRENT_ASSET" "/$NEW_ASSET" <<'PY'
          import sys
          path, old, new = sys.argv[1:]
          text = open(path, encoding='utf-8').read()
          if text.count(old) != 1:
              raise SystemExit(f'Expected one active asset reference, found {text.count(old)}')
          text = text.replace(old, new, 1)
          open(path, 'w', encoding='utf-8', newline='').write(text)
          PY

          grep -Fq "/$NEW_ASSET" "$index"
          rm -f "$patch"
          echo "NEW_SHA=$(sha256sum "$new" | awk '{print $1}')"
          REMOTE

      - name: Verify public production bundle
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --user-agent 'Mozilla/5.0' \
            --resolve "studio.myvitaworld.online:443:$CPANEL_SSH_HOST" \
            -o /tmp/thee-index.html https://studio.myvitaworld.online/
          grep -Fq "src=\"/$NEW_ASSET\"" /tmp/thee-index.html

          curl --fail --silent --show-error --user-agent 'Mozilla/5.0' \
            --resolve "studio.myvitaworld.online:443:$CPANEL_SSH_HOST" \
            -o /tmp/thee-genfix2.js "https://studio.myvitaworld.online/$NEW_ASSET"
          node --check /tmp/thee-genfix2.js
          grep -Fq 'tsFastifyResolveCreatorId' /tmp/thee-genfix2.js
          grep -Fq '"/compat/creators"' /tmp/thee-genfix2.js
          echo "DIRECTOR_CREATOR_ID_REPAIR_OK asset=$NEW_ASSET sha256=$(sha256sum /tmp/thee-genfix2.js | awk '{print $1}')"
