name: Temporary Production Full-Body Cast Hotfix

on:
  push:
    branches:
      - ops/cast-upload-debug-20260908
    paths:
      - .github/workflows/cast-upload-production-hotfix.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hotfix:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CPANEL_SSH_HOST: ${{ secrets.CPANEL_SSH_HOST }}
      CPANEL_SSH_PORT: ${{ secrets.CPANEL_SSH_PORT }}
      CPANEL_SSH_USER: ${{ secrets.CPANEL_SSH_USER }}
      CPANEL_DEPLOY_PATH: ${{ secrets.CPANEL_DEPLOY_PATH }}
      CPANEL_BACKUP_ROOT: ${{ secrets.CPANEL_BACKUP_ROOT }}
      EXPECTED_JS_SHA256: 927eaf96ea4e46e4b10f5e5f98802e1a708062c77496e7ba04fa0c57647d505c
      CURRENT_ASSET: assets/index-DhbQbUSO-castfix4-20260908.js
      NEW_ASSET: assets/index-DhbQbUSO-castfix5-20260908.js

    steps:
      - name: Configure scoped SSH
        env:
          CPANEL_SSH_PRIVATE_KEY: ${{ secrets.CPANEL_SSH_PRIVATE_KEY }}
          CPANEL_SSH_KNOWN_HOSTS: ${{ secrets.CPANEL_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$CPANEL_SSH_HOST"
          test -n "$CPANEL_SSH_PORT"
          test -n "$CPANEL_SSH_USER"
          test -n "$CPANEL_DEPLOY_PATH"
          test -n "$CPANEL_BACKUP_ROOT"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$CPANEL_SSH_PRIVATE_KEY" > ~/.ssh/thee_operator
          printf '%s\n' "$CPANEL_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/thee_operator ~/.ssh/known_hosts

      - name: Apply guarded full-body upload state repair
        shell: bash
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o ConnectTimeout=10 \
            -i ~/.ssh/thee_operator -p "$CPANEL_SSH_PORT" \
            "$CPANEL_SSH_USER@$CPANEL_SSH_HOST" \
            "WEB='$CPANEL_DEPLOY_PATH' BACKUP_ROOT='$CPANEL_BACKUP_ROOT' EXPECTED_JS_SHA256='$EXPECTED_JS_SHA256' CURRENT_ASSET='$CURRENT_ASSET' NEW_ASSET='$NEW_ASSET' bash -s" <<'REMOTE'
          set -euo pipefail
          current="$WEB/$CURRENT_ASSET"
          new="$WEB/$NEW_ASSET"
          tmp_new="${new}.tmp.js"
          index="$WEB/index.html"

          test -r "$current" && test -w "$WEB/assets" && test -r "$index" && test -w "$index"
          actual_js=$(sha256sum "$current" | awk '{print $1}')
          test "$actual_js" = "$EXPECTED_JS_SHA256" || { echo "Refusing hotfix: active JS changed ($actual_js)"; exit 31; }

          current_ref="/$CURRENT_ASSET"
          new_ref="/$NEW_ASSET"
          count=$(python3 - "$index" "$current_ref" <<'PY'
          import sys
          text=open(sys.argv[1],encoding='utf-8').read()
          print(text.count(sys.argv[2]))
          PY
          )
          test "$count" = 1 || { echo "Refusing hotfix: expected one active bundle reference, found $count"; exit 32; }

          stamp=$(date -u +%Y%m%dT%H%M%SZ)
          backup="$BACKUP_ROOT/cast-fullbody-hotfix-$stamp"
          mkdir -p "$backup/assets"
          cp -p "$index" "$backup/index.html"
          cp -p "$current" "$backup/$CURRENT_ASSET"
          printf '%s  %s\n' "$actual_js" "$CURRENT_ASSET" > "$backup/SHA256SUMS"
          sha256sum "$index" >> "$backup/SHA256SUMS"

          rm -f "$tmp_new"
          cp "$current" "$tmp_new"
          python3 - "$tmp_new" <<'PY'
          import sys
          path=sys.argv[1]
          text=open(path,'r',encoding='utf-8').read()

          old_handler='Qe=async be=>{if(!T.current){T.current=!0,A(!0),se("");try{const ce=await ne(),Fe=await f.uploadReferenceAsset(ce.cloudCreatorId,"full_body",be),Oe=Ar({...ce,identityReferences:{...ce.identityReferences,fullBodyReference:Ll(Fe,"Full Body")}});await me(Oe,"draft")}catch(ce){se(ce.message||"Full-body upload failed.")}finally{T.current=!1,A(!1)}}}'
          new_handler='Qe=async be=>{if(!T.current){T.current=!0,A(!0),se("");try{const ce=await ne();await f.uploadReferenceAsset(ce.cloudCreatorId,"full_body",be);const Fe=await f.listReferenceAssets(ce.cloudCreatorId),Oe=Fe.find(dt=>dt.reference_type==="full_body"&&dt.is_canonical)||Fe.find(dt=>dt.reference_type==="full_body");if(!Oe)throw new Error("Full-body reference saved, but it could not be loaded.");const dt=Ll(Oe,"Full Body");if(!dt.url)throw new Error("Full-body reference saved, but its private preview URL is unavailable.");const N=Ar({...ce,identityReferences:{...ce.identityReferences,fullBodyReference:dt}});m(N)}catch(ce){se(ce.message||"Full-body upload failed.")}finally{T.current=!1,A(!1)}}}'
          if text.count(old_handler) != 1:
              raise SystemExit(f'Expected one old full-body handler, found {text.count(old_handler)}')
          text=text.replace(old_handler,new_handler,1)

          old_img='n?i.jsx("img",{src:n,alt:"Full body reference",style:{width:"100%",height:"100%",objectFit:"cover"}})'
          new_img='n?i.jsx("img",{src:n,alt:"Full body reference",onError:async C=>{const L=C.currentTarget;if(L.dataset.fullBodyPreviewRetry)return;L.dataset.fullBodyPreviewRetry="1";try{const S=await fetch(n,{credentials:"same-origin"});if(!S.ok)return;const w=new Uint8Array(await S.arrayBuffer());let I="image/jpeg";w.length>12&&w[0]===137&&w[1]===80&&w[2]===78&&w[3]===71?I="image/png":w.length>12&&String.fromCharCode(...w.slice(0,4))==="RIFF"&&String.fromCharCode(...w.slice(8,12))==="WEBP"?I="image/webp":w.length>3&&w[0]===255&&w[1]===216&&w[2]===255&&(I="image/jpeg");const j=URL.createObjectURL(new Blob([w],{type:I})),H=()=>URL.revokeObjectURL(j);L.onload=H,L.src=j}catch{}},style:{width:"100%",height:"100%",objectFit:"cover"}})'
          if text.count(old_img) != 1:
              raise SystemExit(f'Expected one full-body image renderer, found {text.count(old_img)}')
          text=text.replace(old_img,new_img,1)

          open(path,'w',encoding='utf-8',newline='').write(text)
          PY

          node --check "$tmp_new"
          chmod 644 "$tmp_new"
          mv -f "$tmp_new" "$new"

          cp "$index" "$index.tmp"
          python3 - "$index.tmp" "$current_ref" "$new_ref" <<'PY'
          import sys
          path,old,new=sys.argv[1:]
          text=open(path,'r',encoding='utf-8').read()
          if text.count(old) != 1:
              raise SystemExit(f'Expected one current asset reference, found {text.count(old)}')
          text=text.replace(old,new,1)
          open(path,'w',encoding='utf-8',newline='').write(text)
          PY
          chmod 644 "$index.tmp"
          mv -f "$index.tmp" "$index"

          grep -Fq "$new_ref" "$index"
          grep -Fq 'Full-body reference saved, but it could not be loaded.' "$new"
          grep -Fq 'fullBodyPreviewRetry' "$new"
          grep -Fq 'listReferenceAssets(ce.cloudCreatorId)' "$new"
          if grep -Fq "$current_ref\"" "$index"; then
            echo 'Old Cast bundle is still active.' >&2
            exit 33
          fi

          printf 'backup=%s\nnew_asset=%s\nnew_sha256=%s\n' "$backup" "$NEW_ASSET" "$(sha256sum "$new" | awk '{print $1}')"
          REMOTE

      - name: Verify disk and public HTTPS
        shell: bash
        run: |
          set -euo pipefail
          remote_info=$(ssh -o BatchMode=yes -o ConnectTimeout=10 \
            -i ~/.ssh/thee_operator -p "$CPANEL_SSH_PORT" \
            "$CPANEL_SSH_USER@$CPANEL_SSH_HOST" \
            "WEB='$CPANEL_DEPLOY_PATH' NEW_ASSET='$NEW_ASSET' bash -s" <<'REMOTE'
          set -euo pipefail
          asset="$WEB/$NEW_ASSET"
          index="$WEB/index.html"
          test -s "$asset" && test -s "$index"
          grep -Fq "src=\"/$NEW_ASSET\"" "$index"
          node --check "$asset"
          grep -Fq 'Full-body reference saved, but it could not be loaded.' "$asset"
          grep -Fq 'fullBodyPreviewRetry' "$asset"
          grep -Fq 'listReferenceAssets(ce.cloudCreatorId)' "$asset"
          code=$(curl -sS -o /dev/null -w '%{http_code}' 'http://127.0.0.1:4310/api/assets/download/creator-references/test.png')
          test "$code" = 401
          printf '%s\n' "$(sha256sum "$asset" | awk '{print $1}')"
          REMOTE
          )
          expected_new_sha=$(printf '%s' "$remote_info" | tail -1)
          test -n "$expected_new_sha"

          curl --fail --silent --show-error --user-agent 'Mozilla/5.0' \
            --resolve "studio.myvitaworld.online:443:$CPANEL_SSH_HOST" \
            -o /tmp/thee-index.html \
            https://studio.myvitaworld.online/
          grep -Fq "src=\"/$NEW_ASSET\"" /tmp/thee-index.html

          curl --fail --silent --show-error --user-agent 'Mozilla/5.0' \
            --resolve "studio.myvitaworld.online:443:$CPANEL_SSH_HOST" \
            -o /tmp/thee-cast-fullbody-fix.js \
            "https://studio.myvitaworld.online/$NEW_ASSET"
          public_sha=$(sha256sum /tmp/thee-cast-fullbody-fix.js | awk '{print $1}')
          test "$public_sha" = "$expected_new_sha"
          node --check /tmp/thee-cast-fullbody-fix.js
          grep -Fq 'fullBodyPreviewRetry' /tmp/thee-cast-fullbody-fix.js
          echo "CAST_FULLBODY_HOTFIX_OK asset=$NEW_ASSET sha256=$public_sha"
