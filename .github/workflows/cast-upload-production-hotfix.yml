name: Temporary Production Cast Brand Step Hotfix

on:
  push:
    branches:
      - ops/cast-upload-debug-20260908
    paths:
      - .github/workflows/cast-upload-production-hotfix.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hotfix:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CPANEL_SSH_HOST: ${{ secrets.CPANEL_SSH_HOST }}
      CPANEL_SSH_PORT: ${{ secrets.CPANEL_SSH_PORT }}
      CPANEL_SSH_USER: ${{ secrets.CPANEL_SSH_USER }}
      CPANEL_DEPLOY_PATH: ${{ secrets.CPANEL_DEPLOY_PATH }}
      CPANEL_BACKUP_ROOT: ${{ secrets.CPANEL_BACKUP_ROOT }}
      EXPECTED_JS_SHA256: dcc9ef70c8ddade54a98485dad2c0066db39b3c833cdac4dc9c4cc4482632e62
      CURRENT_ASSET: assets/index-DhbQbUSO-castfix5-20260908.js
      NEW_ASSET: assets/index-DhbQbUSO-castfix6-20260908.js

    steps:
      - name: Configure scoped SSH
        env:
          CPANEL_SSH_PRIVATE_KEY: ${{ secrets.CPANEL_SSH_PRIVATE_KEY }}
          CPANEL_SSH_KNOWN_HOSTS: ${{ secrets.CPANEL_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$CPANEL_SSH_HOST"
          test -n "$CPANEL_SSH_PORT"
          test -n "$CPANEL_SSH_USER"
          test -n "$CPANEL_DEPLOY_PATH"
          test -n "$CPANEL_BACKUP_ROOT"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$CPANEL_SSH_PRIVATE_KEY" > ~/.ssh/thee_operator
          printf '%s\n' "$CPANEL_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/thee_operator ~/.ssh/known_hosts

      - name: Apply guarded Brand-step control repair
        shell: bash
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o ConnectTimeout=10 \
            -i ~/.ssh/thee_operator -p "$CPANEL_SSH_PORT" \
            "$CPANEL_SSH_USER@$CPANEL_SSH_HOST" \
            "WEB='$CPANEL_DEPLOY_PATH' BACKUP_ROOT='$CPANEL_BACKUP_ROOT' EXPECTED_JS_SHA256='$EXPECTED_JS_SHA256' CURRENT_ASSET='$CURRENT_ASSET' NEW_ASSET='$NEW_ASSET' bash -s" <<'REMOTE'
          set -euo pipefail
          current="$WEB/$CURRENT_ASSET"
          new="$WEB/$NEW_ASSET"
          tmp_new="${new}.tmp.js"
          index="$WEB/index.html"

          test -r "$current" && test -w "$WEB/assets" && test -r "$index" && test -w "$index"
          actual_js=$(sha256sum "$current" | awk '{print $1}')
          test "$actual_js" = "$EXPECTED_JS_SHA256" || { echo "Refusing hotfix: active JS changed ($actual_js)"; exit 31; }

          current_ref="/$CURRENT_ASSET"
          new_ref="/$NEW_ASSET"
          count=$(python3 - "$index" "$current_ref" <<'PY'
          import sys
          text=open(sys.argv[1],encoding='utf-8').read()
          print(text.count(sys.argv[2]))
          PY
          )
          test "$count" = 1 || { echo "Refusing hotfix: expected one active bundle reference, found $count"; exit 32; }

          stamp=$(date -u +%Y%m%dT%H%M%SZ)
          backup="$BACKUP_ROOT/cast-brand-hotfix-$stamp"
          mkdir -p "$backup/assets"
          cp -p "$index" "$backup/index.html"
          cp -p "$current" "$backup/$CURRENT_ASSET"
          printf '%s  %s\n' "$actual_js" "$CURRENT_ASSET" > "$backup/SHA256SUMS"
          sha256sum "$index" >> "$backup/SHA256SUMS"

          rm -f "$tmp_new"
          cp "$current" "$tmp_new"
          python3 - "$tmp_new" <<'PY'
          import sys
          path=sys.argv[1]
          text=open(path,'r',encoding='utf-8').read()

          old_pill='function cd({label:t,active:r,onClick:n}){return i.jsx("button",{onClick:n,className:"ts-pill",style:{padding:"6px 14px",borderRadius:"var(--radius-pill)",cursor:"pointer",border:`1.5px solid ${r?"var(--accent-deep)":"var(--border)"}`,background:r?"var(--rose-deep)":"transparent",color:r?"var(--accent-deep)":"var(--text-muted)",font:"500 0.78rem/1 var(--font-ui)"},children:t})}'
          new_pill='function cd({label:t,active:r,onClick:n,disabled:s=!1}){return i.jsx("button",{type:"button","aria-pressed":r,onClick:n,disabled:s,className:"ts-pill",style:{padding:"6px 14px",borderRadius:"var(--radius-pill)",cursor:s?"not-allowed":"pointer",opacity:s?.42:1,border:`1.5px solid ${r?"var(--accent-deep)":"var(--border)"}`,background:r?"var(--rose-deep)":"transparent",color:r?"var(--accent-deep)":"var(--text-muted)",font:"500 0.78rem/1 var(--font-ui)"},children:t})}'
          if text.count(old_pill) != 1:
              raise SystemExit(f'Expected one Brand pill component, found {text.count(old_pill)}')
          text=text.replace(old_pill,new_pill,1)

          replacements={
            'i.jsx("div",{style:Xe,children:"Their World"})':'i.jsxs("div",{style:Xe,children:["Their World ",i.jsx("span",{style:{textTransform:"none",letterSpacing:0,fontWeight:500},children:"(choose up to 3)"})]})',
            'i.jsx("div",{style:Xe,children:"Their Energy"})':'i.jsxs("div",{style:Xe,children:["Their Energy ",i.jsx("span",{style:{textTransform:"none",letterSpacing:0,fontWeight:500},children:"(choose up to 3)"})]})',
            'i.jsx("div",{style:Xe,children:"Content Photography Style"})':'i.jsxs("div",{style:Xe,children:["Content Photography Style ",i.jsx("span",{style:{textTransform:"none",letterSpacing:0,fontWeight:500},children:"(choose up to 3)"})]})',
            'i.jsx("div",{style:Xe,children:"Creator Niche"})':'i.jsxs("div",{style:Xe,children:["Creator Niche ",i.jsx("span",{style:{textTransform:"none",letterSpacing:0,fontWeight:500},children:"(choose up to 3)"})]})',
            'i.jsx(cd,{label:y,active:d.worlds.includes(y),onClick:()=>c("worlds")(dd(d.worlds,y))},y)':'i.jsx(cd,{label:y,active:d.worlds.includes(y),disabled:!d.worlds.includes(y)&&d.worlds.length>=3,onClick:()=>c("worlds")(d.worlds.includes(y)?d.worlds.filter(k=>k!==y):d.worlds.length<3?[...d.worlds,y]:d.worlds)},y)',
            'i.jsx(cd,{label:y,active:d.energies.includes(y),onClick:()=>c("energies")(dd(d.energies,y))},y)':'i.jsx(cd,{label:y,active:d.energies.includes(y),disabled:!d.energies.includes(y)&&d.energies.length>=3,onClick:()=>c("energies")(d.energies.includes(y)?d.energies.filter(k=>k!==y):d.energies.length<3?[...d.energies,y]:d.energies)},y)',
            'i.jsx(cd,{label:y,active:d.photographyStyles.includes(y),onClick:()=>c("photographyStyles")(dd(d.photographyStyles,y))},y)':'i.jsx(cd,{label:y,active:d.photographyStyles.includes(y),disabled:!d.photographyStyles.includes(y)&&d.photographyStyles.length>=3,onClick:()=>c("photographyStyles")(d.photographyStyles.includes(y)?d.photographyStyles.filter(k=>k!==y):d.photographyStyles.length<3?[...d.photographyStyles,y]:d.photographyStyles)},y)',
            'i.jsx(cd,{label:y,active:d.niches.includes(y),onClick:()=>c("niches")(dd(d.niches,y))},y)':'i.jsx(cd,{label:y,active:d.niches.includes(y),disabled:!d.niches.includes(y)&&d.niches.length>=3,onClick:()=>c("niches")(d.niches.includes(y)?d.niches.filter(k=>k!==y):d.niches.length<3?[...d.niches,y]:d.niches)},y)'
          }
          for old,new in replacements.items():
              count=text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected one Brand-step target, found {count}: {old[:80]}')
              text=text.replace(old,new,1)

          open(path,'w',encoding='utf-8',newline='').write(text)
          PY

          node --check "$tmp_new"
          chmod 644 "$tmp_new"
          mv -f "$tmp_new" "$new"

          cp "$index" "$index.tmp"
          python3 - "$index.tmp" "$current_ref" "$new_ref" <<'PY'
          import sys
          path,old,new=sys.argv[1:]
          text=open(path,'r',encoding='utf-8').read()
          if text.count(old) != 1:
              raise SystemExit(f'Expected one current asset reference, found {text.count(old)}')
          text=text.replace(old,new,1)
          open(path,'w',encoding='utf-8',newline='').write(text)
          PY
          chmod 644 "$index.tmp"
          mv -f "$index.tmp" "$index"

          grep -Fq "$new_ref" "$index"
          grep -Fq '"aria-pressed":r' "$new"
          grep -Fq 'choose up to 3' "$new"
          grep -Fq 'd.worlds.length>=3' "$new"
          grep -Fq 'd.energies.length>=3' "$new"
          grep -Fq 'd.photographyStyles.length>=3' "$new"
          grep -Fq 'd.niches.length>=3' "$new"
          if grep -Fq "$current_ref\"" "$index"; then
            echo 'Old Cast bundle is still active.' >&2
            exit 33
          fi

          printf 'backup=%s\nnew_asset=%s\nnew_sha256=%s\n' "$backup" "$NEW_ASSET" "$(sha256sum "$new" | awk '{print $1}')"
          REMOTE

      - name: Verify disk and public HTTPS
        shell: bash
        run: |
          set -euo pipefail
          remote_info=$(ssh -o BatchMode=yes -o ConnectTimeout=10 \
            -i ~/.ssh/thee_operator -p "$CPANEL_SSH_PORT" \
            "$CPANEL_SSH_USER@$CPANEL_SSH_HOST" \
            "WEB='$CPANEL_DEPLOY_PATH' NEW_ASSET='$NEW_ASSET' bash -s" <<'REMOTE'
          set -euo pipefail
          asset="$WEB/$NEW_ASSET"
          index="$WEB/index.html"
          test -s "$asset" && test -s "$index"
          grep -Fq "src=\"/$NEW_ASSET\"" "$index"
          node --check "$asset"
          grep -Fq '"aria-pressed":r' "$asset"
          grep -Fq 'choose up to 3' "$asset"
          grep -Fq 'd.worlds.length>=3' "$asset"
          grep -Fq 'd.energies.length>=3' "$asset"
          grep -Fq 'd.photographyStyles.length>=3' "$asset"
          grep -Fq 'd.niches.length>=3' "$asset"
          printf '%s\n' "$(sha256sum "$asset" | awk '{print $1}')"
          REMOTE
          )
          expected_new_sha=$(printf '%s' "$remote_info" | tail -1)
          test -n "$expected_new_sha"

          curl --fail --silent --show-error --user-agent 'Mozilla/5.0' \
            --resolve "studio.myvitaworld.online:443:$CPANEL_SSH_HOST" \
            -o /tmp/thee-index.html \
            https://studio.myvitaworld.online/
          grep -Fq "src=\"/$NEW_ASSET\"" /tmp/thee-index.html

          curl --fail --silent --show-error --user-agent 'Mozilla/5.0' \
            --resolve "studio.myvitaworld.online:443:$CPANEL_SSH_HOST" \
            -o /tmp/thee-cast-brand-fix.js \
            "https://studio.myvitaworld.online/$NEW_ASSET"
          public_sha=$(sha256sum /tmp/thee-cast-brand-fix.js | awk '{print $1}')
          test "$public_sha" = "$expected_new_sha"
          node --check /tmp/thee-cast-brand-fix.js
          grep -Fq '"aria-pressed":r' /tmp/thee-cast-brand-fix.js
          grep -Fq 'choose up to 3' /tmp/thee-cast-brand-fix.js
          echo "CAST_BRAND_HOTFIX_OK asset=$NEW_ASSET sha256=$public_sha"
