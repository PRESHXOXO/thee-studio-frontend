name: Temporary Cutover Auth Secret Probe

on:
  push:
    branches:
      - ops/dns-cutover-20260906
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    env:
      THEE_OWNER_EMAIL: ${{ secrets.THEE_OWNER_EMAIL }}
      THEE_OWNER_PASSWORD: ${{ secrets.THEE_OWNER_PASSWORD }}
      THEE_ADMIN_EMAIL: ${{ secrets.THEE_ADMIN_EMAIL }}
      THEE_ADMIN_PASSWORD: ${{ secrets.THEE_ADMIN_PASSWORD }}
      THEE_USER_EMAIL: ${{ secrets.THEE_USER_EMAIL }}
      THEE_USER_PASSWORD: ${{ secrets.THEE_USER_PASSWORD }}
      THEE_TEST_USER_EMAIL: ${{ secrets.THEE_TEST_USER_EMAIL }}
      THEE_TEST_USER_PASSWORD: ${{ secrets.THEE_TEST_USER_PASSWORD }}
      THEE_STUDIO_OWNER_EMAIL: ${{ secrets.THEE_STUDIO_OWNER_EMAIL }}
      THEE_STUDIO_OWNER_PASSWORD: ${{ secrets.THEE_STUDIO_OWNER_PASSWORD }}
      THEE_STUDIO_USER_EMAIL: ${{ secrets.THEE_STUDIO_USER_EMAIL }}
      THEE_STUDIO_USER_PASSWORD: ${{ secrets.THEE_STUDIO_USER_PASSWORD }}
      PROD_OWNER_EMAIL: ${{ secrets.PROD_OWNER_EMAIL }}
      PROD_OWNER_PASSWORD: ${{ secrets.PROD_OWNER_PASSWORD }}
      PROD_USER_EMAIL: ${{ secrets.PROD_USER_EMAIL }}
      PROD_USER_PASSWORD: ${{ secrets.PROD_USER_PASSWORD }}
      E2E_OWNER_EMAIL: ${{ secrets.E2E_OWNER_EMAIL }}
      E2E_OWNER_PASSWORD: ${{ secrets.E2E_OWNER_PASSWORD }}
      E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
      E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
      CUTOVER_OWNER_EMAIL: ${{ secrets.CUTOVER_OWNER_EMAIL }}
      CUTOVER_OWNER_PASSWORD: ${{ secrets.CUTOVER_OWNER_PASSWORD }}
      CUTOVER_USER_EMAIL: ${{ secrets.CUTOVER_USER_EMAIL }}
      CUTOVER_USER_PASSWORD: ${{ secrets.CUTOVER_USER_PASSWORD }}
      OWNER_EMAIL: ${{ secrets.OWNER_EMAIL }}
      OWNER_PASSWORD: ${{ secrets.OWNER_PASSWORD }}
      TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
      TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
    steps:
      - name: Print presence only
        shell: bash
        run: |
          set -eu
          for n in \
            THEE_OWNER_EMAIL THEE_OWNER_PASSWORD THEE_ADMIN_EMAIL THEE_ADMIN_PASSWORD \
            THEE_USER_EMAIL THEE_USER_PASSWORD THEE_TEST_USER_EMAIL THEE_TEST_USER_PASSWORD \
            THEE_STUDIO_OWNER_EMAIL THEE_STUDIO_OWNER_PASSWORD THEE_STUDIO_USER_EMAIL THEE_STUDIO_USER_PASSWORD \
            PROD_OWNER_EMAIL PROD_OWNER_PASSWORD PROD_USER_EMAIL PROD_USER_PASSWORD \
            E2E_OWNER_EMAIL E2E_OWNER_PASSWORD E2E_USER_EMAIL E2E_USER_PASSWORD \
            CUTOVER_OWNER_EMAIL CUTOVER_OWNER_PASSWORD CUTOVER_USER_EMAIL CUTOVER_USER_PASSWORD \
            OWNER_EMAIL OWNER_PASSWORD TEST_USER_EMAIL TEST_USER_PASSWORD; do
              if [ -n "${!n:-}" ]; then echo "$n=PRESENT"; else echo "$n=ABSENT"; fi
          done
