name: Temporary Cutover Email Diagnostic

on:
  push:
    branches:
      - ops/dns-cutover-20260906
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CPANEL_SSH_HOST: ${{ secrets.CPANEL_SSH_HOST }}
      CPANEL_SSH_PORT: ${{ secrets.CPANEL_SSH_PORT }}
      CPANEL_SSH_USER: ${{ secrets.CPANEL_SSH_USER }}
    steps:
      - name: Configure existing SSH path
        env:
          CPANEL_SSH_PRIVATE_KEY: ${{ secrets.CPANEL_SSH_PRIVATE_KEY }}
          CPANEL_SSH_KNOWN_HOSTS: ${{ secrets.CPANEL_SSH_KNOWN_HOSTS }}
        run: |
          set -eu
          install -d -m 700 ~/.ssh
          printf '%s\n' "$CPANEL_SSH_PRIVATE_KEY" > ~/.ssh/thee_diag
          printf '%s\n' "$CPANEL_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/thee_diag ~/.ssh/known_hosts

      - name: Inspect live signup and mail behavior safely
        run: |
          set -eu
          host=studio.myvitaworld.online
          ua='Mozilla/5.0 Chrome/152.0.0.0 Safari/537.36'

          curl -sS --compressed -A "$ua" "https://$host/" -o /tmp/index.html
          js=$(grep -oE 'src="/assets/[^"]+\.js"' /tmp/index.html | head -1 | cut -d'"' -f2)
          curl -sS --compressed -A "$ua" "https://$host$js" -o /tmp/app.js

          echo 'signup_ui_context_begin'
          for needle in '/auth/signup' 'verification' 'verify your email' 'check your email' 'email sent' 'confirm your email' 'reset-password'; do
            echo "needle=$needle count=$(grep -Fio "$needle" /tmp/app.js | wc -l | tr -d ' ')"
            grep -Fio -m 2 -B 0 -A 0 "$needle" /tmp/app.js >/dev/null || true
          done
          grep -Eo '.{0,260}/auth/signup.{0,520}' /tmp/app.js | head -3 | sed -E 's/[A-Za-z0-9_.-]{80,}/[LONG_TOKEN]/g' || true
          echo 'signup_ui_context_end'

          ssh -o BatchMode=yes -o ConnectTimeout=10 \
            -i ~/.ssh/thee_diag -p "$CPANEL_SSH_PORT" \
            "$CPANEL_SSH_USER@$CPANEL_SSH_HOST" 'bash -s' <<'REMOTE'
          set -eu
          pid=$(systemctl show thee-studio-api.service -p MainPID --value 2>/dev/null || true)
          echo 'mail_env_names_begin'
          if [ -n "$pid" ] && [ -r "/proc/$pid/environ" ]; then
            tr '\0' '\n' < "/proc/$pid/environ" | sed -nE 's/^([A-Za-z_][A-Za-z0-9_]*)=.*/\1/p' | grep -Ei 'MAIL|SMTP|RESEND|POSTMARK|SENDGRID|SES|EMAIL|AUTH|SITE|BASE_URL' | sort -u || true
          else
            echo 'process_environment=not_readable_from_delegated_account'
          fi
          echo 'mail_env_names_end'

          echo 'recent_auth_mail_logs_begin'
          journalctl -u thee-studio-api.service --since '-45 min' --no-pager 2>/dev/null | \
            grep -Eai 'signup|register|verify|verification|confirm|email|mail|smtp|resend|postmark|sendgrid|ses|password.reset|recover|mailer|nodemailer|auth' | \
            sed -E 's/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}/[EMAIL]/g; s/(password|secret|token|authorization|apikey|api_key|key)([=:" ]+)[^ ,}";]+/\1\2[REDACTED]/Ig' | \
            tail -200 || true
          echo 'recent_auth_mail_logs_end'
          REMOTE
