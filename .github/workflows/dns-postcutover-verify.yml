name: Temporary DNS Post-Cutover Verify

on:
  push:
    branches:
      - ops/dns-cutover-20260906
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify DNS health and capture browser network
        run: |
          set -eu
          host=studio.myvitaworld.online
          target=199.250.200.250
          echo "resolver_cname=$(dig +short "$host" CNAME | paste -sd, -)"
          echo "resolver_a=$(dig +short "$host" A | grep -E '^[0-9.]+$' | paste -sd, -)"
          for ns in ns73.domaincontrol.com ns74.domaincontrol.com; do
            echo "ns=$ns cname=$(dig +short @$ns "$host" CNAME | paste -sd, -)"
            echo "ns=$ns a=$(dig +short @$ns "$host" A | grep -E '^[0-9.]+$' | paste -sd, -)"
          done

          ua='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/152.0.0.0 Safari/537.36'
          curl -sS --compressed --http1.1 --max-time 15 -A "$ua" \
            -H 'Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,*/*;q=0.8' \
            -o /tmp/root -w 'root_status=%{http_code} root_ip=%{remote_ip} root_type=%{content_type}\n' \
            "https://$host/"
          curl -sS --compressed --http1.1 --max-time 15 -A "$ua" \
            -H 'Accept: application/json, text/plain, */*' \
            -H "Origin: https://$host" -H "Referer: https://$host/" \
            -o /tmp/ready -w 'ready_status=%{http_code} ready_ip=%{remote_ip} ready_type=%{content_type}\n' \
            "https://$host/api/readyz"
          echo -n 'ready_body='; cat /tmp/ready; echo

          chrome=$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)
          test -n "$chrome"
          echo "browser_binary=$(basename "$chrome")"
          rm -f /tmp/thee-netlog.json /tmp/dom.html
          set +e
          timeout 25s "$chrome" --headless=new --no-sandbox --disable-gpu \
            --disable-background-networking --disable-component-update --disable-default-apps \
            --disable-sync --metrics-recording-only --no-first-run \
            --log-net-log=/tmp/thee-netlog.json --net-log-capture-mode=Everything \
            --virtual-time-budget=12000 --dump-dom "https://$host/" > /tmp/dom.html 2>/tmp/chrome.err
          chrome_rc=$?
          set -e
          echo "browser_rc=$chrome_rc dom_bytes=$(wc -c < /tmp/dom.html | tr -d ' ') netlog_bytes=$(wc -c < /tmp/thee-netlog.json | tr -d ' ')"

          echo 'browser_url_hosts_begin'
          grep -Eo 'https?://[^" ]+' /tmp/thee-netlog.json | \
            sed -E 's#https?://([^/:]+).*#\1#' | sort -u | head -200 || true
          echo 'browser_url_hosts_end'
          echo "supabase_request_markers=$(grep -Eio 'https?://[^\" ]*supabase[^\" ]*' /tmp/thee-netlog.json | wc -l | tr -d ' ')"
          echo "old_project_request_markers=$(grep -Eio 'https?://[^\" ]*(owxxetqniuayhzktewho|qkrmkoixgznvxbcljmsx)[^\" ]*' /tmp/thee-netlog.json | wc -l | tr -d ' ')"
          echo "vercel_request_markers=$(grep -Eio 'https?://[^\" ]*vercel[^\" ]*' /tmp/thee-netlog.json | wc -l | tr -d ' ')"
          echo 'thee_api_request_markers_begin'
          grep -Eo 'https://studio\.myvitaworld\.online/api/[^" ]*' /tmp/thee-netlog.json | sort -u | head -100 || true
          echo 'thee_api_request_markers_end'

          authoritative_a=$(dig +short @ns73.domaincontrol.com "$host" A | grep -E '^[0-9.]+$' | head -1)
          test "$authoritative_a" = "$target"
          grep -q '"ok"[[:space:]]*:[[:space:]]*true' /tmp/ready
