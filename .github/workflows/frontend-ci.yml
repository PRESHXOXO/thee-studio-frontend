name: Frontend CI

on:
  pull_request:
  push:
    branches: [codex/staging-supabase-integration]

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Production dependency security gate
        run: npm run audit:mvp
