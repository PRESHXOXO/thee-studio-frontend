name: One-Time Genfix3 Deploy

on:
  push:
    branches: [ops/cast-upload-debug-20260908]
    paths: [.github/workflows/genfix2-deploy.yml]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CPANEL_SSH_HOST: ${{ secrets.CPANEL_SSH_HOST }}
      CPANEL_SSH_PORT: ${{ secrets.CPANEL_SSH_PORT }}
      CPANEL_SSH_USER: ${{ secrets.CPANEL_SSH_USER }}
      CPANEL_DEPLOY_PATH: ${{ secrets.CPANEL_DEPLOY_PATH }}
      CPANEL_BACKUP_ROOT: ${{ secrets.CPANEL_BACKUP_ROOT }}
      EXPECTED_JS_SHA256: 4c3cc3d7385aadeef2fbaed60d75be3342612e8ae810c59dd062520c0760a60c
      CURRENT_ASSET: assets/index-DhbQbUSO-genfix2-20260908.js
      NEW_ASSET: assets/index-DhbQbUSO-genfix3-20260908.js

    steps:
      - uses: actions/checkout@v4

      - name: Configure scoped SSH
        env:
          KEY: ${{ secrets.CPANEL_SSH_PRIVATE_KEY }}
          HOSTS: ${{ secrets.CPANEL_SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/thee_operator
          printf '%s\n' "$HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/thee_operator ~/.ssh/known_hosts

      - name: Stage patch
        run: scp -q -o BatchMode=yes -i ~/.ssh/thee_operator -P "$CPANEL_SSH_PORT" .ops/genfix3_creator_route_patch.py "$CPANEL_SSH_USER@$CPANEL_SSH_HOST:.thee-genfix3-patch.py"

      - name: Deploy
        run: |
          ssh -o BatchMode=yes -i ~/.ssh/thee_operator -p "$CPANEL_SSH_PORT" "$CPANEL_SSH_USER@$CPANEL_SSH_HOST" \
            "WEB='$CPANEL_DEPLOY_PATH' BACKUP_ROOT='$CPANEL_BACKUP_ROOT' EXPECTED='$EXPECTED_JS_SHA256' CURRENT='$CURRENT_ASSET' NEW='$NEW_ASSET' bash -s" <<'REMOTE'
          set -euo pipefail
          current="$WEB/$CURRENT"; new="$WEB/$NEW"; index="$WEB/index.html"; tmp="${new}.tmp.js"
          test "$(sha256sum "$current" | awk '{print $1}')" = "$EXPECTED"
          test "$(grep -oF "/$CURRENT" "$index" | wc -l)" = 1

          backup="$BACKUP_ROOT/director-creator-route-repair-$(date -u +%Y%m%dT%H%M%SZ)"
          mkdir -p "$backup/assets"
          cp -p "$index" "$backup/index.html"
          cp -p "$current" "$backup/$CURRENT"

          cp "$current" "$tmp"
          python3 "$HOME/.thee-genfix3-patch.py" "$tmp"
          node --check "$tmp"
          grep -Fq 'hL("/creators")' "$tmp"
          grep -Fq 'Array.isArray(r.data.creators)' "$tmp"
          if grep -Fq 'hL("/compat/creators")' "$tmp"; then exit 41; fi
          chmod 644 "$tmp"
          mv -f "$tmp" "$new"

          python3 - "$index" "/$CURRENT" "/$NEW" <<'PY'
          import sys
          p,o,n=sys.argv[1:]
          s=open(p,encoding='utf-8').read()
          assert s.count(o)==1
          open(p,'w',encoding='utf-8').write(s.replace(o,n,1))
          PY

          rm -f "$HOME/.thee-genfix3-patch.py"
          grep -Fq "/$NEW" "$index"
          echo "DEPLOY_OK sha256=$(sha256sum "$new" | awk '{print $1}')"
          REMOTE

      - name: Verify public browser bundle
        run: |
          set -euo pipefail
          ua='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/152 Safari/537.36'
          curl -fsS -A "$ua" --resolve "studio.myvitaworld.online:443:$CPANEL_SSH_HOST" -o /tmp/index.html https://studio.myvitaworld.online/
          grep -Fq "src=\"/$NEW_ASSET\"" /tmp/index.html
          curl -fsS -A "$ua" --resolve "studio.myvitaworld.online:443:$CPANEL_SSH_HOST" -o /tmp/genfix3.js "https://studio.myvitaworld.online/$NEW_ASSET"
          node --check /tmp/genfix3.js
          grep -Fq 'hL("/creators")' /tmp/genfix3.js
          grep -Fq 'Array.isArray(r.data.creators)' /tmp/genfix3.js
          if grep -Fq 'hL("/compat/creators")' /tmp/genfix3.js; then exit 42; fi
          echo "PUBLIC_OK sha256=$(sha256sum /tmp/genfix3.js | awk '{print $1}')"
