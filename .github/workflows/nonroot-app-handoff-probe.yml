name: Temporary Non-Root App Handoff Probe

on:
  push:
    branches:
      - ops/nonroot-handoff-probe-20260905
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CPANEL_SSH_HOST: ${{ secrets.CPANEL_SSH_HOST }}
      CPANEL_SSH_PORT: ${{ secrets.CPANEL_SSH_PORT }}
      CPANEL_SSH_USER: ${{ secrets.CPANEL_SSH_USER }}

    steps:
      - name: Configure SSH
        env:
          CPANEL_SSH_PRIVATE_KEY: ${{ secrets.CPANEL_SSH_PRIVATE_KEY }}
          CPANEL_SSH_KNOWN_HOSTS: ${{ secrets.CPANEL_SSH_KNOWN_HOSTS }}
        run: |
          set -eu
          test -n "$CPANEL_SSH_HOST"
          test -n "$CPANEL_SSH_PORT"
          test -n "$CPANEL_SSH_USER"
          test -n "$CPANEL_SSH_PRIVATE_KEY"
          test -n "$CPANEL_SSH_KNOWN_HOSTS"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$CPANEL_SSH_PRIVATE_KEY" > ~/.ssh/thee_operator
          printf '%s\n' "$CPANEL_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/thee_operator ~/.ssh/known_hosts

      - name: Inspect only Thee Studio application processes and listeners
        run: |
          set -eu
          ssh -o BatchMode=yes -o ConnectTimeout=10 \
            -i ~/.ssh/thee_operator -p "$CPANEL_SSH_PORT" \
            "$CPANEL_SSH_USER@$CPANEL_SSH_HOST" '
              set -eu
              echo app_processes_begin
              ps -u thee-studio -o pid=,ppid=,comm=,args= 2>/dev/null | sed -E "s/(password|secret|token|key)=([^[:space:]]+)/\1=[REDACTED]/Ig" || true
              echo app_processes_end
              echo app_listeners_begin
              if command -v lsof >/dev/null 2>&1; then
                lsof -nP -a -u thee-studio -iTCP -sTCP:LISTEN 2>/dev/null || true
              fi
              if command -v ss >/dev/null 2>&1; then
                for pid in $(pgrep -u thee-studio 2>/dev/null || true); do
                  printf "pid=%s cwd=" "$pid"
                  readlink "/proc/$pid/cwd" 2>/dev/null || echo unavailable
                done
                ss -ltn 2>/dev/null | awk "NR==1 || /:18000|:18001|:18002|:3000|:3001|:3002|:4000|:4001|:5000|:8000|:8080|:8787/" || true
              fi
              echo app_listeners_end
            '
