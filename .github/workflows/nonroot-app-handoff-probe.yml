name: Temporary Non-Root App Handoff Probe

on:
  push:
    branches:
      - ops/nonroot-handoff-probe-20260905
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CPANEL_SSH_HOST: ${{ secrets.CPANEL_SSH_HOST }}
      CPANEL_SSH_PORT: ${{ secrets.CPANEL_SSH_PORT }}
      CPANEL_SSH_USER: ${{ secrets.CPANEL_SSH_USER }}

    steps:
      - name: Configure SSH
        env:
          CPANEL_SSH_PRIVATE_KEY: ${{ secrets.CPANEL_SSH_PRIVATE_KEY }}
          CPANEL_SSH_KNOWN_HOSTS: ${{ secrets.CPANEL_SSH_KNOWN_HOSTS }}
        run: |
          set -eu
          test -n "$CPANEL_SSH_HOST"
          test -n "$CPANEL_SSH_PORT"
          test -n "$CPANEL_SSH_USER"
          test -n "$CPANEL_SSH_PRIVATE_KEY"
          test -n "$CPANEL_SSH_KNOWN_HOSTS"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$CPANEL_SSH_PRIVATE_KEY" > ~/.ssh/thee_operator
          printf '%s\n' "$CPANEL_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/thee_operator ~/.ssh/known_hosts

      - name: Map expected replacement API route families read-only
        run: |
          set -eu
          ssh -o BatchMode=yes -o ConnectTimeout=10 \
            -i ~/.ssh/thee_operator -p "$CPANEL_SSH_PORT" \
            "$CPANEL_SSH_USER@$CPANEL_SSH_HOST" 'bash -s' <<'REMOTE'
          set -eu
          base=http://127.0.0.1:4310
          paths='\
          /auth/v1/health \
          /auth/v1/settings \
          /auth/v1/user \
          /auth/v1/signup \
          /auth/v1/token \
          /auth/v1/recover \
          /auth/v1/logout \
          /auth/v1/verify \
          /rest/v1/creators \
          /rest/v1/projects \
          /rest/v1/generation_projects \
          /rest/v1/shots \
          /rest/v1/generation_shots \
          /rest/v1/provider_runs \
          /rest/v1/generations \
          /rest/v1/library_items \
          /rest/v1/still_reviews \
          /rest/v1/still_selections \
          /storage/v1/bucket \
          /functions/v1/thee-access \
          /functions/v1/library-items'

          for path in $paths; do
            for method in GET OPTIONS; do
              hdr=$(mktemp); body=$(mktemp)
              code=$(curl -sS --max-time 8 -X "$method" -D "$hdr" -o "$body" -w '%{http_code}' "$base$path" || true)
              allow=$(awk -F': ' 'tolower($1)=="allow" {gsub(/\r/,"",$2); print $2; exit}' "$hdr")
              ctype=$(awk -F': ' 'tolower($1)=="content-type" {gsub(/\r/,"",$2); print $2; exit}' "$hdr")
              printf 'method=%s path=%s status=%s allow=%s content_type=%s bytes=%s\n' "$method" "$path" "$code" "${allow:-}" "${ctype:-}" "$(wc -c < "$body" | tr -d ' ')"
              if [ "$method" = GET ] && [ "$code" != 404 ] && [ -s "$body" ]; then
                head -c 1200 "$body" | sed -E 's/(access_token|refresh_token|token|secret|password)(["=: ]+)[^," }]+/\1\2[REDACTED]/Ig' || true
                echo
              fi
              rm -f "$hdr" "$body"
            done
          done
          REMOTE
