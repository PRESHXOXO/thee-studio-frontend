name: Temporary Non-Root App Handoff Probe

on:
  push:
    branches:
      - ops/nonroot-handoff-probe-20260905
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CPANEL_SSH_HOST: ${{ secrets.CPANEL_SSH_HOST }}
      CPANEL_SSH_PORT: ${{ secrets.CPANEL_SSH_PORT }}
      CPANEL_SSH_USER: ${{ secrets.CPANEL_SSH_USER }}

    steps:
      - name: Configure SSH
        env:
          CPANEL_SSH_PRIVATE_KEY: ${{ secrets.CPANEL_SSH_PRIVATE_KEY }}
          CPANEL_SSH_KNOWN_HOSTS: ${{ secrets.CPANEL_SSH_KNOWN_HOSTS }}
        run: |
          set -eu
          test -n "$CPANEL_SSH_HOST"
          test -n "$CPANEL_SSH_PORT"
          test -n "$CPANEL_SSH_USER"
          test -n "$CPANEL_SSH_PRIVATE_KEY"
          test -n "$CPANEL_SSH_KNOWN_HOSTS"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$CPANEL_SSH_PRIVATE_KEY" > ~/.ssh/thee_operator
          printf '%s\n' "$CPANEL_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/thee_operator ~/.ssh/known_hosts

      - name: Probe replacement Fastify health and self-described routes
        run: |
          set -eu
          ssh -o BatchMode=yes -o ConnectTimeout=10 \
            -i ~/.ssh/thee_operator -p "$CPANEL_SSH_PORT" \
            "$CPANEL_SSH_USER@$CPANEL_SSH_HOST" '
              set -eu
              base=http://127.0.0.1:18000
              for path in /readyz /healthz /health /openapi.json /documentation/json /docs/json /routes /; do
                tmp=$(mktemp)
                code=$(curl -sS --max-time 8 -o "$tmp" -w "%{http_code}" "$base$path" || true)
                ctype=$(curl -sSI --max-time 8 "$base$path" 2>/dev/null | awk -F": " "tolower(\$1)==\"content-type\" {gsub(/\r/,\"\",\$2); print \$2; exit}" || true)
                printf "path=%s status=%s content_type=%s\n" "$path" "$code" "$ctype"
                if [ "$code" = 200 ]; then
                  bytes=$(wc -c < "$tmp" | tr -d " ")
                  printf "body_bytes=%s\n" "$bytes"
                  head -c 12000 "$tmp" | sed -E "s/(access_token|refresh_token|token|secret|password)([\"'\''=: ]+)[^,\"'\'' }]+/\1\2[REDACTED]/Ig" || true
                  printf "\n"
                fi
                rm -f "$tmp"
              done
            '
