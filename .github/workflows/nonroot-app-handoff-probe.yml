name: Temporary Non-Root App Handoff Probe

on:
  push:
    branches:
      - ops/nonroot-handoff-probe-20260905
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CPANEL_SSH_HOST: ${{ secrets.CPANEL_SSH_HOST }}
      CPANEL_SSH_PORT: ${{ secrets.CPANEL_SSH_PORT }}
      CPANEL_SSH_USER: ${{ secrets.CPANEL_SSH_USER }}

    steps:
      - name: Configure SSH
        env:
          CPANEL_SSH_PRIVATE_KEY: ${{ secrets.CPANEL_SSH_PRIVATE_KEY }}
          CPANEL_SSH_KNOWN_HOSTS: ${{ secrets.CPANEL_SSH_KNOWN_HOSTS }}
        run: |
          set -eu
          test -n "$CPANEL_SSH_HOST"
          test -n "$CPANEL_SSH_PORT"
          test -n "$CPANEL_SSH_USER"
          test -n "$CPANEL_SSH_PRIVATE_KEY"
          test -n "$CPANEL_SSH_KNOWN_HOSTS"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$CPANEL_SSH_PRIVATE_KEY" > ~/.ssh/thee_operator
          printf '%s\n' "$CPANEL_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/thee_operator ~/.ssh/known_hosts

      - name: Detect only bounded app-operator delegation
        run: |
          set -eu
          ssh -o BatchMode=yes -o ConnectTimeout=10 \
            -i ~/.ssh/thee_operator -p "$CPANEL_SSH_PORT" \
            "$CPANEL_SSH_USER@$CPANEL_SSH_HOST" '
              set -u;
              printf "operator_uid=%s\n" "$(id -u)";
              printf "operator_groups=%s\n" "$(id -Gn)";
              echo named_operator_commands_begin;
              for cmd in thee-studio-operator thee-studio-app-operator thee-studio-migrator; do p=$(command -v "$cmd" 2>/dev/null || true); [ -n "$p" ] && printf "%s=%s\n" "$cmd" "$p"; done;
              find /usr/local/bin /opt -maxdepth 2 -type f \( -iname "*thee*operator*" -o -iname "*thee*migrator*" \) -printf "%p\n" 2>/dev/null | sort | head -100;
              echo named_operator_commands_end;
              echo sudo_noninteractive_permissions_begin;
              if command -v sudo >/dev/null 2>&1; then sudo -n -l 2>&1 || true; else echo sudo=unavailable; fi;
              echo sudo_noninteractive_permissions_end;
            '
