name: Temporary Non-Root App Handoff Probe

on:
  push:
    branches:
      - ops/nonroot-handoff-probe-20260905
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CPANEL_SSH_HOST: ${{ secrets.CPANEL_SSH_HOST }}
      CPANEL_SSH_PORT: ${{ secrets.CPANEL_SSH_PORT }}
      CPANEL_SSH_USER: ${{ secrets.CPANEL_SSH_USER }}

    steps:
      - name: Configure SSH
        env:
          CPANEL_SSH_PRIVATE_KEY: ${{ secrets.CPANEL_SSH_PRIVATE_KEY }}
          CPANEL_SSH_KNOWN_HOSTS: ${{ secrets.CPANEL_SSH_KNOWN_HOSTS }}
        run: |
          set -eu
          test -n "$CPANEL_SSH_HOST"
          test -n "$CPANEL_SSH_PORT"
          test -n "$CPANEL_SSH_USER"
          test -n "$CPANEL_SSH_PRIVATE_KEY"
          test -n "$CPANEL_SSH_KNOWN_HOSTS"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$CPANEL_SSH_PRIVATE_KEY" > ~/.ssh/thee_operator
          printf '%s\n' "$CPANEL_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/thee_operator ~/.ssh/known_hosts

      - name: Trace only Thee Studio process service metadata
        run: |
          set -eu
          ssh -o BatchMode=yes -o ConnectTimeout=10 \
            -i ~/.ssh/thee_operator -p "$CPANEL_SSH_PORT" \
            "$CPANEL_SSH_USER@$CPANEL_SSH_HOST" '
              set -eu
              for pid in $(pgrep -u thee-studio 2>/dev/null || true); do
                printf "pid=%s\n" "$pid"
                printf "cmd="; tr "\0" " " < "/proc/$pid/cmdline" 2>/dev/null | sed -E "s/(password|secret|token|key)=([^[:space:]]+)/\1=[REDACTED]/Ig" || true; printf "\n"
                printf "cgroup="; cat "/proc/$pid/cgroup" 2>/dev/null | tr "\n" ";" || true; printf "\n"
              done

              echo systemd_unit_metadata_begin
              for unit in $(for pid in $(pgrep -u thee-studio 2>/dev/null || true); do cat "/proc/$pid/cgroup" 2>/dev/null; done | sed -nE "s#.*(/|^)([^/]+\\.service)$#\2#p" | sort -u); do
                printf "unit=%s\n" "$unit"
                systemctl show "$unit" --no-pager \
                  -p Id -p MainPID -p User -p Group -p ActiveState -p SubState -p FragmentPath -p EnvironmentFiles \
                  2>/dev/null || true
                printf "exec_start="
                systemctl show "$unit" --no-pager -p ExecStart --value 2>/dev/null | sed -E "s/(password|secret|token|key)(=|[[:space:]]+)[^ ;}]+/\1\2[REDACTED]/Ig" || true
              done
              echo systemd_unit_metadata_end

              echo candidate_local_ports_begin
              ss -ltn 2>/dev/null | awk "NR==1 || /127\.0\.0\.1|\[::1\]/" | head -100 || true
              echo candidate_local_ports_end
            '
