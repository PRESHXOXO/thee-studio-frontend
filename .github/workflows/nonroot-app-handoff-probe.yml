name: Temporary Non-Root App Handoff Probe

on:
  push:
    branches:
      - ops/nonroot-handoff-probe-20260905
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CPANEL_SSH_HOST: ${{ secrets.CPANEL_SSH_HOST }}
      CPANEL_SSH_PORT: ${{ secrets.CPANEL_SSH_PORT }}
      CPANEL_SSH_USER: ${{ secrets.CPANEL_SSH_USER }}

    steps:
      - name: Configure SSH
        env:
          CPANEL_SSH_PRIVATE_KEY: ${{ secrets.CPANEL_SSH_PRIVATE_KEY }}
          CPANEL_SSH_KNOWN_HOSTS: ${{ secrets.CPANEL_SSH_KNOWN_HOSTS }}
        run: |
          set -eu
          test -n "$CPANEL_SSH_HOST"
          test -n "$CPANEL_SSH_PORT"
          test -n "$CPANEL_SSH_USER"
          test -n "$CPANEL_SSH_PRIVATE_KEY"
          test -n "$CPANEL_SSH_KNOWN_HOSTS"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$CPANEL_SSH_PRIVATE_KEY" > ~/.ssh/thee_operator
          printf '%s\n' "$CPANEL_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/thee_operator ~/.ssh/known_hosts

      - name: Map bootstrap reset admin and nested routes without mutation
        run: |
          set -eu
          ssh -o BatchMode=yes -o ConnectTimeout=10 \
            -i ~/.ssh/thee_operator -p "$CPANEL_SSH_PORT" \
            "$CPANEL_SSH_USER@$CPANEL_SSH_HOST" 'bash -s' <<'REMOTE'
          set -eu
          base=http://127.0.0.1:4310
          uuid=00000000-0000-4000-8000-000000000000

          cat > /tmp/thee-route-candidates.$$ <<PATHS
          /api/auth/forgot-password
          /api/auth/request-reset
          /api/auth/request-password-reset
          /api/auth/password-reset/request
          /api/auth/reset-password/request
          /api/auth/recover
          /api/auth/bootstrap
          /api/auth/bootstrap-owner
          /api/bootstrap
          /api/bootstrap-owner
          /api/bootstrap/owner
          /api/owner/bootstrap
          /api/admin/bootstrap
          /api/admin/bootstrap-owner
          /api/admin/users
          /api/admin/me
          /api/admin/health
          /api/admin/database
          /api/admin/db
          /api/admin/migrations
          /api/admin/schema
          /api/diagnostics
          /api/migrations
          /api/schema
          /api/projects/$uuid
          /api/projects/$uuid/shots
          /api/projects/$uuid/reviews
          /api/projects/$uuid/selections
          /api/creators/$uuid
          /api/creators/$uuid/references
          /api/creators/$uuid/reference-assets
          /api/library/$uuid
          /api/library/items/$uuid
          /api/library/items/$uuid/reviews
          /api/library/items/$uuid/selections
          /api/library/items/$uuid/selection
          /api/generations/$uuid
          /api/generation-jobs/$uuid
          /api/provider-runs/$uuid
          /api/runs/$uuid
          /api/shots/$uuid
          /api/reviews/$uuid
          /api/selections/$uuid
          PATHS

          while IFS= read -r path; do
            [ -n "$path" ] || continue
            for method in GET POST PATCH DELETE; do
              body=$(mktemp)
              case "$method" in
                POST|PATCH) code=$(curl -sS --max-time 5 -X "$method" -H 'Content-Type: application/json' -d '{}' -o "$body" -w '%{http_code}' "$base$path" || true) ;;
                *) code=$(curl -sS --max-time 5 -X "$method" -o "$body" -w '%{http_code}' "$base$path" || true) ;;
              esac
              if [ "$code" != 404 ]; then
                printf 'method=%s path=%s status=%s bytes=%s\n' "$method" "$path" "$code" "$(wc -c < "$body" | tr -d ' ')"
                head -c 700 "$body" | sed -E 's/(access_token|refresh_token|token|secret|password)(["=: ]+)[^," }]+/\1\2[REDACTED]/Ig' || true
                echo
              fi
              rm -f "$body"
            done
          done < /tmp/thee-route-candidates.$$
          rm -f /tmp/thee-route-candidates.$$
          REMOTE
