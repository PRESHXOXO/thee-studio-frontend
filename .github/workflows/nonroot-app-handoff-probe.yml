name: Temporary Non-Root App Handoff Probe

on:
  push:
    branches:
      - ops/nonroot-handoff-probe-20260905
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CPANEL_SSH_HOST: ${{ secrets.CPANEL_SSH_HOST }}
      CPANEL_SSH_PORT: ${{ secrets.CPANEL_SSH_PORT }}
      CPANEL_SSH_USER: ${{ secrets.CPANEL_SSH_USER }}

    steps:
      - name: Configure SSH
        env:
          CPANEL_SSH_PRIVATE_KEY: ${{ secrets.CPANEL_SSH_PRIVATE_KEY }}
          CPANEL_SSH_KNOWN_HOSTS: ${{ secrets.CPANEL_SSH_KNOWN_HOSTS }}
        run: |
          set -eu
          test -n "$CPANEL_SSH_HOST"
          test -n "$CPANEL_SSH_PORT"
          test -n "$CPANEL_SSH_USER"
          test -n "$CPANEL_SSH_PRIVATE_KEY"
          test -n "$CPANEL_SSH_KNOWN_HOSTS"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$CPANEL_SSH_PRIVATE_KEY" > ~/.ssh/thee_operator
          printf '%s\n' "$CPANEL_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/thee_operator ~/.ssh/known_hosts

      - name: Inspect only non-secret handoff metadata in current SSH home
        run: |
          set -eu
          ssh -o BatchMode=yes -o ConnectTimeout=10 \
            -i ~/.ssh/thee_operator -p "$CPANEL_SSH_PORT" \
            "$CPANEL_SSH_USER@$CPANEL_SSH_HOST" '
              set -eu;
              printf "operator_uid=%s\n" "$(id -u)";
              echo app_path_metadata_begin;
              namei -l /opt/thee-studio-app 2>/dev/null || true;
              echo app_path_metadata_end;
              echo candidate_handoff_files_begin;
              find "$HOME" -maxdepth 4 -type f \( -iname "*thee*" -o -iname "*operator*" -o -iname "*migrator*" -o -iname "*handoff*" -o -iname "*vps*" \) -printf "%p\n" 2>/dev/null | sed "s#^$HOME#~#" | sort | head -100;
              echo candidate_handoff_files_end;
              echo ssh_config_metadata_begin;
              if [ -r "$HOME/.ssh/config" ]; then grep -E "^[[:space:]]*(Host|User|Hostname|Port)[[:space:]]" "$HOME/.ssh/config" || true; else echo ssh_config=absent; fi;
              echo ssh_config_metadata_end;
            '
