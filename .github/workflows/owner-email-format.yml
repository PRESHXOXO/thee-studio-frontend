name: Temporary Owner Login End-to-End Check

on:
  push:
    branches:
      - ops/owner-login-diagnose-20260906
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Probe recovery and admin route existence without credentials
        shell: bash
        run: |
          set -euo pipefail
          base='https://studio.myvitaworld.online/api'
          ua='Mozilla/5.0 Chrome/152.0.0.0 Safari/537.36'
          for spec in \
            'GET /openapi.json' \
            'GET /docs' \
            'GET /documentation/json' \
            'GET /swagger/json' \
            'GET /swagger' \
            'GET /routes' \
            'POST /auth/forgot-password' \
            'POST /auth/forgot' \
            'POST /auth/password-reset' \
            'POST /auth/reset-password' \
            'POST /auth/request-password-reset' \
            'POST /auth/change-password' \
            'POST /auth/password' \
            'POST /auth/bootstrap-owner' \
            'POST /auth/owner' \
            'GET /admin/users' \
            'POST /admin/users/reset-password' \
            'POST /admin/owner' \
            'GET /internal/users' \
            'POST /internal/bootstrap' \
            'POST /maintenance/bootstrap-owner'; do
            method=${spec%% *}; path=${spec#* }
            body=$(mktemp)
            if [ "$method" = POST ]; then
              code=$(curl -sS --compressed -A "$ua" -H 'Content-Type: application/json' -X POST --data '{}' -o "$body" -w '%{http_code}' "$base$path" || true)
            else
              code=$(curl -sS --compressed -A "$ua" -o "$body" -w '%{http_code}' "$base$path" || true)
            fi
            printf 'method=%s path=%s status=%s body=' "$method" "$path" "$code"
            head -c 260 "$body" | tr '\n' ' ' | sed -E 's/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}/[EMAIL]/g; s/(token|secret|password|authorization)(["=: ]+)[^," }]+/\1\2[REDACTED]/Ig' || true
            echo
            rm -f "$body"
          done
