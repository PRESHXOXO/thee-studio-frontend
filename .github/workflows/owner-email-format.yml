name: Temporary Owner Login End-to-End Check

on:
  push:
    branches:
      - ops/owner-login-diagnose-20260906
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Discover creator cleanup route with fake ID and no credentials
        shell: bash
        run: |
          set -euo pipefail
          base='https://studio.myvitaworld.online/api'
          ua='Mozilla/5.0 Chrome/152.0.0.0 Safari/537.36'
          fake='00000000-0000-4000-8000-000000000000'
          for spec in \
            "DELETE /creators/$fake" \
            "POST /creators/$fake/delete" \
            "DELETE /creator/$fake" \
            "POST /creator/$fake/delete" \
            "POST /creators/$fake/archive" \
            "PATCH /creators/$fake"; do
            method=${spec%% *}; path=${spec#* }
            body=$(mktemp)
            case "$method" in
              POST|PATCH) code=$(curl -sS --compressed -A "$ua" -H 'Content-Type: application/json' -X "$method" --data '{}' -o "$body" -w '%{http_code}' "$base$path" || true) ;;
              *) code=$(curl -sS --compressed -A "$ua" -X "$method" -o "$body" -w '%{http_code}' "$base$path" || true) ;;
            esac
            printf 'method=%s path_shape=%s status=%s body=' "$method" "$path" "$code"
            head -c 220 "$body" | tr '\n' ' ' | sed -E 's/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}/[EMAIL]/g'
            echo
            rm -f "$body"
          done
