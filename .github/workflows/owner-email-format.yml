name: Temporary Owner Login End-to-End Check

on:
  push:
    branches:
      - ops/owner-login-diagnose-20260906
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      CPANEL_SSH_HOST: ${{ secrets.CPANEL_SSH_HOST }}
      CPANEL_SSH_PORT: ${{ secrets.CPANEL_SSH_PORT }}
      CPANEL_SSH_USER: ${{ secrets.CPANEL_SSH_USER }}
    steps:
      - name: Configure SSH
        env:
          CPANEL_SSH_PRIVATE_KEY: ${{ secrets.CPANEL_SSH_PRIVATE_KEY }}
          CPANEL_SSH_KNOWN_HOSTS: ${{ secrets.CPANEL_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$CPANEL_SSH_PRIVATE_KEY" > ~/.ssh/cpanel_deploy
          printf '%s\n' "$CPANEL_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/cpanel_deploy ~/.ssh/known_hosts

      - name: Inspect running API configuration names only
        shell: bash
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/cpanel_deploy -p "$CPANEL_SSH_PORT" "$CPANEL_SSH_USER@$CPANEL_SSH_HOST" 'bash -s' <<'REMOTE'
          set -eu
          pid=$(systemctl show thee-studio-api.service -p MainPID --value 2>/dev/null || true)
          echo "main_pid_present=$([ -n "$pid" ] && [ "$pid" != 0 ] && echo true || echo false)"
          echo 'runtime_paths_begin'
          if [ -n "$pid" ] && [ "$pid" != 0 ]; then
            cwd=$(readlink "/proc/$pid/cwd" 2>/dev/null || true)
            exe=$(readlink "/proc/$pid/exe" 2>/dev/null || true)
            [ -n "$cwd" ] && printf 'cwd=%s\n' "$cwd"
            [ -n "$exe" ] && printf 'exe=%s\n' "$exe"
          fi
          echo 'runtime_paths_end'

          echo 'runtime_env_names_begin'
          if [ -n "$pid" ] && [ "$pid" != 0 ] && [ -r "/proc/$pid/environ" ]; then
            tr '\0' '\n' < "/proc/$pid/environ" | sed -nE 's/^([A-Za-z_][A-Za-z0-9_]*)=.*/\1/p' | grep -Ei 'OWNER|ADMIN|ROLE|BOOTSTRAP|AUTH|SESSION|DATABASE|DB|MYSQL|MARIA' | sort -u || true
            echo 'runtime_env_readable=true'
          else
            echo 'runtime_env_readable=false'
          fi
          echo 'runtime_env_names_end'

          echo 'protected_env_file_readable_begin'
          if [ -r /etc/thee-studio/thee-studio.env ]; then
            echo 'protected_env_file_readable=true'
            sed -nE 's/^[[:space:]]*(export[[:space:]]+)?([A-Za-z_][A-Za-z0-9_]*)=.*/\2/p' /etc/thee-studio/thee-studio.env | grep -Ei 'OWNER|ADMIN|ROLE|BOOTSTRAP|AUTH|SESSION|DATABASE|DB|MYSQL|MARIA' | sort -u || true
          else
            echo 'protected_env_file_readable=false'
          fi
          echo 'protected_env_file_readable_end'
          REMOTE
