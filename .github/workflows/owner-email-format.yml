name: Temporary Owner Login End-to-End Check

on:
  push:
    branches:
      - ops/owner-login-diagnose-20260906
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    environment: production
    env:
      CPANEL_SSH_HOST: ${{ secrets.CPANEL_SSH_HOST }}
      CPANEL_SSH_PORT: ${{ secrets.CPANEL_SSH_PORT }}
      CPANEL_SSH_USER: ${{ secrets.CPANEL_SSH_USER }}
    steps:
      - name: Configure SSH
        env:
          CPANEL_SSH_PRIVATE_KEY: ${{ secrets.CPANEL_SSH_PRIVATE_KEY }}
          CPANEL_SSH_KNOWN_HOSTS: ${{ secrets.CPANEL_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$CPANEL_SSH_PRIVATE_KEY" > ~/.ssh/cpanel_deploy
          printf '%s\n' "$CPANEL_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/cpanel_deploy ~/.ssh/known_hosts

      - name: Inspect live auth implementation without exposing env values
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/cpanel_deploy -p "$CPANEL_SSH_PORT" "$CPANEL_SSH_USER@$CPANEL_SSH_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          app=/opt/thee-studio-app
          echo "app_dir_exists=$([ -d "$app" ] && echo yes || echo no)"
          ls -ld "$app" "$app/src" 2>/dev/null || true
          echo 'package_meta_begin'
          if [ -r "$app/package.json" ]; then
            node - "$app/package.json" <<'NODE'
          const fs=require('fs'); const p=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          console.log(`name=${p.name||''}`); console.log(`type=${p.type||''}`); console.log(`scripts=${Object.keys(p.scripts||{}).join(',')}`); console.log(`deps=${Object.keys(p.dependencies||{}).filter(x=>/fastify|argon|bcrypt|postgres|pg|sqlite|mysql|prisma|drizzle|knex/.test(x)).join(',')}`);
          NODE
          fi
          echo 'package_meta_end'
          echo 'auth_code_hits_begin'
          for f in "$app/src/server.js" "$app/src"/*.js "$app/src"/**/*.js; do
            [ -r "$f" ] || continue
            grep -nE "Invalid email or password|/auth/login|auth/login|password_hash|passwordHash|bcrypt|argon2|users\b|SELECT .*user|FROM users|UPDATE users" "$f" 2>/dev/null | head -120 | sed -E 's/(password|secret|token)(["'"'=: ]+)[^,; )}]+/\1\2[REDACTED]/Ig' || true
          done
          echo 'auth_code_hits_end'
          echo 'env_key_names_begin'
          if [ -r "$app/.env" ]; then
            sed -nE 's/^([A-Za-z_][A-Za-z0-9_]*)=.*/\1/p' "$app/.env" | sort | grep -E 'DB|DATABASE|POSTGRES|MYSQL|SQLITE|AUTH|SESSION|OWNER|ADMIN|USER' || true
          fi
          echo 'env_key_names_end'
          echo 'data_candidates_begin'
          find "$app" -maxdepth 3 -type f \( -name '*.db' -o -name '*.sqlite' -o -name '*.sqlite3' -o -name 'schema.prisma' -o -name '*migration*' \) -not -path '*/node_modules/*' -print 2>/dev/null | head -100 || true
          echo 'data_candidates_end'
          REMOTE
