name: Temporary Owner Login End-to-End Check

on:
  push:
    branches:
      - ops/owner-login-diagnose-20260906
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    environment: production
    env:
      CPANEL_SSH_HOST: ${{ secrets.CPANEL_SSH_HOST }}
      CPANEL_SSH_PORT: ${{ secrets.CPANEL_SSH_PORT }}
      CPANEL_SSH_USER: ${{ secrets.CPANEL_SSH_USER }}
    steps:
      - name: Configure SSH
        env:
          CPANEL_SSH_PRIVATE_KEY: ${{ secrets.CPANEL_SSH_PRIVATE_KEY }}
          CPANEL_SSH_KNOWN_HOSTS: ${{ secrets.CPANEL_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$CPANEL_SSH_PRIVATE_KEY" > ~/.ssh/cpanel_deploy
          printf '%s\n' "$CPANEL_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/cpanel_deploy ~/.ssh/known_hosts

      - name: Probe only Thee Studio scoped DB access metadata
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/cpanel_deploy -p "$CPANEL_SSH_PORT" "$CPANEL_SSH_USER@$CPANEL_SSH_HOST" 'bash -s' <<'REMOTE'
          set -eu
          echo 'service_env_names_begin'
          raw=$(systemctl show thee-studio-api.service -p Environment --value 2>/dev/null || true)
          if [ -n "$raw" ]; then
            printf '%s\n' "$raw" | tr ' ' '\n' | sed -nE 's/^([A-Za-z_][A-Za-z0-9_]*)=.*/\1=PRESENT/p' | grep -Ei 'DB|DATABASE|MYSQL|MARIA|AUTH|SESSION|OWNER|ADMIN' | sort -u || true
            echo 'service_environment_property=readable'
          else
            echo 'service_environment_property=empty_or_hidden'
          fi
          echo 'service_env_names_end'

          echo 'service_env_files_begin'
          systemctl show thee-studio-api.service -p EnvironmentFiles --value 2>/dev/null | sed -E 's/;.*//g' || true
          echo 'service_env_files_end'

          echo 'target_db_socket_auth_begin'
          if mariadb --batch --skip-column-names --database=thee_studio_prod -e 'SELECT DATABASE(), CURRENT_USER()' >/tmp/thee-db-check.$$ 2>/dev/null; then
            echo 'target_db_socket_auth=success'
            awk -F'\t' '{print "selected_database=" $1; print "db_principal=" $2}' /tmp/thee-db-check.$$
          else
            echo 'target_db_socket_auth=denied'
          fi
          rm -f /tmp/thee-db-check.$$
          echo 'target_db_socket_auth_end'
          REMOTE
