name: Temporary Owner Login End-to-End Check

on:
  push:
    branches:
      - ops/owner-login-diagnose-20260906
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    environment: production
    env:
      CUTOVER_OWNER_EMAIL: ${{ secrets.CUTOVER_OWNER_EMAIL }}
      CUTOVER_OWNER_PASSWORD: ${{ secrets.CUTOVER_OWNER_PASSWORD }}
      CUTOVER_USER_EMAIL: ${{ secrets.CUTOVER_USER_EMAIL }}
      CUTOVER_USER_PASSWORD: ${{ secrets.CUTOVER_USER_PASSWORD }}
    steps:
      - name: Compare owner and normal-user login against production
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          function clean(v){return String(v||'').normalize('NFKC').replace(/[\u200B-\u200D\u2060\uFEFF]/g,'').trim().toLowerCase()}
          const pairs={
            owner:{email:clean(process.env.CUTOVER_OWNER_EMAIL),password:process.env.CUTOVER_OWNER_PASSWORD||''},
            user:{email:clean(process.env.CUTOVER_USER_EMAIL),password:process.env.CUTOVER_USER_PASSWORD||''},
          };
          for(const [name,p] of Object.entries(pairs)){
            if(!p.email||!p.password) process.exit(2);
            fs.writeFileSync(`/tmp/${name}.json`,JSON.stringify(p),{mode:0o600});
          }
          NODE
          trap 'rm -f /tmp/owner.json /tmp/user.json' EXIT
          base='https://studio.myvitaworld.online/api/auth/login'
          ua='Mozilla/5.0 Chrome/152.0.0.0 Safari/537.36'
          for who in owner user; do
            body=$(mktemp)
            jar=$(mktemp)
            code=$(curl -sS --compressed -A "$ua" -c "$jar" -b "$jar" -H 'Content-Type: application/json' -X POST --data-binary @/tmp/$who.json -o "$body" -w '%{http_code}' "$base")
            printf '%s_login_status=%s\n' "$who" "$code"
            if [ "$code" = 200 ]; then
              me=$(mktemp)
              me_code=$(curl -sS --compressed -A "$ua" -c "$jar" -b "$jar" -o "$me" -w '%{http_code}' https://studio.myvitaworld.online/api/auth/me)
              printf '%s_me_status=%s\n' "$who" "$me_code"
              node - "$me" "$who" <<'NODE'
              const fs=require('fs'); const p=JSON.parse(fs.readFileSync(process.argv[2],'utf8')); const who=process.argv[3]; const u=p.user||p;
              const role=String(u?.appMetadata?.role||u?.app_metadata?.role||u?.role||'').toLowerCase();
              console.log(`${who}_session_user_present=${Boolean(u?.id)}`);
              console.log(`${who}_session_role=${role||'none'}`);
              NODE
              rm -f "$me"
            else
              node - "$body" "$who" <<'NODE'
              const fs=require('fs'); let p={}; try{p=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));}catch{}; console.log(`${process.argv[3]}_login_error=${p.error||p.message||'unknown'}`)
              NODE
            fi
            rm -f "$body" "$jar"
          done
