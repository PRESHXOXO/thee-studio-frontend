name: Temporary Owner Login End-to-End Check

on:
  push:
    branches:
      - ops/owner-login-diagnose-20260906
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    environment: production
    env:
      CPANEL_SSH_HOST: ${{ secrets.CPANEL_SSH_HOST }}
      CPANEL_SSH_PORT: ${{ secrets.CPANEL_SSH_PORT }}
      CPANEL_SSH_USER: ${{ secrets.CPANEL_SSH_USER }}
    steps:
      - name: Configure SSH
        env:
          CPANEL_SSH_PRIVATE_KEY: ${{ secrets.CPANEL_SSH_PRIVATE_KEY }}
          CPANEL_SSH_KNOWN_HOSTS: ${{ secrets.CPANEL_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$CPANEL_SSH_PRIVATE_KEY" > ~/.ssh/cpanel_deploy
          printf '%s\n' "$CPANEL_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/cpanel_deploy ~/.ssh/known_hosts

      - name: List only readable operator handoff paths and commands
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/cpanel_deploy -p "$CPANEL_SSH_PORT" "$CPANEL_SSH_USER@$CPANEL_SSH_HOST" 'bash -s' <<'REMOTE'
          set -eu
          echo 'identity_begin'
          id
          echo 'identity_end'
          echo 'group_thee_studio_begin'
          getent group thee-studio 2>/dev/null || true
          echo 'group_thee_studio_end'
          echo 'operator_commands_begin'
          for cmd in thee-studio-operator thee-studio-app-operator thee-studio-migrator thee-studio-db mysql mariadb; do
            p=$(command -v "$cmd" 2>/dev/null || true)
            [ -n "$p" ] && printf '%s=%s\n' "$cmd" "$p"
          done
          echo 'operator_commands_end'
          echo 'candidate_paths_begin'
          for root in /etc/thee-studio /etc /usr/local/bin /usr/local/sbin /opt /var/lib/thee-studio "$HOME"; do
            [ -d "$root" ] || continue
            find "$root" -maxdepth 4 -type f \( -iname '*thee*operator*' -o -iname '*thee*migrator*' -o -iname '*operator*.cnf' -o -iname '*migrator*.cnf' -o -iname '*thee*db*' -o -iname '*thee*.cnf' -o -iname '*thee*.env' \) -readable -printf '%p mode=%m owner=%u group=%g\n' 2>/dev/null | head -150 || true
          done
          echo 'candidate_paths_end'
          echo 'socket_paths_begin'
          find /run /var/run /var/lib/thee-studio -maxdepth 4 \( -type s -o -type p \) -readable -printf '%p mode=%m owner=%u group=%g\n' 2>/dev/null | grep -Ei 'thee|studio|maria|mysql|operator' | head -100 || true
          echo 'socket_paths_end'
          REMOTE
