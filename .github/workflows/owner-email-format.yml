name: Temporary Owner Login End-to-End Check

on:
  push:
    branches:
      - ops/owner-login-diagnose-20260906
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Trace live compat tables and usage adapter read-only
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const origin='https://studio.myvitaworld.online';
          const h=await (await fetch(origin+'/',{headers:{'user-agent':'Mozilla/5.0 Chrome/152.0.0.0 Safari/537.36'}})).text();
          const scripts=[...h.matchAll(/<script[^>]+src=["']([^"']+)["']/gi)].map(m=>new URL(m[1],origin).href);
          const clean=s=>String(s||'').replace(/\s+/g,' ').replace(/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}/g,'[EMAIL]');
          for(const url of scripts){
            const r=await fetch(url,{headers:{'user-agent':'Mozilla/5.0 Chrome/152.0.0.0 Safari/537.36'}}); if(!r.ok) continue;
            const text=await r.text();

            const froms=new Set();
            for(const m of text.matchAll(/\.from\(\s*(["'`])([^"'`]{1,100})\1\s*\)/g)) froms.add(m[2]);
            console.log('from_literal_count='+froms.size);
            for(const x of [...froms].sort()) console.log('from_literal='+x);

            for(const term of ['function e_','e_=','=>e_(','function Hl','Hl=','const Hl','/compat/${t}','usage:{','included','remaining','billing_plans','subscriptions','usage_ledger','generation_usage','credit_ledger','credit_balance']){
              let idx=text.indexOf(term), n=0;
              while(idx>=0 && n<4){
                const chunk=clean(text.slice(Math.max(0,idx-1600),Math.min(text.length,idx+2600)));
                console.log(`context_${term.replace(/[^a-z0-9]+/gi,'_')}_${n}=${chunk}`);
                idx=text.indexOf(term,idx+term.length); n++;
              }
              console.log(`term_${term.replace(/[^a-z0-9]+/gi,'_')}_matches=${n}`);
            }

            // Capture adapter branches that compare table/resource names.
            const adapterNames=new Set();
            for(const m of text.matchAll(/(?:===|==)\s*(["'])([A-Za-z0-9_-]{2,80})\1/g)){
              const v=m[2];
              if(/(access|usage|credit|billing|subscription|plan|generation|creator|library|profile|user|feature)/i.test(v)) adapterNames.add(v);
            }
            console.log('interesting_comparison_literals='+[...adapterNames].sort().join(','));
          }
          NODE
