name: Temporary Owner Login End-to-End Check

on:
  push:
    branches:
      - ops/owner-login-diagnose-20260906
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    environment: production
    env:
      CPANEL_SSH_HOST: ${{ secrets.CPANEL_SSH_HOST }}
      CPANEL_SSH_PORT: ${{ secrets.CPANEL_SSH_PORT }}
      CPANEL_SSH_USER: ${{ secrets.CPANEL_SSH_USER }}
      CPANEL_DEPLOY_PATH: ${{ secrets.CPANEL_DEPLOY_PATH }}
    steps:
      - name: Configure SSH
        env:
          CPANEL_SSH_PRIVATE_KEY: ${{ secrets.CPANEL_SSH_PRIVATE_KEY }}
          CPANEL_SSH_KNOWN_HOSTS: ${{ secrets.CPANEL_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$CPANEL_SSH_PRIVATE_KEY" > ~/.ssh/cpanel_deploy
          printf '%s\n' "$CPANEL_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/cpanel_deploy ~/.ssh/known_hosts

      - name: Locate replacement API process and source without reading secrets
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/cpanel_deploy -p "$CPANEL_SSH_PORT" "$CPANEL_SSH_USER@$CPANEL_SSH_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          echo "remote_user=$(id -un)"
          echo "remote_home=$HOME"
          echo "frontend_path_present=$([ -d "${CPANEL_DEPLOY_PATH:-/nonexistent}" ] && echo yes || echo unknown)"
          echo 'node_processes_begin'
          ps -eo pid=,comm=,args= | grep -E '[n]ode|[p]m2|[f]astify' | sed -E 's/(--password|--token|--secret|DATABASE_URL|SESSION_SECRET)=[^ ]+/\1=[REDACTED]/Ig' | head -50 || true
          echo 'node_processes_end'
          echo 'listening_ports_begin'
          (ss -ltnp 2>/dev/null || netstat -ltnp 2>/dev/null || true) | grep -E ':(3000|3001|4000|5000|8000|8080|8787|9000|9100|9200)\b' | head -50 || true
          echo 'listening_ports_end'
          echo 'auth_source_hits_begin'
          for root in "$HOME" /var/www /opt /srv; do
            [ -d "$root" ] || continue
            grep -RIl --exclude-dir=node_modules --exclude-dir=.git --exclude='.env*' --exclude='*.log' 'Invalid email or password' "$root" 2>/dev/null | head -30 || true
          done
          echo 'auth_source_hits_end'
          echo 'package_candidates_begin'
          for root in "$HOME" /var/www /opt /srv; do
            [ -d "$root" ] || continue
            find "$root" -maxdepth 4 -type f \( -name package.json -o -name ecosystem.config.js -o -name ecosystem.config.cjs -o -name server.js -o -name app.js \) -not -path '*/node_modules/*' 2>/dev/null | head -80 || true
          done
          echo 'package_candidates_end'
          REMOTE
