name: Temporary Owner Login End-to-End Check

on:
  push:
    branches:
      - ops/owner-login-diagnose-20260906
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      CUTOVER_OWNER_EMAIL: ${{ secrets.CUTOVER_OWNER_EMAIL }}
      CUTOVER_OWNER_PASSWORD: ${{ secrets.CUTOVER_OWNER_PASSWORD }}
    steps:
      - name: Inspect compat credit resources read-only
        shell: bash
        run: |
          set -euo pipefail
          node -e "const fs=require('fs');const email=String(process.env.CUTOVER_OWNER_EMAIL||'').normalize('NFKC').replace(/[\\u200B-\\u200D\\u2060\\uFEFF]/g,'').trim().toLowerCase();const password=process.env.CUTOVER_OWNER_PASSWORD||'';if(!email||!password)process.exit(2);fs.writeFileSync('/tmp/login.json',JSON.stringify({email,password}),{mode:0o600});"
          trap 'rm -f /tmp/login.json /tmp/jar /tmp/body' EXIT
          ua='Mozilla/5.0 Chrome/152.0.0.0 Safari/537.36'
          base='https://studio.myvitaworld.online/api'

          login_code=$(curl -sS --compressed -A "$ua" -c /tmp/jar -b /tmp/jar -H 'Content-Type: application/json' -X POST --data-binary @/tmp/login.json -o /dev/null -w '%{http_code}' "$base/auth/login")
          echo "owner_login_status=$login_code"
          test "$login_code" = 200

          cat > /tmp/resources <<'EOF'
          user_usage_monthly
          billing_plans
          billing_plan_versions
          creators
          creator_identity_profiles
          creator_memory_profiles
          creator_reference_assets
          generation_projects
          generation_shots
          still_generations
          still_generation_assets
          provider_runs
          generation_run_events
          studio_documents
          studio_error_events
          EOF

          while read -r resource; do
            : > /tmp/body
            code=$(curl -sS --compressed -A "$ua" -c /tmp/jar -b /tmp/jar -o /tmp/body -w '%{http_code}' "$base/compat/$resource" || true)
            RESOURCE="$resource" STATUS="$code" node <<'NODE'
          const fs=require('fs');
          const resource=process.env.RESOURCE,status=process.env.STATUS;
          let raw='';try{raw=fs.readFileSync('/tmp/body','utf8')}catch{}
          let p=null;try{p=JSON.parse(raw)}catch{}
          console.log(`compat_resource=${resource} status=${status}`);
          if(p&&typeof p==='object'){
            const rows=Array.isArray(p)?p:(Array.isArray(p.rows)?p.rows:(Array.isArray(p.data)?p.data:[]));
            console.log(`compat_rows=${rows.length}`);
            if(rows.length){
              console.log(`compat_row_keys=${Object.keys(rows[0]||{}).filter(k=>!/(email|token|secret|password|cookie|authorization)/i.test(k)).sort().join(',')}`);
              if(resource==='user_usage_monthly'){
                const safe=rows.map(x=>({period_start:x.period_start??null,included_credits:x.included_credits??null,used_credits:x.used_credits??null,remaining_credits:x.remaining_credits??null}));
                console.log('usage_rows='+JSON.stringify(safe).slice(0,1000));
              }
              if(resource==='billing_plans'){
                const safe=rows.map(x=>({plan_key:x.plan_key??null,display_name:x.display_name??null,active:x.active??null,customer_visible:x.customer_visible??null,internal_only:x.internal_only??null,checkout_enabled:x.checkout_enabled??null}));
                console.log('plan_rows='+JSON.stringify(safe).slice(0,1200));
              }
              if(resource==='billing_plan_versions'){
                const safe=rows.map(x=>({version:x.version??null,included_credits:x.included_credits??null,price_minor:x.price_minor??null,currency:x.currency??null,billing_interval:x.billing_interval??null}));
                console.log('plan_version_rows='+JSON.stringify(safe).slice(0,1200));
              }
            } else {
              const keys=Object.keys(p).filter(k=>!/(email|token|secret|password|cookie|authorization)/i.test(k)).sort();
              if(keys.length) console.log('compat_top_keys='+keys.join(','));
            }
          } else if(raw) {
            console.log('compat_body_preview='+raw.slice(0,180).replace(/\s+/g,' '));
          }
          NODE
          done < /tmp/resources
