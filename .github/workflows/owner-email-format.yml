name: Temporary Owner Login End-to-End Check

on:
  push:
    branches:
      - ops/owner-login-diagnose-20260906
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    environment: production
    env:
      CUTOVER_OWNER_EMAIL: ${{ secrets.CUTOVER_OWNER_EMAIL }}
    steps:
      - name: Send reset instructions to the configured owner email
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const email=(process.env.CUTOVER_OWNER_EMAIL||'').normalize('NFKC').replace(/[\u200B-\u200D\u2060\uFEFF]/g,'').trim().toLowerCase();
          if (!email) process.exit(2);
          fs.writeFileSync('/tmp/reset-request.json', JSON.stringify({email}), {mode:0o600});
          NODE
          body=$(mktemp)
          trap 'rm -f "$body" /tmp/reset-request.json' EXIT
          code=$(curl -sS --compressed -A 'Mozilla/5.0 Chrome/152.0.0.0 Safari/537.36' \
            -H 'Content-Type: application/json' -X POST --data-binary @/tmp/reset-request.json \
            -o "$body" -w '%{http_code}' \
            https://studio.myvitaworld.online/api/auth/forgot-password)
          echo "reset_request_status=$code"
          test "$code" = 200
          node - "$body" <<'NODE'
          const fs=require('fs');
          let p={}; try {p=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));} catch {}
          console.log(`reset_request_ok=${p.ok===true}`);
          if (p.ok!==true) process.exit(3);
          NODE
