name: Temporary Owner Login End-to-End Check

on:
  push:
    branches:
      - ops/owner-login-diagnose-20260906
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    environment: production
    env:
      THEE_STUDIO_SSH_HOST: ${{ secrets.THEE_STUDIO_SSH_HOST }}
      THEE_STUDIO_SSH_PORT: ${{ secrets.THEE_STUDIO_SSH_PORT }}
      THEE_STUDIO_SSH_USER: ${{ secrets.THEE_STUDIO_SSH_USER }}
      THEE_STUDIO_SSH_PRIVATE_KEY: ${{ secrets.THEE_STUDIO_SSH_PRIVATE_KEY }}
      THEE_STUDIO_SSH_KNOWN_HOSTS: ${{ secrets.THEE_STUDIO_SSH_KNOWN_HOSTS }}
      VPS_SSH_HOST: ${{ secrets.VPS_SSH_HOST }}
      VPS_SSH_PORT: ${{ secrets.VPS_SSH_PORT }}
      VPS_SSH_USER: ${{ secrets.VPS_SSH_USER }}
      VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
      APP_SSH_HOST: ${{ secrets.APP_SSH_HOST }}
      APP_SSH_USER: ${{ secrets.APP_SSH_USER }}
      APP_SSH_PRIVATE_KEY: ${{ secrets.APP_SSH_PRIVATE_KEY }}
      OPERATOR_SSH_HOST: ${{ secrets.OPERATOR_SSH_HOST }}
      OPERATOR_SSH_USER: ${{ secrets.OPERATOR_SSH_USER }}
      OPERATOR_SSH_PRIVATE_KEY: ${{ secrets.OPERATOR_SSH_PRIVATE_KEY }}
      THEE_STUDIO_DB_HOST: ${{ secrets.THEE_STUDIO_DB_HOST }}
      THEE_STUDIO_DB_PORT: ${{ secrets.THEE_STUDIO_DB_PORT }}
      THEE_STUDIO_DB_NAME: ${{ secrets.THEE_STUDIO_DB_NAME }}
      THEE_STUDIO_DB_USER: ${{ secrets.THEE_STUDIO_DB_USER }}
      THEE_STUDIO_DB_PASSWORD: ${{ secrets.THEE_STUDIO_DB_PASSWORD }}
      DB_MIGRATOR_HOST: ${{ secrets.DB_MIGRATOR_HOST }}
      DB_MIGRATOR_PORT: ${{ secrets.DB_MIGRATOR_PORT }}
      DB_MIGRATOR_NAME: ${{ secrets.DB_MIGRATOR_NAME }}
      DB_MIGRATOR_USER: ${{ secrets.DB_MIGRATOR_USER }}
      DB_MIGRATOR_PASSWORD: ${{ secrets.DB_MIGRATOR_PASSWORD }}
      MIGRATOR_DB_HOST: ${{ secrets.MIGRATOR_DB_HOST }}
      MIGRATOR_DB_USER: ${{ secrets.MIGRATOR_DB_USER }}
      MIGRATOR_DB_PASSWORD: ${{ secrets.MIGRATOR_DB_PASSWORD }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      THEE_STUDIO_DATABASE_URL: ${{ secrets.THEE_STUDIO_DATABASE_URL }}
    steps:
      - name: Report credential presence only
        shell: bash
        run: |
          node <<'NODE'
          const names = [
            'THEE_STUDIO_SSH_HOST','THEE_STUDIO_SSH_PORT','THEE_STUDIO_SSH_USER','THEE_STUDIO_SSH_PRIVATE_KEY','THEE_STUDIO_SSH_KNOWN_HOSTS',
            'VPS_SSH_HOST','VPS_SSH_PORT','VPS_SSH_USER','VPS_SSH_PRIVATE_KEY',
            'APP_SSH_HOST','APP_SSH_USER','APP_SSH_PRIVATE_KEY',
            'OPERATOR_SSH_HOST','OPERATOR_SSH_USER','OPERATOR_SSH_PRIVATE_KEY',
            'THEE_STUDIO_DB_HOST','THEE_STUDIO_DB_PORT','THEE_STUDIO_DB_NAME','THEE_STUDIO_DB_USER','THEE_STUDIO_DB_PASSWORD',
            'DB_MIGRATOR_HOST','DB_MIGRATOR_PORT','DB_MIGRATOR_NAME','DB_MIGRATOR_USER','DB_MIGRATOR_PASSWORD',
            'MIGRATOR_DB_HOST','MIGRATOR_DB_USER','MIGRATOR_DB_PASSWORD',
            'DATABASE_URL','THEE_STUDIO_DATABASE_URL'
          ];
          for (const name of names) console.log(`${name}_present=${Boolean(process.env[name])}`);
          NODE
