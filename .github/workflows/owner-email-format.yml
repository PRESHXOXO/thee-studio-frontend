name: Temporary Owner Login End-to-End Check

on:
  push:
    branches:
      - ops/owner-login-diagnose-20260906
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      CPANEL_SSH_HOST: ${{ secrets.CPANEL_SSH_HOST }}
      CPANEL_SSH_PORT: ${{ secrets.CPANEL_SSH_PORT }}
      CPANEL_SSH_USER: ${{ secrets.CPANEL_SSH_USER }}
    steps:
      - name: Configure SSH
        env:
          CPANEL_SSH_PRIVATE_KEY: ${{ secrets.CPANEL_SSH_PRIVATE_KEY }}
          CPANEL_SSH_KNOWN_HOSTS: ${{ secrets.CPANEL_SSH_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$CPANEL_SSH_PRIVATE_KEY" > ~/.ssh/cpanel_deploy
          printf '%s\n' "$CPANEL_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/cpanel_deploy ~/.ssh/known_hosts

      - name: Inspect API service metadata and sanitized credit logs
        shell: bash
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/cpanel_deploy -p "$CPANEL_SSH_PORT" "$CPANEL_SSH_USER@$CPANEL_SSH_HOST" 'bash -s' <<'REMOTE'
          set -u
          echo 'service_metadata_begin'
          systemctl show thee-studio-api.service \
            -p User -p Group -p WorkingDirectory -p ExecStart -p EnvironmentFiles -p FragmentPath \
            --no-pager 2>/dev/null || true
          echo 'service_metadata_end'

          echo 'source_path_permissions_begin'
          namei -l /opt/thee-studio-app/src/server.js 2>/dev/null || true
          echo 'source_path_permissions_end'

          sanitize() {
            sed -E \
              -e 's/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}/[EMAIL]/g' \
              -e 's/[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}/[UUID]/g' \
              -e 's/("?(authorization|cookie|token|secret|password)"?[=: ]+)[^, }]+/\1[REDACTED]/Ig' \
              -e 's/("prompt"[[:space:]]*:[[:space:]]*")[^"]*(")/\1[REDACTED]\2/Ig'
          }

          echo 'journal_access_begin'
          if journalctl -u thee-studio-api.service --since '2026-09-06 00:00:00' --no-pager -o cat >/tmp/thee-journal.$$ 2>/tmp/thee-journal-err.$$; then
            echo 'journal_readable=true'
            grep -Ei 'credit|usage|billing|generation|402|insufficient|entitl|owner|plan' /tmp/thee-journal.$$ | tail -n 250 | sanitize || true
          else
            echo 'journal_readable=false'
            head -n 5 /tmp/thee-journal-err.$$ | sanitize || true
          fi
          rm -f /tmp/thee-journal.$$ /tmp/thee-journal-err.$$
          echo 'journal_access_end'

          echo 'status_excerpt_begin'
          systemctl status thee-studio-api.service --no-pager -n 80 2>&1 | \
            grep -Ei 'Active:|Loaded:|Main PID:|credit|usage|billing|generation|402|insufficient|entitl|owner|plan' | sanitize || true
          echo 'status_excerpt_end'
          REMOTE
