name: Temporary Owner Login End-to-End Check

on:
  push:
    branches:
      - ops/owner-login-diagnose-20260906
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      CUTOVER_OWNER_EMAIL: ${{ secrets.CUTOVER_OWNER_EMAIL }}
      CUTOVER_OWNER_PASSWORD: ${{ secrets.CUTOVER_OWNER_PASSWORD }}
    steps:
      - name: Map authenticated entitlement surface read-only
        shell: bash
        run: |
          set -euo pipefail
          node -e "const fs=require('fs');const email=String(process.env.CUTOVER_OWNER_EMAIL||'').normalize('NFKC').replace(/[\\u200B-\\u200D\\u2060\\uFEFF]/g,'').trim().toLowerCase();const password=process.env.CUTOVER_OWNER_PASSWORD||'';if(!email||!password)process.exit(2);fs.writeFileSync('/tmp/login.json',JSON.stringify({email,password}),{mode:0o600});"
          trap 'rm -f /tmp/login.json /tmp/jar /tmp/body' EXIT
          ua='Mozilla/5.0 Chrome/152.0.0.0 Safari/537.36'
          base='https://studio.myvitaworld.online/api'

          login_code=$(curl -sS --compressed -A "$ua" -c /tmp/jar -b /tmp/jar -H 'Content-Type: application/json' -X POST --data-binary @/tmp/login.json -o /dev/null -w '%{http_code}' "$base/auth/login")
          echo "owner_login_status=$login_code"
          test "$login_code" = 200

          cat > /tmp/routes <<'EOF'
          /auth/me
          /account
          /account/access
          /account/credits
          /account/plan
          /account/subscription
          /account/entitlements
          /credits
          /credits/balance
          /usage
          /billing
          /billing/status
          /subscription
          /plan
          /plans
          /access
          /entitlements
          /entitlement
          /profile
          /me
          /user
          /users/me
          EOF

          while read -r path; do
            : > /tmp/body
            code=$(curl -sS --compressed -A "$ua" -c /tmp/jar -b /tmp/jar -o /tmp/body -w '%{http_code}' "$base$path" || true)
            if [ "$code" != 404 ]; then
              PATH_VALUE="$path" STATUS_VALUE="$code" node <<'NODE'
          const fs = require('fs');
          const path = process.env.PATH_VALUE;
          const status = process.env.STATUS_VALUE;
          let raw = '';
          try { raw = fs.readFileSync('/tmp/body','utf8'); } catch {}
          let p = null;
          try { p = JSON.parse(raw); } catch {}
          const redact = s => String(s || '')
            .replace(/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}/g,'[EMAIL]')
            .replace(/(["']?(?:token|secret|password|authorization|cookie)["']?\s*[:=]\s*["']?)[^,"' }\s]+/ig,'$1[REDACTED]');
          console.log(`route=${path} status=${status}`);
          if (p && typeof p === 'object') {
            console.log(`top_keys=${Object.keys(p).sort().join(',')}`);
            const interesting = {};
            const walk = (obj, prefix='', depth=0) => {
              if (!obj || typeof obj !== 'object' || depth > 2) return;
              for (const [k,v] of Object.entries(obj)) {
                const key = String(k).toLowerCase();
                const full = prefix ? `${prefix}.${k}` : k;
                if (/(credit|balance|plan|tier|entitle|access|billing|subscription|role|owner|admin|limit|usage|remaining|unlimited|exempt)/i.test(key)) {
                  if (['string','number','boolean'].includes(typeof v) || v === null) interesting[full] = v;
                  else if (Array.isArray(v)) interesting[full] = `[array:${v.length}]`;
                  else interesting[full] = `[object:${Object.keys(v).sort().join('|')}]`;
                }
                if (v && typeof v === 'object' && !Array.isArray(v)) walk(v, full, depth+1);
              }
            };
            walk(p);
            console.log(`interesting=${redact(JSON.stringify(interesting)).slice(0,800)}`);
          } else if (raw) {
            console.log(`body_preview=${redact(raw).slice(0,300).replace(/\s+/g,' ')}`);
          }
          NODE
            fi
          done < /tmp/routes
