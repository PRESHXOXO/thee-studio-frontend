name: Temporary Owner Login End-to-End Check

on:
  push:
    branches:
      - ops/owner-login-diagnose-20260906
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe native owner/bootstrap routes without credentials
        shell: bash
        run: |
          set -euo pipefail
          base='https://studio.myvitaworld.online/api'
          ua='Mozilla/5.0 Chrome/152.0.0.0 Safari/537.36'
          cat > /tmp/routes <<'EOF'
          POST /auth/bootstrap-owner
          POST /auth/owner/bootstrap
          POST /owner/bootstrap
          POST /bootstrap-owner
          POST /admin/bootstrap-owner
          POST /auth/promote-owner
          POST /auth/claim-owner
          POST /auth/bootstrap
          GET /auth/owner/status
          GET /owner/status
          GET /admin/status
          GET /auth/config
          GET /auth/bootstrap
          EOF
          while read -r method path; do
            body=$(mktemp)
            if [ "$method" = POST ]; then
              code=$(curl -sS --compressed -A "$ua" -H 'Content-Type: application/json' -X POST --data '{}' -o "$body" -w '%{http_code}' "$base$path" || true)
            else
              code=$(curl -sS --compressed -A "$ua" -X GET -o "$body" -w '%{http_code}' "$base$path" || true)
            fi
            if [ "$code" != 404 ]; then
              printf 'EXISTS method=%s path=%s status=%s body=' "$method" "$path" "$code"
              head -c 300 "$body" | tr '\n' ' ' | sed -E 's/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}/[EMAIL]/g; s/(token|secret|password|authorization)(["=: ]+)[^," } ]+/\1\2[REDACTED]/Ig' || true
              echo
            fi
            rm -f "$body"
          done < /tmp/routes
