name: Recover Live Replacement Auth Adapter

on:
  push:
    branches:
      - ops/recover-live-adapter-20260906
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - name: Inventory compatibility-client surface used by main
        run: |
          set -eu
          echo 'function_invocations_begin'
          grep -RhoE "functions\.invoke\(['\"][^'\"]+" src | sed -E "s/.*invoke\(['\"]//" | sort -u || true
          echo 'function_invocations_end'
          echo 'query_methods_begin'
          grep -RhoE '\.(select|eq|neq|gt|gte|lt|lte|in|is|not|like|ilike|contains|containedBy|overlaps|order|limit|range|maybeSingle|single|insert|update|upsert|delete|remove|upload|download|createSignedUrl)\(' src | sed -E 's/^[.]//;s/[(]$//' | sort | uniq -c | sort -k2
          echo 'query_methods_end'
          echo 'api_related_files_begin'
          grep -RIlE "functions\.invoke|\.from\(|storage\.from|VITE_API_MODE|VITE_API_BASE" src | sort
          echo 'api_related_files_end'
