name: Recover Live Replacement Auth Adapter

on:
  push:
    branches:
      - ops/recover-live-adapter-20260906
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe replacement document persistence routes without credentials
        run: |
          set -eu
          base='https://studio.myvitaworld.online/api'
          ua='Mozilla/5.0 Chrome/152.0.0.0 Safari/537.36'
          for spec in \
            'GET /documents' \
            'POST /documents' \
            'PATCH /documents' \
            'PUT /documents' \
            'GET /documents/test' \
            'POST /documents/test' \
            'PATCH /documents/test' \
            'PUT /documents/test' \
            'DELETE /documents/test'; do
            method=${spec%% *}; path=${spec#* }
            body=$(mktemp)
            case "$method" in
              POST|PATCH|PUT) code=$(curl -sS --compressed -A "$ua" -H 'Content-Type: application/json' -X "$method" --data '{}' -o "$body" -w '%{http_code}' "$base$path" || true) ;;
              *) code=$(curl -sS --compressed -A "$ua" -X "$method" -o "$body" -w '%{http_code}' "$base$path" || true) ;;
            esac
            printf 'method=%s path=%s status=%s body=' "$method" "$path" "$code"
            head -c 220 "$body" | tr '\n' ' '
            echo
            rm -f "$body"
          done
