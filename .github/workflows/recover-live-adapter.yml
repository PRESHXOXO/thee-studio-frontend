name: Recover Live Replacement API Entitlements

on:
  push:
    branches:
      - ops/recover-live-adapter-20260906
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      CPANEL_SSH_HOST: ${{ secrets.CPANEL_SSH_HOST }}
      CPANEL_SSH_PORT: ${{ secrets.CPANEL_SSH_PORT }}
      CPANEL_SSH_USER: ${{ secrets.CPANEL_SSH_USER }}
      CPANEL_DEPLOY_PATH: ${{ secrets.CPANEL_DEPLOY_PATH }}

    steps:
      - name: Configure SSH
        env:
          CPANEL_SSH_PRIVATE_KEY: ${{ secrets.CPANEL_SSH_PRIVATE_KEY }}
          CPANEL_SSH_KNOWN_HOSTS: ${{ secrets.CPANEL_SSH_KNOWN_HOSTS }}
        run: |
          set -eu
          install -d -m 700 ~/.ssh
          printf '%s\n' "$CPANEL_SSH_PRIVATE_KEY" > ~/.ssh/cpanel_recovery
          printf '%s\n' "$CPANEL_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/cpanel_recovery ~/.ssh/known_hosts

      - name: Trace live API mount and credit guard read-only
        run: |
          set -eu
          test -n "$CPANEL_SSH_HOST"
          test -n "$CPANEL_SSH_PORT"
          test -n "$CPANEL_SSH_USER"
          test -n "$CPANEL_DEPLOY_PATH"
          ssh -i ~/.ssh/cpanel_recovery -p "$CPANEL_SSH_PORT" \
            "$CPANEL_SSH_USER@$CPANEL_SSH_HOST" \
            "CPANEL_DEPLOY_PATH='$CPANEL_DEPLOY_PATH' bash -s" <<'REMOTE'
          set -u
          echo '=== api_mount ==='
          for candidate in "$CPANEL_DEPLOY_PATH/api" "$(dirname "$CPANEL_DEPLOY_PATH")/api"; do
            echo "candidate=$candidate"
            if [ -e "$candidate" ]; then
              ls -ld "$candidate" || true
              readlink -f "$candidate" 2>/dev/null || true
              find "$candidate" -maxdepth 3 -type f \
                -not -name '.env' -not -name '.env.*' -not -path '*/node_modules/*' \
                -printf '%p\n' 2>/dev/null | head -120 || true
            else
              echo 'MISSING'
            fi
          done

          echo '=== all_generation_credit_matches ==='
          grep -RIn --exclude-dir=node_modules --exclude-dir=.git --exclude-dir=cache \
            --exclude='*.map' --exclude='*.log' -E 'generation credits|credit.*generation|status\(?402|code\(?402|402.*credit' \
            "$HOME" 2>/dev/null | head -220 || true

          echo '=== cast_credit_helper ==='
          helper="$HOME/thee-functions-20260827/_shared/cast_credits.ts"
          if [ -f "$helper" ]; then
            sed -n '1,260p' "$helper"
          else
            echo 'MISSING_CAST_CREDIT_HELPER'
          fi

          echo '=== api_related_top_level_dirs ==='
          find "$HOME" -maxdepth 3 -type d \
            \( -iname '*api*' -o -iname '*backend*' -o -iname '*server*' -o -iname '*studio*' -o -iname '*node*' \) \
            -not -path '*/node_modules*' -not -path '*/.git*' 2>/dev/null | head -160 || true
          REMOTE
