name: Test Dedicated Service User Recovery Access

on:
  push:
    branches:
      - ops/recover-live-adapter-20260906
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    env:
      CPANEL_SSH_HOST: ${{ secrets.CPANEL_SSH_HOST }}
      CPANEL_SSH_PORT: ${{ secrets.CPANEL_SSH_PORT }}

    steps:
      - name: Configure SSH
        env:
          CPANEL_SSH_PRIVATE_KEY: ${{ secrets.CPANEL_SSH_PRIVATE_KEY }}
          CPANEL_SSH_KNOWN_HOSTS: ${{ secrets.CPANEL_SSH_KNOWN_HOSTS }}
        run: |
          set -eu
          install -d -m 700 ~/.ssh
          printf '%s\n' "$CPANEL_SSH_PRIVATE_KEY" > ~/.ssh/cpanel_recovery
          printf '%s\n' "$CPANEL_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/cpanel_recovery ~/.ssh/known_hosts

      - name: Test service user key and inspect app if authorized
        run: |
          set -u
          set +e
          ssh -o BatchMode=yes -o ConnectTimeout=10 \
            -i ~/.ssh/cpanel_recovery -p "$CPANEL_SSH_PORT" \
            "thee-studio@$CPANEL_SSH_HOST" 'bash -s' <<'REMOTE' \
            | sed -E \
                -e 's/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}/[REDACTED_EMAIL]/g' \
                -e 's/[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}/[REDACTED_UUID]/g' \
                -e 's/(password|secret|token|api[_-]?key)([[:space:]]*[:=][[:space:]]*)[^,;[:space:]]+/\1\2[REDACTED]/Ig' \
            | tee service-user-access-summary.txt
          set -u
          echo 'SERVICE_USER_LOGIN=AUTHORIZED'
          id
          app=/opt/thee-studio-app
          echo '--- APP_FILES ---'
          find "$app" -maxdepth 4 -type f \
            -not -path '*/node_modules/*' -not -path '*/.git/*' \
            -not -name '.env' -not -name '.env.*' -printf '%P\n' 2>/dev/null | sort | head -220 || true
          echo '--- EXACT_402_GUARD ---'
          files=$(grep -RIl --exclude-dir=node_modules --exclude-dir=.git --exclude='.env' --exclude='.env.*' \
            'Insufficient generation credits' "$app" 2>/dev/null | head -10 || true)
          [ -n "$files" ] || echo 'GUARD_LITERAL=NOT_FOUND'
          while IFS= read -r file; do
            [ -n "$file" ] || continue
            echo "FILE=${file#$app/}"
            grep -n -C 30 'Insufficient generation credits' "$file" 2>/dev/null | head -160 || true
          done <<EOF
          $files
          EOF
          echo '--- ENTITLEMENT_SYMBOLS ---'
          grep -RIn --exclude-dir=node_modules --exclude-dir=.git --exclude='.env' --exclude='.env.*' \
            -E 'internal_owner|billing_exempt|credit_deduction_enabled|usage_tracking_enabled|all_features|admin_access_enabled|generation_credits|credit_balance|entitlement|reply\.code\(402\)' \
            "$app/src" "$app/scripts" "$app/migrations" "$app/db" 2>/dev/null | head -360 || true
          echo '--- REPAIR_FILES ---'
          find "$app" -maxdepth 7 -type f \
            \( -iname '*.sql' -o -iname '*migration*' -o -iname '*schema*' -o -iname '*seed*' -o -iname '*install*' -o -iname '*hydrate*' -o -iname '*repair*' -o -iname '*entitlement*' -o -iname '*credit*' \) \
            -not -path '*/node_modules/*' -not -path '*/.git/*' -not -name '.env' -not -name '.env.*' -printf '%P\n' 2>/dev/null | sort | head -200 || true
          REMOTE
          rc=${PIPESTATUS[0]}
          set -e
          if [ "$rc" -ne 0 ]; then
            printf 'SERVICE_USER_LOGIN=DENIED rc=%s\n' "$rc" > service-user-access-summary.txt
          fi
          cat service-user-access-summary.txt

      - name: Upload access summary
        uses: actions/upload-artifact@v4
        with:
          name: service-user-access-summary
          path: service-user-access-summary.txt
          if-no-files-found: error
          retention-days: 1
