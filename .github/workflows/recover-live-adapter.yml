name: Recover Live Replacement Auth Adapter

on:
  push:
    branches:
      - ops/recover-live-adapter-20260906
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fetch live production bundle and print only replacement-auth adapter context
        run: |
          set -eu
          ua='Mozilla/5.0 Chrome/152.0.0.0 Safari/537.36'
          host='https://studio.myvitaworld.online'
          curl -fsSL --compressed -A "$ua" "$host/" -o /tmp/index.html
          js=$(grep -oE 'src="/assets/[^"]+\.js"' /tmp/index.html | head -1 | cut -d'"' -f2)
          echo "bundle_path=$js"
          curl -fsSL --compressed -A "$ua" "$host$js" -o /tmp/app.js
          echo "bundle_bytes=$(wc -c < /tmp/app.js | tr -d ' ')"
          tail -c 500 /tmp/app.js | grep -oE 'sourceMappingURL=[^[:space:]]+' || true
          python3 <<'PY'
          from pathlib import Path
          s=Path('/tmp/app.js').read_text(errors='replace')
          needles=['async function pa(', 'function UE(', 'function e_(', '/auth/signup', '/compat/', 'createSignedUrl']
          for n in needles:
              i=s.find(n)
              print(f'needle={n} index={i}')
          start=s.find('async function pa(')
          if start < 0:
              start=max(0,s.find('/auth/signup')-6000)
          end=min(len(s), start+50000)
          print('adapter_context_begin')
          print(s[start:end])
          print('adapter_context_end')
          PY
