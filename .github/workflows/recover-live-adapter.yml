name: Recover Live Replacement API Entitlements

on:
  push:
    branches:
      - ops/recover-live-adapter-20260906
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      CPANEL_SSH_HOST: ${{ secrets.CPANEL_SSH_HOST }}
      CPANEL_SSH_PORT: ${{ secrets.CPANEL_SSH_PORT }}
      CPANEL_SSH_USER: ${{ secrets.CPANEL_SSH_USER }}

    steps:
      - name: Configure SSH
        env:
          CPANEL_SSH_PRIVATE_KEY: ${{ secrets.CPANEL_SSH_PRIVATE_KEY }}
          CPANEL_SSH_KNOWN_HOSTS: ${{ secrets.CPANEL_SSH_KNOWN_HOSTS }}
        run: |
          set -eu
          install -d -m 700 ~/.ssh
          printf '%s\n' "$CPANEL_SSH_PRIVATE_KEY" > ~/.ssh/cpanel_recovery
          printf '%s\n' "$CPANEL_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/cpanel_recovery ~/.ssh/known_hosts

      - name: Inspect Fastify auth-hydration recovery artifact read-only
        run: |
          set -eu
          ssh -i ~/.ssh/cpanel_recovery -p "$CPANEL_SSH_PORT" \
            "$CPANEL_SSH_USER@$CPANEL_SSH_HOST" 'bash -s' <<'REMOTE'
          set -u
          backup=$(find "$HOME/deploy-backups/studio" -maxdepth 2 -type d \
            -name 'cast-fastify-auth-hydration-*' 2>/dev/null | sort | tail -1)

          echo '=== recovery_artifact ==='
          if [ -z "$backup" ] || [ ! -d "$backup" ]; then
            echo 'MISSING_AUTH_HYDRATION_BACKUP'
            exit 2
          fi
          echo "backup=$backup"

          echo '=== recovery_tree ==='
          find "$backup" -maxdepth 6 -type f \
            -not -path '*/node_modules/*' -not -path '*/.git/*' \
            -not -name '.env' -not -name '.env.*' \
            -printf '%p\n' 2>/dev/null | sort | head -360 || true

          echo '=== package_files ==='
          find "$backup" -maxdepth 6 -type f -name package.json \
            -not -path '*/node_modules/*' 2>/dev/null | while read -r pkg; do
              echo "--- $pkg ---"
              cat "$pkg"
            done

          echo '=== exact_credit_guard ==='
          matches=$(grep -RIl --exclude-dir=node_modules --exclude-dir=.git \
            --exclude='.env' --exclude='.env.*' --exclude='*.map' --exclude='*.log' \
            'Insufficient generation credits' "$backup" 2>/dev/null | head -30 || true)
          if [ -z "$matches" ]; then
            echo 'NO_EXACT_GUARD_MATCH'
          else
            printf '%s\n' "$matches"
            while IFS= read -r file; do
              [ -n "$file" ] || continue
              echo "--- $file ---"
              grep -n -C 55 'Insufficient generation credits' "$file" 2>/dev/null | head -260 || true
            done <<EOF
          $matches
          EOF
          fi

          echo '=== owner_entitlement_symbols ==='
          grep -RIn --exclude-dir=node_modules --exclude-dir=.git \
            --exclude='.env' --exclude='.env.*' --exclude='*.map' --exclude='*.log' \
            -E 'internal_owner|billing_exempt|billingExempt|credit_deduction|creditDeduction|usage_tracking|usageTracking|all_features|allFeatures|admin_access|adminAccess|entitlement|generation_credits|generationCredits|credit_balance|creditBalance|credits_remaining|creditsRemaining|owner' \
            "$backup" 2>/dev/null | head -520 || true

          echo '=== migrations_schema_install_files ==='
          find "$backup" -maxdepth 8 -type f \
            \( -iname '*.sql' -o -iname '*migration*' -o -iname '*schema*' -o -iname '*seed*' -o -iname '*install*' -o -iname '*hydrate*' -o -iname '*entitlement*' -o -iname '*credit*' \) \
            -not -path '*/node_modules/*' -not -path '*/.git/*' \
            -not -name '.env' -not -name '.env.*' -print 2>/dev/null | sort | head -260 || true

          echo '=== likely_migration_contents ==='
          find "$backup" -maxdepth 8 -type f \
            \( -iname '*.sql' -o -iname '*migration*.js' -o -iname '*migration*.mjs' -o -iname '*seed*.js' -o -iname '*seed*.mjs' -o -iname '*install*.js' -o -iname '*install*.mjs' -o -iname '*hydrate*.js' -o -iname '*hydrate*.mjs' \) \
            -not -path '*/node_modules/*' -not -path '*/.git/*' 2>/dev/null | head -50 | while read -r file; do
              echo "--- $file ---"
              sed -n '1,420p' "$file" \
                | sed -E 's/(password|secret|token|api[_-]?key)[[:space:]]*[:=][[:space:]]*[^,;[:space:]]+/\1=[REDACTED]/Ig' \
                | head -460
            done

          echo '=== recovery_metadata_and_logs ==='
          find "$backup" -maxdepth 5 -type f \
            \( -iname '*.txt' -o -iname '*.md' -o -iname '*.log' -o -iname '*manifest*' -o -iname '*meta*' \) \
            -not -name '.env' -not -name '.env.*' 2>/dev/null | head -50 | while read -r file; do
              echo "--- $file ---"
              grep -Ei -n -C 4 'fastify|maria|mysql|entitlement|credit|owner|install|deploy|source|path|passenger' "$file" 2>/dev/null | head -180 || true
            done
          REMOTE
