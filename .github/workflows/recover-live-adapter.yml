name: Trace Live Replacement API Mount

on:
  push:
    branches:
      - ops/recover-live-adapter-20260906
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      CPANEL_SSH_HOST: ${{ secrets.CPANEL_SSH_HOST }}
      CPANEL_SSH_PORT: ${{ secrets.CPANEL_SSH_PORT }}
      CPANEL_SSH_USER: ${{ secrets.CPANEL_SSH_USER }}
      CPANEL_DEPLOY_PATH: ${{ secrets.CPANEL_DEPLOY_PATH }}

    steps:
      - name: Configure SSH
        env:
          CPANEL_SSH_PRIVATE_KEY: ${{ secrets.CPANEL_SSH_PRIVATE_KEY }}
          CPANEL_SSH_KNOWN_HOSTS: ${{ secrets.CPANEL_SSH_KNOWN_HOSTS }}
        run: |
          set -eu
          install -d -m 700 ~/.ssh
          printf '%s\n' "$CPANEL_SSH_PRIVATE_KEY" > ~/.ssh/cpanel_recovery
          printf '%s\n' "$CPANEL_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/cpanel_recovery ~/.ssh/known_hosts

      - name: Trace mount read-only
        run: |
          set -eu
          ssh -i ~/.ssh/cpanel_recovery -p "$CPANEL_SSH_PORT" \
            "$CPANEL_SSH_USER@$CPANEL_SSH_HOST" \
            "CPANEL_DEPLOY_PATH='$CPANEL_DEPLOY_PATH' bash -s" <<'REMOTE' \
            | sed -E \
                -e 's/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}/[REDACTED_EMAIL]/g' \
                -e 's/[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}/[REDACTED_UUID]/g' \
                -e 's/(password|secret|token|api[_-]?key)([[:space:]]*[:=][[:space:]]*)[^,;[:space:]]+/\1\2[REDACTED]/Ig' \
            | tee live-api-mount-summary.txt
          set -u
          echo '--- IDENTITY ---'
          printf 'HOME=%s\n' "$HOME"
          printf 'DEPLOY_BASENAME=%s\n' "$(basename "$CPANEL_DEPLOY_PATH")"

          echo '--- LIVE_NODE_PASSENGER_PROCESSES ---'
          ps auxww 2>/dev/null | grep -E '[n]ode|[p]assenger|[f]astify' | head -80 || true

          echo '--- DEPLOY_HTACCESS ---'
          for f in "$CPANEL_DEPLOY_PATH/.htaccess" "$(dirname "$CPANEL_DEPLOY_PATH")/.htaccess" "$HOME/public_html/.htaccess"; do
            if [ -f "$f" ]; then
              echo "FILE=$f"
              grep -n -E -C 4 'api|Passenger|Proxy|RewriteRule|RewriteCond|127\.0\.0\.1|localhost|node|fastify' "$f" 2>/dev/null | head -160 || true
            fi
          done

          echo '--- CPANEL_NODE_CONFIG_CANDIDATES ---'
          find "$HOME" -maxdepth 6 -type f \
            \( -path '*/.cpanel/*' -o -path '*/.cl.selector/*' -o -path '*/nodevenv/*' -o -iname '*passenger*' -o -iname '*node*app*' \) \
            -not -name '.env' -not -name '.env.*' -not -path '*/node_modules/*' 2>/dev/null | head -160 || true

          echo '--- APP_ROOT_REFERENCES ---'
          grep -RIn --exclude-dir=node_modules --exclude-dir=.git --exclude-dir=cache \
            --exclude='.env' --exclude='.env.*' --exclude='*.log' --exclude='*.map' \
            -E 'thee-studio-fastify|PassengerAppRoot|PassengerStartupFile|ProxyPass|ProxyPassReverse|127\.0\.0\.1:[0-9]+|localhost:[0-9]+|studio/api|/api/readyz' \
            "$HOME/.cpanel" "$HOME/.cl.selector" "$HOME/public_html" "$HOME/deploy-backups" 2>/dev/null | head -260 || true

          echo '--- FASTIFY_PACKAGES_ANYWHERE_HOME ---'
          find "$HOME" -maxdepth 10 -type f -name package.json \
            -not -path '*/node_modules/*' -not -path '*/.git/*' 2>/dev/null | while read -r pkg; do
              if grep -qi '"fastify"' "$pkg" 2>/dev/null; then
                echo "PACKAGE=$pkg"
                grep -E '"name"|"version"|"fastify"|"mariadb"|"mysql2"' "$pkg" | head -20 || true
              fi
            done | head -80 || true

          echo '--- API_READYZ ---'
          curl --fail --silent --show-error --max-time 15 https://studio.myvitaworld.online/api/readyz 2>/dev/null | head -c 800 || true
          echo
          REMOTE

      - name: Upload mount summary
        uses: actions/upload-artifact@v4
        with:
          name: live-api-mount-summary
          path: live-api-mount-summary.txt
          if-no-files-found: error
          retention-days: 1
