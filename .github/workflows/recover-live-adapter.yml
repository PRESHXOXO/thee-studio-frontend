name: Recover Live Replacement Auth Adapter

on:
  push:
    branches:
      - ops/recover-live-adapter-20260906
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - name: Inventory frontend table calls
        run: |
          set -eu
          echo 'tables_begin'
          grep -RhoE "\.from\(['\"][A-Za-z0-9_/-]+['\"]\)" src | sed -E "s/.*\.from\(['\"]//;s/['\"]\).*//" | sort | uniq -c | sort -k2
          echo 'tables_end'
          echo 'storage_buckets_begin'
          grep -RhoE "storage\.from\(['\"][A-Za-z0-9_-]+['\"]\)" src | sed -E "s/.*storage\.from\(['\"]//;s/['\"]\).*//" | sort | uniq -c | sort -k2
          echo 'storage_buckets_end'
