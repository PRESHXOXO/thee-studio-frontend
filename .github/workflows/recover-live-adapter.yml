name: Probe Replacement API Routes

on:
  push:
    branches:
      - ops/recover-live-adapter-20260906
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe bounded GET-only route set
        shell: bash
        run: |
          set -u
          base='https://studio.myvitaworld.online/api'
          routes='readyz openapi.json swagger.json docs docs/json auth/me auth/csrf access credits account admin/entitlements admin/access admin/credits admin/reconcile internal/entitlements internal/access internal/reconcile'
          : > api-route-probe.txt
          for route in $routes; do
            body="$(mktemp)"
            code="$(curl -sS -m 12 -o "$body" -w '%{http_code}' "$base/$route" || echo 000)"
            printf 'ROUTE=/%s STATUS=%s\n' "$route" "$code" >> api-route-probe.txt
            head -c 700 "$body" \
              | tr '\n\r' '  ' \
              | sed -E \
                  -e 's/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}/[REDACTED_EMAIL]/g' \
                  -e 's/[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}/[REDACTED_UUID]/g' \
              | sed 's/^/BODY=/' >> api-route-probe.txt
            printf '\n\n' >> api-route-probe.txt
            rm -f "$body"
          done
          cat api-route-probe.txt

      - name: Upload route probe
        uses: actions/upload-artifact@v4
        with:
          name: api-route-probe
          path: api-route-probe.txt
          retention-days: 1
