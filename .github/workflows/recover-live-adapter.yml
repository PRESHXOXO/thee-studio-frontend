name: Recover Live Replacement Auth Adapter

on:
  push:
    branches:
      - ops/recover-live-adapter-20260906
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe account self-delete routes without credentials
        run: |
          set -eu
          base='https://studio.myvitaworld.online/api'
          ua='Mozilla/5.0 Chrome/152.0.0.0 Safari/537.36'
          for path in /auth/me /auth/account /account /me /users/me; do
            body=$(mktemp)
            code=$(curl -sS --compressed -A "$ua" -X DELETE -o "$body" -w '%{http_code}' "$base$path" || true)
            printf 'method=DELETE path=%s status=%s body=' "$path" "$code"
            head -c 250 "$body" | tr '\n' ' '
            echo
            rm -f "$body"
          done
