name: Recover Live Replacement API Entitlements

on:
  push:
    branches:
      - ops/recover-live-adapter-20260906
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      CPANEL_SSH_HOST: ${{ secrets.CPANEL_SSH_HOST }}
      CPANEL_SSH_PORT: ${{ secrets.CPANEL_SSH_PORT }}
      CPANEL_SSH_USER: ${{ secrets.CPANEL_SSH_USER }}

    steps:
      - name: Configure SSH
        env:
          CPANEL_SSH_PRIVATE_KEY: ${{ secrets.CPANEL_SSH_PRIVATE_KEY }}
          CPANEL_SSH_KNOWN_HOSTS: ${{ secrets.CPANEL_SSH_KNOWN_HOSTS }}
        run: |
          set -eu
          install -d -m 700 ~/.ssh
          printf '%s\n' "$CPANEL_SSH_PRIVATE_KEY" > ~/.ssh/cpanel_recovery
          printf '%s\n' "$CPANEL_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/cpanel_recovery ~/.ssh/known_hosts

      - name: Locate and inspect Fastify entitlement path read-only
        run: |
          set -eu
          ssh -i ~/.ssh/cpanel_recovery -p "$CPANEL_SSH_PORT" \
            "$CPANEL_SSH_USER@$CPANEL_SSH_HOST" 'bash -s' <<'REMOTE'
          set -u
          echo '=== locate_candidates ==='
          find "$HOME" -maxdepth 6 -type d \
            \( -iname 'thee-studio-fastify' -o -iname '*studio*fastify*' -o -iname '*fastify*' \) \
            -not -path '*/node_modules/*' -not -path '*/.git/*' -print 2>/dev/null | head -40 || true
          find "$HOME" -maxdepth 7 -type f -name package.json \
            -not -path '*/node_modules/*' -not -path '*/.git/*' 2>/dev/null | while read -r pkg; do
              if grep -qi '"fastify"' "$pkg" 2>/dev/null; then
                echo "FASTIFY_PACKAGE=$pkg"
              fi
            done | head -40 || true

          app=''
          for candidate in \
            "$HOME/thee-studio-fastify" \
            "$HOME/public_html/thee-studio-fastify" \
            "$HOME/public_html/studio/thee-studio-fastify"; do
            if [ -f "$candidate/package.json" ] && grep -qi '"fastify"' "$candidate/package.json" 2>/dev/null; then
              app="$candidate"
              break
            fi
          done
          if [ -z "$app" ]; then
            pkg=$(find "$HOME" -maxdepth 7 -type f -name package.json \
              -not -path '*/node_modules/*' -not -path '*/.git/*' 2>/dev/null | while read -r p; do
                grep -qi '"fastify"' "$p" 2>/dev/null && { echo "$p"; break; }
              done)
            [ -n "$pkg" ] && app=$(dirname "$pkg")
          fi

          echo '=== selected_backend ==='
          if [ -z "$app" ]; then
            echo 'NO_LIVE_FASTIFY_ROOT_FOUND'
          else
            echo "app=$app"
            git -C "$app" branch --show-current 2>/dev/null || true
            git -C "$app" rev-parse HEAD 2>/dev/null || true
            git -C "$app" status --short 2>/dev/null || true

            echo '=== package_json ==='
            cat "$app/package.json" 2>/dev/null || true

            echo '=== backend_files ==='
            find "$app" -maxdepth 4 -type f \
              -not -path '*/node_modules/*' -not -path '*/.git/*' \
              -not -name '.env' -not -name '.env.*' \
              -printf '%p\n' 2>/dev/null | sort | head -260 || true

            echo '=== exact_402_guard ==='
            guard_files=$(grep -RIl --exclude-dir=node_modules --exclude-dir=.git \
              --exclude='.env' --exclude='.env.*' --exclude='*.map' --exclude='*.log' \
              'Insufficient generation credits' "$app" 2>/dev/null | head -20 || true)
            if [ -z "$guard_files" ]; then
              echo 'NO_EXACT_GUARD_MATCH'
            else
              printf '%s\n' "$guard_files"
              while IFS= read -r file; do
                [ -n "$file" ] || continue
                echo "--- $file ---"
                grep -n -C 45 'Insufficient generation credits' "$file" 2>/dev/null | head -220 || true
              done <<EOF
          $guard_files
          EOF
            fi

            echo '=== entitlement_credit_symbols ==='
            grep -RIn --exclude-dir=node_modules --exclude-dir=.git \
              --exclude='.env' --exclude='.env.*' --exclude='*.map' --exclude='*.log' \
              -E 'entitlement|internal_owner|billing_exempt|credit_deduction|generation_credits|generationCredits|credits_remaining|creditsRemaining|credit_balance|creditBalance|Insufficient.*credits|reply\.code\(402\)|status\(402\)' \
              "$app" 2>/dev/null | head -420 || true

            echo '=== migrations_and_schema ==='
            find "$app" -maxdepth 7 -type f \
              \( -iname '*.sql' -o -iname '*migration*' -o -iname '*schema*' -o -iname '*seed*' -o -iname '*install*' \) \
              -not -path '*/node_modules/*' -not -path '*/.git/*' \
              -not -name '.env' -not -name '.env.*' -print 2>/dev/null | sort | head -180 || true
          fi

          echo '=== public_api_locations ==='
          find "$HOME" -maxdepth 7 -type d -path '*/studio/api' -print 2>/dev/null | head -30 || true
          find "$HOME" -maxdepth 7 -type f \
            \( -name '.htaccess' -o -name 'app.js' -o -name 'server.js' -o -name 'index.js' \) \
            -path '*studio/api/*' -not -path '*/node_modules/*' -print 2>/dev/null | head -80 || true
          REMOTE
