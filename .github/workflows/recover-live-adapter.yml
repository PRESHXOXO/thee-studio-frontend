name: Recover Live Replacement Auth Adapter

on:
  push:
    branches:
      - ops/recover-live-adapter-20260906
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Inspect generic replacement login errors using dummy credentials
        run: |
          set -eu
          base='https://studio.myvitaworld.online/api/auth/login'
          ua='Mozilla/5.0 Chrome/152.0.0.0 Safari/537.36'
          for payload in \
            '{"email":"nobody-cutover-test@example.com","password":"definitely-not-a-real-password"}' \
            '{"email":"not-an-email","password":"definitely-not-a-real-password"}'; do
            body=$(mktemp)
            code=$(curl -sS --compressed -A "$ua" -H 'Content-Type: application/json' -o "$body" -w '%{http_code}' -X POST --data "$payload" "$base" || true)
            printf 'status=%s body=' "$code"
            cat "$body" | tr '\n' ' '
            echo
            rm -f "$body"
          done
