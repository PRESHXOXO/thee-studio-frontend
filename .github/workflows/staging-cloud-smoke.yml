name: Staging Cloud Smoke

on:
  workflow_dispatch:
  push:
    branches:
      - release-smoke-2026-08-18

concurrency:
  group: staging-cloud-smoke
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      STAGING_BASE_URL: https://thee-studio-frontend-git-codex-recon-16c428-preshxoxos-projects.vercel.app
      STAGING_SMOKE_EMAIL: ${{ secrets.STAGING_SMOKE_EMAIL }}
      STAGING_SMOKE_PASSWORD: ${{ secrets.STAGING_SMOKE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Verify dedicated staging smoke credentials are configured
        run: |
          test -n "$STAGING_SMOKE_EMAIL" || (echo "Missing STAGING_SMOKE_EMAIL GitHub Actions secret" && exit 1)
          test -n "$STAGING_SMOKE_PASSWORD" || (echo "Missing STAGING_SMOKE_PASSWORD GitHub Actions secret" && exit 1)
      - name: Crawl authenticated cloud surfaces
        run: node e2e-audit/staging-cloud-smoke.mjs
