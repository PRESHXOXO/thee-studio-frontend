name: Staging Cloud Smoke

on:
  push:
    branches:
      - codex/reconcile-full-frontend
  workflow_dispatch:

concurrency:
  group: staging-cloud-smoke
  cancel-in-progress: true

jobs:
  smoke:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[release-smoke]')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      STAGING_BASE_URL: https://thee-studio-frontend-git-codex-recon-16c428-preshxoxos-projects.vercel.app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Create throwaway Free customer and crawl authenticated cloud surfaces
        run: node e2e-audit/staging-cloud-smoke.mjs
